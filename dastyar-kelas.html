<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دستیار مدیریت کلاس</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FFF7EE; --card:#FFFFFF; --ink:#3D2C22; --muted:#9A7B68;
  --pri:#D96C4A; --pri-d:#C25436; --acc:#4E9B8F; --warn:#C0392B;
  --line:#F0DFCE; --chip:#FDEEE3; --shadow:0 2px 10px rgba(160,100,60,.10);
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.7;padding-bottom:86px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#E8835F,#D96C4A);color:#fff;padding:14px 16px 12px;box-shadow:0 2px 8px rgba(180,90,50,.25)}
header h1{margin:0;font-size:19px;font-weight:800}
header p{margin:2px 0 0;font-size:12.5px;opacity:.92}
main{max-width:560px;margin:0 auto;padding:14px 12px 8px}
h2.sec{font-size:16px;margin:18px 2px 8px;color:var(--pri-d)}
.guide{background:#FFF3E2;border:1px dashed #EBCB9F;border-radius:12px;padding:9px 12px;font-size:13px;color:#8A6A45;margin:0 0 12px}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:16px;padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty .big{font-size:34px;display:block;margin-bottom:6px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.card .num{font-size:26px;font-weight:800;color:var(--pri-d);line-height:1.3}
.card .lbl{font-size:13px;color:var(--muted)}
.card .sub{font-size:12px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
svg.chart{width:100%;height:auto;display:block}
.rowitem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
.rowitem .grow{flex:1;min-width:0}
.rowitem .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowitem .meta{font-size:12.5px;color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--chip);color:var(--pri-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--chip);color:var(--pri-d)}
.badge.red{background:#FDECEA;color:var(--warn)}
.badge.green{background:#E6F4EA;color:#2E7D4F}
.trend{font-weight:800;font-size:15px}
.trend.up{color:#2E7D4F}.trend.dn{color:var(--warn)}.trend.flat{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:10px 16px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--pri);color:#fff;min-height:44px}
.btn:active{background:var(--pri-d)}
.btn.ghost{background:#fff;color:var(--pri-d);border:1.5px solid var(--pri)}
.btn.soft{background:var(--chip);color:var(--pri-d)}
.btn.danger{background:#fff;color:var(--warn);border:1.5px solid #F0C4BE}
.btn.small{padding:6px 12px;min-height:38px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.iconbtn{border:none;background:var(--chip);color:var(--pri-d);width:38px;height:38px;border-radius:10px;font-size:16px;cursor:pointer;flex:none}
.iconbtn.red{background:#FDECEA;color:var(--warn)}
.fab{display:block;width:100%;margin:4px 0 12px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,select,textarea:focus{outline:2px solid #F3C6AC;border-color:var(--pri)}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.searchbar{margin-bottom:12px}
nav#tabbar{position:fixed;bottom:0;right:0;left:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;box-shadow:0 -2px 10px rgba(160,100,60,.08);padding-bottom:env(safe-area-inset-bottom)}
nav#tabbar button{flex:1;border:none;background:none;padding:8px 2px 7px;font-family:inherit;font-size:11.5px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:58px}
nav#tabbar button .ic{font-size:21px;line-height:1.2}
nav#tabbar button.on{color:var(--pri-d);font-weight:800}
#modalWrap{position:fixed;inset:0;z-index:50;display:none}
#modalWrap.open{display:block}
#modalWrap .scrim{position:absolute;inset:0;background:rgba(61,44,34,.45)}
.sheet{position:absolute;right:0;left:0;bottom:0;margin:0 auto;width:min(96vw,480px);max-height:90vh;overflow-y:auto;overflow-x:hidden;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -4px 24px rgba(0,0,0,.2)}
.sheet h3{margin:0 0 6px;font-size:17px}
.sheet .x{position:absolute;top:12px;left:12px}
.sheetwrap{position:relative}
.btnrow{display:flex;gap:8px;margin-top:16px}
.btnrow .btn{flex:1}
.scoregrid .srow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #F7EADB}
.scoregrid .srow:last-child{border-bottom:none}
.scoregrid .sname{flex:1;min-width:0;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scoregrid input{width:78px;flex:none;text-align:center}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #F7EADB;font-size:14px}
.kv:last-child{border-bottom:none}
.kv b{color:var(--pri-d)}
#toast{position:fixed;bottom:96px;right:50%;transform:translateX(50%) translateY(20px);background:#3D2C22;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(50%) translateY(0)}
#toast.err{background:var(--warn)}
.msg{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px;display:none}
.msg.ok{display:block;background:#E6F4EA;color:#2E7D4F}
.msg.err{display:block;background:#FDECEA;color:var(--warn)}
.monthttl{font-size:14px;font-weight:800;color:var(--pri-d);margin:14px 2px 6px}
.done-topic{text-decoration:line-through;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
a{color:var(--pri-d)}
#printArea{display:none}
@page{margin:12mm}
@media print{
  header,main,nav#tabbar,#modalWrap,#toast{display:none!important}
  body{padding:0;background:#fff}
  #printArea{display:block!important;color:#000;font-size:13px}
  #printArea .phead{text-align:center;border:1.5px solid #444;border-radius:8px;padding:8px 10px;margin-bottom:10px}
  #printArea .phead .l1{font-weight:800;font-size:14.5px}
  #printArea .phead .l2{font-size:13px;margin-top:2px}
  #printArea .phead .l3{font-size:11.5px;color:#333;margin-top:2px}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #777;padding:5px 7px;text-align:right;font-size:12.5px}
  #printArea th{background:#eee;font-weight:800}
  #printArea .pfoot{margin-top:10px;font-size:12.5px}
}
</style>
</head>
<body>
<header>
  <h1>🌸 دستیار مدیریت کلاس</h1>
  <p>پایهٔ ششم دبستان دخترانه — دانش‌آموزان، آزمون‌ها و برنامهٔ درسی</p>
</header>
<main id="app"></main>
<nav id="tabbar">
  <button data-tab="dash"><span class="ic">🏠</span>داشبورد</button>
  <button data-tab="students"><span class="ic">👧</span>دانش‌آموزان</button>
  <button data-tab="exams"><span class="ic">📝</span>آزمون‌ها</button>
  <button data-tab="plan"><span class="ic">📚</span>برنامهٔ درسی</button>
  <button data-tab="settings"><span class="ic">⚙️</span>تنظیمات</button>
</nav>
<div id="modalWrap"><div class="scrim" onclick="closeDlg()"></div><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="printArea"></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">
<script>
'use strict';
/* ===== داده و ذخیره‌سازی ===== */
var LS_DB='dk_db_v1', LS_CFG='dk_sync_cfg';
var SUBJECTS=['ریاضی','فارسی','علوم','مطالعات اجتماعی','هدیه‌های آسمان','قرآن','هنر','ورزش','تفکر و پژوهش'];
var MONTHS=['مهر','آبان','آذر','دی','بهمن','اسفند','فروردین','اردیبهشت','خرداد'];
function emptyDb(){return {students:[],exams:[],scores:{},plan:[],_rev:0};}
function loadDb(){
  try{var raw=localStorage.getItem(LS_DB); if(!raw) return emptyDb();
    var d=JSON.parse(raw); if(!d||typeof d!=='object') return emptyDb();
    d.students=d.students||[]; d.exams=d.exams||[]; d.scores=d.scores||{}; d.plan=d.plan||[]; d._rev=d._rev||0; return d;
  }catch(e){return emptyDb();}
}
var db=loadDb();
function saveDb(){ try{localStorage.setItem(LS_DB,JSON.stringify(db));}catch(e){toast('خطا در ذخیره‌سازی',true);} }
function syncCfg(){ try{return JSON.parse(localStorage.getItem(LS_CFG)||'{}');}catch(e){return {};} }
function saveSyncCfg(c){ try{localStorage.setItem(LS_CFG,JSON.stringify(c));}catch(e){} }
function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ===== ابزارها ===== */
var FA='۰۱۲۳۴۵۶۷۸۹';
function fa(x){ if(x===null||x===undefined||x==='') return '—'; return String(x).replace(/[0-9]/g,function(d){return FA[+d];}).replace(/\./g,'٫'); }
function faNum(x,dec){ if(x===null||x===undefined||isNaN(x)) return '—'; var s=(dec!=null)?Number(x).toFixed(dec):String(Math.round(Number(x)*100)/100); return fa(s); }
function faScore(v){ if(v===null||v===undefined||isNaN(v)) return '—'; return fa(String(Math.round(Number(v)*100)/100)); }
function enDigits(s){ return String(s||'').replace(/[۰-۹]/g,function(d){return FA.indexOf(d);}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}); }
function parseScore(s){ s=enDigits(String(s||'').trim()).replace('٫','.').replace(',','.'); if(s==='') return null; var n=parseFloat(s); if(isNaN(n)||n<0||n>20) return undefined; return n; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(t,err){ var el=document.getElementById('toast'); el.textContent=t; el.className='show'+(err?' err':''); setTimeout(function(){el.className='';},2600); }
function dateKey(d){ return enDigits(d||'').replace(/[^0-9]/g,''); }
function examsSorted(){ return db.exams.slice().sort(function(a,b){ var ka=dateKey(a.date),kb=dateKey(b.date); if(ka<kb) return -1; if(ka>kb) return 1; return 0; }); }
function studentById(id){ for(var i=0;i<db.students.length;i++) if(db.students[i].id===id) return db.students[i]; return null; }
function examById(id){ for(var i=0;i<db.exams.length;i++) if(db.exams[i].id===id) return db.exams[i]; return null; }
function scoreOf(examId,studentId){ var m=db.scores[examId]; if(!m) return null; var v=m[studentId]; return (v===null||v===undefined||v==='')?null:Number(v); }
function examScores(examId){ var out=[]; db.students.forEach(function(s){ var v=scoreOf(examId,s.id); if(v!==null) out.push(v); }); return out; }
function avgOf(arr){ if(!arr.length) return null; var t=0; arr.forEach(function(v){t+=v;}); return t/arr.length; }
function examAvg(examId){ return avgOf(examScores(examId)); }
function studentEntries(studentId){ var out=[]; examsSorted().forEach(function(e){ var v=scoreOf(e.id,studentId); if(v!==null) out.push({exam:e,score:v}); }); return out; }
function studentAvg(studentId){ var es=studentEntries(studentId); return avgOf(es.map(function(x){return x.score;})); }
function allScoresAvg(){ var all=[]; db.exams.forEach(function(e){ all=all.concat(examScores(e.id)); }); return avgOf(all); }
function studentTrend(studentId){ var es=studentEntries(studentId); if(es.length<2) return null; var d=es[es.length-1].score-es[es.length-2].score; return Math.round(d*100)/100; }
function needsAttention(){
  var ca=allScoresAvg(), out=[];
  db.students.forEach(function(s){
    var es=studentEntries(s.id); if(!es.length) return;
    var reasons=[];
    var tr=studentTrend(s.id); if(tr!==null&&tr<0) reasons.push('افت نمره در آخرین آزمون‌ها');
    var av=studentAvg(s.id); if(ca!==null&&av!==null&&av<ca-2) reasons.push('میانگین پایین‌تر از کلاس');
    if(reasons.length) out.push({student:s,reasons:reasons,avg:av,trend:tr});
  });
  return out;
}
function planProgress(){ if(!db.plan.length) return null; var d=db.plan.filter(function(p){return p.status==='done';}).length; return Math.round(d/db.plan.length*100); }

/* ===== ناوبری و رندر ===== */
var curTab='dash', chartSubject='همه', studentQuery='', detailStudent=null;
var app=document.getElementById('app');
document.querySelectorAll('#tabbar button').forEach(function(b){ b.addEventListener('click',function(){ go(b.getAttribute('data-tab')); }); });
function go(tab){ curTab=tab; detailStudent=null; render(); window.scrollTo(0,0); }
function render(){
  document.querySelectorAll('#tabbar button').forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-tab')===curTab); });
  if(curTab==='dash') app.innerHTML=viewDash();
  else if(curTab==='students') app.innerHTML=detailStudent?viewStudentDetail(detailStudent):viewStudents();
  else if(curTab==='exams') app.innerHTML=viewExams();
  else if(curTab==='plan') app.innerHTML=viewPlan();
  else if(curTab==='settings') app.innerHTML=viewSettings();
  bindView();
}
function bindView(){
  var q=document.getElementById('stuSearch'); if(q){ q.addEventListener('input',function(){ studentQuery=q.value; var pos=q.selectionStart; render(); var nq=document.getElementById('stuSearch'); if(nq){ nq.focus(); try{nq.setSelectionRange(pos,pos);}catch(e){} } }); }
  document.querySelectorAll('[data-subject-chip]').forEach(function(c){ c.addEventListener('click',function(){ chartSubject=c.getAttribute('data-subject-chip'); render(); }); });
}

/* ===== داشبورد ===== */
function chartSvg(){
  var subs=['همه']; db.exams.forEach(function(e){ if(subs.indexOf(e.subject)<0) subs.push(e.subject); });
  var chips=subs.map(function(s){ return '<button class="chip'+(chartSubject===s?' on':'')+'" data-subject-chip="'+esc(s)+'">'+esc(s)+'</button>'; }).join('');
  var ex=examsSorted().filter(function(e){ return chartSubject==='همه'||e.subject===chartSubject; });
  var pts=ex.map(function(e){ return {e:e,avg:examAvg(e.id)}; }).filter(function(p){ return p.avg!==null; });
  var body='';
  if(pts.length<2){ body='<p class="hint">برای نمایش نمودار روند، دست‌کم نمرات دو آزمون لازم است.</p>'; }
  else{
    var W=320,H=150,pl=34,pr=10,pt=14,pb=24, iw=W-pl-pr, ih=H-pt-pb;
    var min=20,max=0; pts.forEach(function(p){ if(p.avg<min)min=p.avg; if(p.avg>max)max=p.avg; });
    min=Math.max(0,Math.floor(min-1)); max=Math.min(20,Math.ceil(max+1)); if(max-min<2){max=min+2;}
    function X(i){ return pl+iw*(pts.length===1?0.5:i/(pts.length-1)); }
    function Y(v){ return pt+ih-(v-min)/(max-min)*ih; }
    var line=pts.map(function(p,i){ return X(i).toFixed(1)+','+Y(p.avg).toFixed(1); }).join(' ');
    var dots=pts.map(function(p,i){ return '<circle cx="'+X(i)+'" cy="'+Y(p.avg)+'" r="4" fill="#D96C4A"/><text x="'+X(i)+'" y="'+(Y(p.avg)-8)+'" font-size="10.5" text-anchor="middle" fill="#C25436" font-weight="bold">'+faNum(p.avg,1)+'</text><text x="'+X(i)+'" y="'+(H-6)+'" font-size="9.5" text-anchor="middle" fill="#9A7B68">'+esc(p.e.date||'')+'</text>'; }).join('');
    var grid=''; for(var g=0;g<=2;g++){ var v=min+(max-min)*g/2, y=Y(v); grid+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="#F0DFCE" stroke-width="1"/><text x="'+(pl-4)+'" y="'+(y+3)+'" font-size="9.5" text-anchor="end" fill="#9A7B68">'+faNum(v,0)+'</text>'; }
    body='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+grid+'<polyline points="'+line+'" fill="none" stroke="#D96C4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'</svg>';
  }
  return '<div class="panel"><h3>📈 روند تحصیلی کلاس (میانگین هر آزمون)</h3><div class="chips">'+chips+'</div>'+body+'</div>';
}
function viewDash(){
  var lastEx=examsSorted().slice(-1)[0];
  var lastAvg=lastEx?examAvg(lastEx.id):null;
  var allAvg=allScoresAvg();
  var pp=planProgress();
  var na=needsAttention();
  var h='';
  h+='<div class="cards">'
    +'<div class="card"><div class="num">'+fa(db.students.length)+'</div><div class="lbl">دانش‌آموز</div></div>'
    +'<div class="card"><div class="num">'+fa(db.exams.length)+'</div><div class="lbl">آزمون ثبت‌شده</div></div>'
    +'<div class="card"><div class="num">'+faNum(lastAvg,1)+'</div><div class="lbl">میانگین آخرین آزمون'+(lastEx?' ('+esc(lastEx.title)+')':'')+'</div><div class="sub">میانگین کلی کلاس: '+faNum(allAvg,1)+'</div></div>'
    +'<div class="card"><div class="num">'+(pp===null?'—':fa(pp)+'٪')+'</div><div class="lbl">پیشرفت برنامهٔ درسی</div><div class="sub">'+fa(db.plan.filter(function(p){return p.status==='done';}).length)+' از '+fa(db.plan.length)+' مبحث انجام شده</div></div>'
    +'</div>';
  if(!db.students.length&&!db.exams.length){
    h+='<div class="empty" style="margin-top:12px"><span class="big">🌱</span>هنوز اطلاعاتی ثبت نشده است.<br>از بخش «دانش‌آموزان» شروع کنید و نام بچه‌ها را اضافه کنید؛ بعد آزمون‌ها و نمره‌ها را وارد کنید تا داشبورد جان بگیرد.</div>';
    return h;
  }
  h+=chartSvg();
  h+='<div class="panel"><h3>💗 نیازمند توجه ('+fa(na.length)+')</h3>';
  if(!na.length) h+='<p class="hint">در حال حاضر دانش‌آموزی با افت نمره یا میانگین پایین‌تر از کلاس دیده نمی‌شود. آفرین! 🎉</p>';
  else h+=na.map(function(x){ return '<div class="kv"><span>'+esc(x.student.name)+' '+esc(x.student.family)+'</span><span class="badge red">'+esc(x.reasons.join('، '))+'</span></div>'; }).join('');
  h+='</div>';
  h+='<h2 class="sec">دانش‌آموزان در یک نگاه</h2>';
  if(!db.students.length) h+='<div class="empty"><span class="big">👧</span>هنوز دانش‌آموزی ثبت نشده است.</div>';
  else h+=db.students.map(function(s){
    var av=studentAvg(s.id), tr=studentTrend(s.id);
    var arrow='<span class="trend flat">—</span>';
    if(tr!==null&&tr>0) arrow='<span class="trend up">▲ '+faNum(tr,1)+'</span>';
    else if(tr!==null&&tr<0) arrow='<span class="trend dn">▼ '+faNum(Math.abs(tr),1)+'</span>';
    else if(tr===0) arrow='<span class="trend flat">● ثابت</span>';
    return '<div class="rowitem" onclick="openStudent(\''+s.id+'\')"><div class="avatar">'+esc((s.name||'؟').charAt(0))+'</div><div class="grow"><div class="nm">'+esc(s.name)+' '+esc(s.family)+'</div><div class="meta">میانگین: '+faNum(av,1)+'</div></div>'+arrow+'</div>';
  }).join('');
  return h;
}

/* ===== گفتگوها (دیالوگ) ===== */
var sheet=document.getElementById('sheet'), modalWrap=document.getElementById('modalWrap');
function openDlg(html){ sheet.innerHTML='<div class="sheetwrap">'+html+'</div>'; modalWrap.classList.add('open'); }
function closeDlg(){ modalWrap.classList.remove('open'); sheet.innerHTML=''; }
function dlgHead(t){ return '<button class="btn soft small x" onclick="closeDlg()">✕</button><h3>'+t+'</h3>'; }
function field(id,label,val,ph,type){ return '<label class="f" for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val||'')+'" placeholder="'+esc(ph||'')+'">'; }

/* ===== دانش‌آموزان ===== */
function viewStudents(){
  var h='<p class="guide">💡 راهنما: نام دانش‌آموزان کلاس را اینجا ثبت کنید. روی نام هر دانش‌آموز بزنید تا نمره‌ها و روند تحصیلی‌اش را ببینید.</p>';
  h+='<div class="searchbar"><input id="stuSearch" type="search" placeholder="🔍 جستجوی نام دانش‌آموز…" value="'+esc(studentQuery)+'"></div>';
  h+='<button class="btn block fab" onclick="studentForm()">➕ افزودن دانش‌آموز</button>';
  h+='<div class="btnrow" style="margin:0 0 12px"><button class="btn soft" onclick="printStudents()">🖨 چاپ فهرست</button><button class="btn soft" onclick="exportExcel()">📊 خروجی اکسل</button></div>';
  var list=db.students.filter(function(s){ var q=enDigits(studentQuery.trim()); var full=(s.name+' '+s.family); return !q||enDigits(full).indexOf(q)>=0||full.indexOf(studentQuery.trim())>=0; });
  if(!db.students.length) h+='<div class="empty"><span class="big">👧</span>هنوز دانش‌آموزی ثبت نشده است.<br>با دکمهٔ بالا، اولین دانش‌آموز را اضافه کنید.</div>';
  else if(!list.length) h+='<div class="empty">دانش‌آموزی با این نام پیدا نشد.</div>';
  else h+=list.map(function(s){
    var av=studentAvg(s.id);
    return '<div class="rowitem" onclick="openStudent(\''+s.id+'\')"><div class="avatar">'+esc((s.name||'؟').charAt(0))+'</div><div class="grow"><div class="nm">'+esc(s.name)+' '+esc(s.family)+'</div><div class="meta">'+(s.father?'نام پدر: '+esc(s.father)+' · ':'')+'میانگین: '+faNum(av,1)+'</div></div><button class="iconbtn" title="ویرایش" onclick="event.stopPropagation();studentForm(\''+s.id+'\')">✏️</button></div>';
  }).join('');
  return h;
}
function openStudent(id){ detailStudent=id; if(curTab!=='students'){curTab='students';} render(); window.scrollTo(0,0); }
function viewStudentDetail(id){
  var s=studentById(id); if(!s) return '<div class="empty">دانش‌آموز پیدا نشد.</div>';
  var es=studentEntries(id), av=studentAvg(id), tr=studentTrend(id);
  var trTxt='<span class="trend flat">—</span>';
  if(tr!==null&&tr>0) trTxt='<span class="trend up">▲ '+faNum(tr,1)+' (رو به پیشرفت)</span>';
  else if(tr!==null&&tr<0) trTxt='<span class="trend dn">▼ '+faNum(Math.abs(tr),1)+' (افت)</span>';
  else if(tr===0) trTxt='<span class="trend flat">● ثابت</span>';
  var h='<button class="btn soft small" onclick="detailStudent=null;render()">← بازگشت به فهرست</button>';
  h+='<div class="panel" style="margin-top:12px"><h3>'+esc(s.name)+' '+esc(s.family)+'</h3>'
    +'<div class="kv"><span>نام پدر</span><b>'+esc(s.father||'—')+'</b></div>'
    +'<div class="kv"><span>کد دانش‌آموزی</span><b>'+esc(s.code||'—')+'</b></div>'
    +'<div class="kv"><span>تلفن ولی</span><b>'+esc(s.phone||'—')+'</b></div>'
    +'<div class="kv"><span>یادداشت</span><b>'+esc(s.note||'—')+'</b></div>'
    +'<div class="kv"><span>میانگین نمرات</span><b>'+faNum(av,1)+'</b></div>'
    +'<div class="kv"><span>روند آخرین آزمون‌ها</span>'+trTxt+'</div>'
    +'<div class="btnrow"><button class="btn ghost" onclick="studentForm(\''+s.id+'\')">✏️ ویرایش</button><button class="btn danger" onclick="delStudent(\''+s.id+'\')">🗑 حذف</button></div></div>';
  h+='<div class="panel"><h3>📝 نمره‌ها در آزمون‌ها</h3>';
  if(!es.length) h+='<p class="hint">هنوز برای این دانش‌آموز نمره‌ای ثبت نشده است.</p>';
  else h+=es.map(function(x){ return '<div class="kv"><span>'+esc(x.exam.title)+' <span class="badge">'+esc(x.exam.subject)+'</span> <span class="hint">'+esc(x.exam.date||'')+'</span></span><b>'+faScore(x.score)+'</b></div>'; }).join('');
  h+='</div>';
  return h;
}
function studentForm(id){
  var s=id?studentById(id):null;
  openDlg(dlgHead(s?'✏️ ویرایش دانش‌آموز':'➕ دانش‌آموز جدید')
    +field('f_name','نام *',s?s.name:'','مثلاً: سارا')
    +field('f_family','نام خانوادگی *',s?s.family:'','مثلاً: محمدی')
    +field('f_code','کد دانش‌آموزی',s?s.code:'','کد دانش‌آموزی دانش‌آموز')
    +field('f_father','نام پدر',s?s.father:'')
    +field('f_phone','شماره تماس ولی',s?s.phone:'','۰۹۱۲…','tel')
    +'<label class="f" for="f_note">یادداشت</label><textarea id="f_note" rows="2" placeholder="نکته‌ای دربارهٔ دانش‌آموز…">'+esc(s?s.note||'':'')+'</textarea>'
    +'<div class="btnrow"><button class="btn" onclick="saveStudent('+(s?'\''+s.id+'\'':'null')+')">💾 ذخیره</button><button class="btn soft" onclick="closeDlg()">انصراف</button></div>');
  setTimeout(function(){ var i=document.getElementById('f_name'); if(i) i.focus(); },60);
}
function saveStudent(id){
  var name=document.getElementById('f_name').value.trim(), fam=document.getElementById('f_family').value.trim();
  if(!name||!fam){ toast('نام و نام خانوادگی لازم است',true); return; }
  var data={name:name,family:fam,code:document.getElementById('f_code').value.trim(),father:document.getElementById('f_father').value.trim(),phone:document.getElementById('f_phone').value.trim(),note:document.getElementById('f_note').value.trim()};
  if(id){ var s=studentById(id); Object.keys(data).forEach(function(k){ s[k]=data[k]; }); }
  else{ data.id=uid(); db.students.push(data); }
  saveDb(); closeDlg(); render(); toast('ذخیره شد ✅');
}
function delStudent(id){
  var s=studentById(id); if(!s) return;
  if(!confirm('«'+s.name+' '+s.family+'» و همهٔ نمره‌هایش حذف شود؟')) return;
  db.students=db.students.filter(function(x){return x.id!==id;});
  Object.keys(db.scores).forEach(function(eid){ if(db.scores[eid]) delete db.scores[eid][id]; });
  detailStudent=null; saveDb(); render(); toast('حذف شد');
}

/* ===== آزمون‌ها ===== */
function viewExams(){
  var h='<p class="guide">💡 راهنما: هر آزمون را با درس و تاریخ ثبت کنید، بعد با دکمهٔ «ثبت نمرات» نمرهٔ هر دانش‌آموز را وارد کنید. خانهٔ خالی یعنی دانش‌آموز در آن آزمون شرکت نکرده است.</p>';
  h+='<button class="btn block fab" onclick="examForm()">➕ افزودن آزمون</button>';
  if(!db.exams.length) h+='<div class="empty"><span class="big">📝</span>هنوز آزمونی ثبت نشده است.</div>';
  else h+=examsSorted().map(function(e){
    var av=examAvg(e.id), n=examScores(e.id).length;
    return '<div class="rowitem"><div class="grow"><div class="nm">'+esc(e.title)+'</div><div class="meta"><span class="badge">'+esc(e.subject)+'</span> '+esc(e.date||'')+' · '+fa(n)+' نمره · میانگین: '+faNum(av,1)+'</div></div>'
      +'<button class="btn small" onclick="scoreGrid(\''+e.id+'\')">ثبت نمرات</button>'
      +'<button class="iconbtn" title="چاپ نمرات" onclick="printExamScores(\''+e.id+'\')">🖨</button>'
      +'<button class="iconbtn" title="ویرایش" onclick="examForm(\''+e.id+'\')">✏️</button>'
      +'<button class="iconbtn red" title="حذف" onclick="delExam(\''+e.id+'\')">🗑</button></div>';
  }).join('');
  return h;
}
function subjectOptions(sel){
  var opts=SUBJECTS.map(function(s){ return '<option value="'+esc(s)+'"'+(s===sel?' selected':'')+'>'+esc(s)+'</option>'; }).join('');
  if(sel&&SUBJECTS.indexOf(sel)<0) opts+='<option value="'+esc(sel)+'" selected>'+esc(sel)+'</option>';
  return opts;
}
function examForm(id){
  var e=id?examById(id):null;
  openDlg(dlgHead(e?'✏️ ویرایش آزمون':'➕ آزمون جدید')
    +field('e_title','عنوان آزمون *',e?e.title:'','مثلاً: آزمون ماهانهٔ آبان')
    +'<label class="f" for="e_subject">درس</label><select id="e_subject">'+subjectOptions(e?e.subject:'ریاضی')+'</select>'
    +field('e_subfree','یا نام درس دلخواه',e&&(SUBJECTS.indexOf(e.subject)<0)?e.subject:'','اگر در فهرست نیست، اینجا بنویسید')
    +field('e_date','تاریخ',e?e.date:'','مثلاً: ۱۴۰۵/۰۸/۱۵')
    +'<div class="btnrow"><button class="btn" onclick="saveExam('+(e?'\''+e.id+'\'':'null')+')">💾 ذخیره</button><button class="btn soft" onclick="closeDlg()">انصراف</button></div>');
}
function saveExam(id){
  var title=document.getElementById('e_title').value.trim();
  if(!title){ toast('عنوان آزمون لازم است',true); return; }
  var free=document.getElementById('e_subfree').value.trim();
  var data={title:title,subject:free||document.getElementById('e_subject').value,date:document.getElementById('e_date').value.trim()};
  if(id){ var e=examById(id); Object.keys(data).forEach(function(k){ e[k]=data[k]; }); }
  else{ data.id=uid(); db.exams.push(data); if(!db.scores[data.id]) db.scores[data.id]={}; }
  saveDb(); closeDlg(); render(); toast('ذخیره شد ✅');
}
function delExam(id){
  var e=examById(id); if(!e) return;
  if(!confirm('آزمون «'+e.title+'» و نمره‌هایش حذف شود؟')) return;
  db.exams=db.exams.filter(function(x){return x.id!==id;}); delete db.scores[id];
  saveDb(); render(); toast('حذف شد');
}
function scoreGrid(examId){
  var e=examById(examId); if(!e) return;
  if(!db.students.length){ toast('اول دانش‌آموزان را ثبت کنید',true); return; }
  var rows=db.students.map(function(s){
    var v=scoreOf(examId,s.id);
    return '<div class="srow"><span class="sname">'+esc(s.name)+' '+esc(s.family)+'</span><input type="text" inputmode="decimal" data-score-for="'+s.id+'" value="'+(v===null?'':faScore(v))+'" placeholder="—"></div>';
  }).join('');
  openDlg(dlgHead('📝 ثبت نمرات — '+esc(e.title))
    +'<p class="hint">'+esc(e.subject)+' · '+esc(e.date||'')+' · نمره از ۰ تا ۲۰؛ خانهٔ خالی = شرکت نکرده</p>'
    +'<div class="scoregrid">'+rows+'</div>'
    +'<div class="btnrow"><button class="btn" onclick="saveScores(\''+examId+'\')">💾 ذخیرهٔ نمرات</button><button class="btn soft" onclick="closeDlg()">انصراف</button></div>');
}
function saveScores(examId){
  var inputs=sheet.querySelectorAll('[data-score-for]'), bad=null;
  var m=db.scores[examId]||(db.scores[examId]={});
  inputs.forEach(function(inp){
    var v=parseScore(inp.value);
    if(v===undefined){ bad=inp; return; }
    var sid=inp.getAttribute('data-score-for');
    if(v===null) delete m[sid]; else m[sid]=v;
  });
  if(bad){ toast('یک نمره درست نیست؛ باید بین ۰ تا ۲۰ باشد',true); bad.focus(); return; }
  saveDb(); closeDlg(); render(); toast('نمرات ذخیره شد ✅');
}

/* ===== برنامهٔ درسی ===== */
function viewPlan(){
  var h='<p class="guide">💡 راهنما: برنامهٔ درسی ادامهٔ سال را اینجا بنویسید؛ هر مبحث که تدریس شد، تیک «انجام شد» را بزنید تا پیشرفت برنامه در داشبورد دیده شود.</p>';
  h+='<button class="btn block fab" onclick="planForm()">➕ افزودن مبحث</button>';
  if(!db.plan.length) h+='<div class="empty"><span class="big">📚</span>هنوز برنامه‌ای ثبت نشده است.</div>';
  else{
    MONTHS.forEach(function(mo){
      var rows=db.plan.filter(function(p){return p.month===mo;});
      if(!rows.length) return;
      h+='<div class="monthttl">🗓 '+esc(mo)+'</div>'+rows.map(function(p){ return planRow(p); }).join('');
    });
    var others=db.plan.filter(function(p){return MONTHS.indexOf(p.month)<0;});
    if(others.length) h+='<div class="monthttl">🗓 سایر</div>'+others.map(function(p){ return planRow(p); }).join('');
  }
  return h;
}
function planRow(p){
  var done=p.status==='done';
  return '<div class="rowitem"><div class="grow"><div class="nm'+(done?' done-topic':'')+'">'+esc(p.topic)+'</div><div class="meta"><span class="badge">'+esc(p.subject)+'</span> هفتهٔ '+fa(p.week)+' · '+(done?'<span class="badge green">انجام شد</span>':'در پیش')+'</div></div>'
    +'<button class="btn small '+(done?'soft':'')+'" onclick="togglePlan(\''+p.id+'\')">'+(done?'↩ برگردان':'✔ انجام شد')+'</button>'
    +'<button class="iconbtn" title="ویرایش" onclick="planForm(\''+p.id+'\')">✏️</button>'
    +'<button class="iconbtn red" title="حذف" onclick="delPlan(\''+p.id+'\')">🗑</button></div>';
}
function planForm(id){
  var p=id?db.plan.filter(function(x){return x.id===id;})[0]:null;
  var mOpts=MONTHS.map(function(m){ return '<option value="'+esc(m)+'"'+(p&&p.month===m?' selected':'')+'>'+esc(m)+'</option>'; }).join('');
  openDlg(dlgHead(p?'✏️ ویرایش مبحث':'➕ مبحث جدید')
    +'<label class="f" for="p_month">ماه</label><select id="p_month">'+mOpts+'</select>'
    +'<label class="f" for="p_week">هفته</label><select id="p_week">'+[1,2,3,4,5].map(function(w){ return '<option value="'+w+'"'+(p&&String(p.week)===String(w)?' selected':'')+'>هفتهٔ '+fa(w)+'</option>'; }).join('')+'</select>'
    +'<label class="f" for="p_subject">درس</label><select id="p_subject">'+subjectOptions(p?p.subject:'ریاضی')+'</select>'
    +field('p_topic','مبحث *',p?p.topic:'','مثلاً: کسرها — جمع و تفریق')
    +'<div class="btnrow"><button class="btn" onclick="savePlan('+(p?'\''+p.id+'\'':'null')+')">💾 ذخیره</button><button class="btn soft" onclick="closeDlg()">انصراف</button></div>');
}
function savePlan(id){
  var topic=document.getElementById('p_topic').value.trim();
  if(!topic){ toast('نام مبحث لازم است',true); return; }
  var data={month:document.getElementById('p_month').value,week:document.getElementById('p_week').value,subject:document.getElementById('p_subject').value,topic:topic};
  if(id){ var p=db.plan.filter(function(x){return x.id===id;})[0]; Object.keys(data).forEach(function(k){ p[k]=data[k]; }); }
  else{ data.id=uid(); data.status='todo'; db.plan.push(data); }
  saveDb(); closeDlg(); render(); toast('ذخیره شد ✅');
}
function togglePlan(id){ var p=db.plan.filter(function(x){return x.id===id;})[0]; if(!p) return; p.status=(p.status==='done')?'todo':'done'; saveDb(); render(); }
function delPlan(id){ if(!confirm('این مبحث حذف شود؟')) return; db.plan=db.plan.filter(function(x){return x.id!==id;}); saveDb(); render(); toast('حذف شد'); }

/* ===== تنظیمات و همگام‌سازی گیت‌هاب ===== */
var PRESET_URL='https://api.github.com/repos/testforwar001-rgb/dastyar-kelas/contents/sync/state.json';
var lastSyncAt=localStorage.getItem('dk_last_sync')||'';
function viewSettings(){
  var cfg=syncCfg();
  var h='<p class="guide">💡 راهنما: اطلاعات روی همین گوشی ذخیره می‌شود. برای نگه‌داری امن و دسترسی از دستگاه دیگر، همگام‌سازی گیت‌هاب را فعال کنید؛ توکن را یک بار وارد کنید تا ذخیره شود (دوباره نمایش داده نمی‌شود).</p>';
  h+='<div class="panel"><h3>☁️ همگام‌سازی با گیت‌هاب</h3>'
    +'<label class="f" for="s_url">نشانی همگام‌سازی</label><input id="s_url" dir="ltr" value="'+esc(cfg.url||PRESET_URL)+'">'
    +'<label class="f" for="s_token">توکن گیت‌هاب</label><input id="s_token" type="password" dir="ltr" placeholder="'+(cfg.token?'توکن ذخیره شده است — برای تغییر، دوباره وارد کنید':'توکن را اینجا وارد کنید')+'" autocomplete="off">'
    +'<div class="btnrow"><button class="btn ghost" onclick="saveCfgOnly()">💾 ذخیرهٔ تنظیمات</button></div>'
    +'<div class="btnrow"><button class="btn" onclick="syncPush()">⬆️ ذخیره در گیت‌هاب</button><button class="btn ghost" onclick="syncPull(false)">⬇️ دریافت از گیت‌هاب</button></div>'
    +'<p class="hint">آخرین همگام‌سازی: '+(lastSyncAt?fa(new Date(lastSyncAt).toLocaleString('fa-IR')):'هنوز انجام نشده')+' · نسخهٔ داده: '+fa(db._rev||0)+'</p>'
    +'<div class="msg" id="syncMsg"></div></div>';
  h+='<div class="panel"><h3>📤 خروجی و چاپ</h3>'
    +'<p class="hint">فهرست دانش‌آموزان، نمرات همهٔ آزمون‌ها و برنامهٔ درسی را در یک فایل اکسل بگیرید، یا فهرست دانش‌آموزان را چاپ کنید. چاپ نمرات هر آزمون از صفحهٔ «آزمون‌ها» انجام می‌شود.</p>'
    +'<div class="btnrow"><button class="btn soft" onclick="exportExcel()">📊 خروجی اکسل</button><button class="btn soft" onclick="printStudents()">🖨 چاپ فهرست دانش‌آموزان</button></div></div>';
  h+='<div class="panel"><h3>🗂 پشتیبان‌گیری دستی</h3>'
    +'<p class="hint">می‌توانید یک فایل پشتیبان از همهٔ اطلاعات بگیرید یا از فایل قبلی بازیابی کنید.</p>'
    +'<div class="btnrow"><button class="btn soft" onclick="exportJson()">⬇️ دانلود پشتیبان</button><button class="btn soft" onclick="document.getElementById(\'importFile\').click()">⬆️ بازیابی از فایل</button></div></div>';
  return h;
}
function syncMsg(txt,ok){ var m=document.getElementById('syncMsg'); if(!m) return; m.textContent=txt; m.className='msg '+(ok?'ok':'err'); }
function readCfgFromForm(){
  var url=(document.getElementById('s_url')||{}).value||PRESET_URL;
  var tokEl=document.getElementById('s_token');
  var cfg=syncCfg(); cfg.url=url.trim();
  if(tokEl&&tokEl.value.trim()) cfg.token=tokEl.value.trim();
  saveSyncCfg(cfg); return cfg;
}
function saveCfgOnly(){ readCfgFromForm(); render(); toast('تنظیمات ذخیره شد ✅'); }
function b64enc(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64dec(b64){ return decodeURIComponent(escape(atob(String(b64).replace(/\s/g,'')))); }
function ghHeaders(cfg){ return { 'Authorization':'Bearer '+cfg.token, 'Accept':'application/vnd.github+json' }; }
async function ghGetFile(cfg){
  var r=await fetch(cfg.url,{headers:ghHeaders(cfg)});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('پاسخ گیت‌هاب: '+r.status);
  return await r.json();
}
function parseState(j){
  var data=JSON.parse(b64dec(j.content));
  if(!data||!data.db) throw new Error('ساختار فایل همگام‌سازی درست نیست');
  return data;
}
function markSynced(){ lastSyncAt=new Date().toISOString(); try{localStorage.setItem('dk_last_sync',lastSyncAt);}catch(e){} }
async function syncPull(silent){
  var cfg=(curTab==='settings')?readCfgFromForm():syncCfg();
  if(!cfg.token){ if(!silent){ syncMsg('اول توکن گیت‌هاب را وارد و ذخیره کنید.',false); toast('توکن وارد نشده است',true);} return false; }
  try{
    var j=await ghGetFile(cfg);
    if(!j){ if(!silent) syncMsg('هنوز فایلی روی گیت‌هاب نیست؛ ابتدا «ذخیره در گیت‌هاب» را بزنید.',false); return false; }
    var data=parseState(j);
    var nd=data.db; nd.students=nd.students||[]; nd.exams=nd.exams||[]; nd.scores=nd.scores||{}; nd.plan=nd.plan||[]; nd._rev=data.rev||0;
    db=nd; saveDb(); markSynced();
    if(curTab==='settings'){ render(); syncMsg('اطلاعات از گیت‌هاب دریافت و جایگزین شد ✅ (نسخهٔ '+fa(db._rev)+')',true); }
    else { render(); toast('همگام‌سازی انجام شد ✅'); }
    return true;
  }catch(e){
    if(!silent){ syncMsg('دریافت از گیت‌هاب انجام نشد: '+e.message+' — اطلاعات این دستگاه دست نخورده ماند.',false); toast('خطا در همگام‌سازی',true); }
    return false;
  }
}
async function syncPush(){
  var cfg=readCfgFromForm();
  if(!cfg.token){ syncMsg('اول توکن گیت‌هاب را وارد و ذخیره کنید.',false); toast('توکن وارد نشده است',true); return false; }
  try{
    var j=await ghGetFile(cfg);
    var sha=null;
    if(j){
      var server=parseState(j);
      if((server.rev||0)!==(db._rev||0)){
        syncMsg('⚠️ نسخهٔ روی گیت‌هاب جدیدتر است (نسخهٔ '+fa(server.rev||0)+' در برابر نسخهٔ این دستگاه '+fa(db._rev||0)+'). برای جلوگیری از پاک شدن اطلاعات، اول «دریافت از گیت‌هاب» را بزنید؛ هیچ چیزی بازنویسی نشد.',false);
        toast('تعارض نسخه — اول دریافت کنید',true); return false;
      }
      sha=j.sha;
    }
    var newRev=(db._rev||0)+1;
    var payload={db:{students:db.students,exams:db.exams,scores:db.scores,plan:db.plan},rev:newRev,updatedAt:new Date().toISOString()};
    var body={message:'dastyar-kelas sync rev '+newRev,content:b64enc(JSON.stringify(payload))};
    if(sha) body.sha=sha;
    var r=await fetch(cfg.url,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders(cfg)),body:JSON.stringify(body)});
    if(r.status===409||r.status===422){ syncMsg('⚠️ گیت‌هاب از ذخیره جلوگیری کرد (تعارض نسخه). اول «دریافت از گیت‌هاب» را بزنید؛ هیچ چیزی بازنویسی نشد.',false); toast('تعارض نسخه',true); return false; }
    if(!r.ok) throw new Error('پاسخ گیت‌هاب: '+r.status);
    db._rev=newRev; saveDb(); markSynced(); render();
    syncMsg('اطلاعات در گیت‌هاب ذخیره شد ✅ (نسخهٔ '+fa(newRev)+')',true); toast('در گیت‌هاب ذخیره شد ✅');
    return true;
  }catch(e){
    syncMsg('ذخیره در گیت‌هاب انجام نشد: '+e.message+' — اطلاعات این دستگاه سر جایش است.',false); toast('خطا در همگام‌سازی',true);
    return false;
  }
}
/* ===== خروجی اکسل (فایل .xls چندبرگی) ===== */
function exportExcel(){
  var exams=examsSorted();
  var t1='<table border="1"><tr><th>ردیف</th><th>نام</th><th>نام خانوادگی</th><th>نام پدر</th><th>کد دانش‌آموزی</th><th>تلفن ولی</th><th>یادداشت</th></tr>';
  db.students.forEach(function(s,i){
    t1+='<tr><td>'+(i+1)+'</td><td>'+esc(s.name)+'</td><td>'+esc(s.family)+'</td><td>'+esc(s.father||'')+'</td><td>'+esc(s.code||'')+'</td><td>'+esc(s.phone||'')+'</td><td>'+esc(s.note||'')+'</td></tr>';
  });
  t1+='</table>';
  var t2='<table border="1"><tr><th>ردیف</th><th>نام و نام خانوادگی</th>'+exams.map(function(e){ return '<th>'+esc(e.title+' ('+e.subject+')')+'</th>'; }).join('')+'<th>میانگین</th></tr>';
  db.students.forEach(function(s,i){
    t2+='<tr><td>'+(i+1)+'</td><td>'+esc(s.name+' '+s.family)+'</td>';
    exams.forEach(function(e){ var v=scoreOf(e.id,s.id); t2+='<td>'+(v===null?'':v)+'</td>'; });
    var av=studentAvg(s.id);
    t2+='<td>'+(av===null?'':(Math.round(av*100)/100))+'</td></tr>';
  });
  t2+='</table>';
  var planRows=db.plan.slice().sort(function(a,b){ var d=MONTHS.indexOf(a.month)-MONTHS.indexOf(b.month); if(d) return d; return (parseInt(enDigits(a.week),10)||0)-(parseInt(enDigits(b.week),10)||0); });
  var t3='<table border="1"><tr><th>ردیف</th><th>ماه</th><th>هفته</th><th>درس</th><th>مبحث</th><th>وضعیت</th></tr>';
  planRows.forEach(function(p,i){
    t3+='<tr><td>'+(i+1)+'</td><td>'+esc(p.month)+'</td><td>'+esc(p.week)+'</td><td>'+esc(p.subject)+'</td><td>'+esc(p.topic)+'</td><td>'+(p.status==='done'?'انجام شد':'انجام نشده')+'</td></tr>';
  });
  t3+='</table>';
  var names=['دانش‌آموزان','نمرات','برنامه درسی'];
  var ws=names.map(function(nm){ return '<x:ExcelWorksheet><x:Name>'+nm+'</x:Name><x:WorksheetOptions><x:DisplayRightToLeft/></x:WorksheetOptions></x:ExcelWorksheet>'; }).join('');
  var html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">'
    +'<head><meta charset="UTF-8"><meta name="ProgId" content="Excel.Sheet">'
    +'<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets>'+ws+'</x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->'
    +'</head><body>'+t1+t2+t3+'</body></html>';
  var blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='dastyar-kelas.xls'; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },400);
  toast('فایل اکسل دانلود شد 📊');
}

function printDoc(title,inner){
  var today=''; try{ today=new Date().toLocaleDateString('fa-IR'); }catch(e){}
  var pa=document.getElementById('printArea');
  pa.innerHTML='<div class="phead"><div class="l1">دبستان دخترانه حافظ — کلاس ۶/۴ — سال تحصیلی ۱۴۰۵–۱۴۰۶</div><div class="l2">'+esc(title)+'</div><div class="l3">تاریخ چاپ: '+esc(today)+'</div></div>'+inner;
  window.print();
}
function printStudents(){
  if(!db.students.length){ toast('هنوز دانش‌آموزی ثبت نشده است',true); return; }
  var rows=db.students.map(function(s,i){
    return '<tr><td>'+fa(i+1)+'</td><td>'+esc(s.name)+' '+esc(s.family)+'</td><td>'+esc(s.father||'')+'</td><td>'+esc(s.code||'')+'</td><td>'+esc(s.phone||'')+'</td></tr>';
  }).join('');
  printDoc('فهرست دانش‌آموزان کلاس','<table><tr><th>ردیف</th><th>نام و نام خانوادگی</th><th>نام پدر</th><th>کد دانش‌آموزی</th><th>تلفن ولی</th></tr>'+rows+'</table>');
}
function printExamScores(examId){
  var e=examById(examId); if(!e) return;
  if(!db.students.length){ toast('هنوز دانش‌آموزی ثبت نشده است',true); return; }
  var rows=db.students.map(function(s,i){
    var v=scoreOf(examId,s.id);
    return '<tr><td>'+fa(i+1)+'</td><td>'+esc(s.name)+' '+esc(s.family)+'</td><td>'+(v===null?'—':faScore(v))+'</td></tr>';
  }).join('');
  var inner='<table><tr><th>ردیف</th><th>نام و نام خانوادگی</th><th>نمره</th></tr>'+rows+'</table>'
    +'<div class="pfoot">میانگین کلاس در این آزمون: <b>'+faNum(examAvg(examId),1)+'</b> · تعداد نمرهٔ ثبت‌شده: '+fa(examScores(examId).length)+' از '+fa(db.students.length)+'</div>';
  printDoc('لیست نمرات — '+e.title+' ('+e.subject+(e.date?' · '+e.date:'')+')',inner);
}
function exportJson(){
  var payload={db:{students:db.students,exams:db.exams,scores:db.scores,plan:db.plan},rev:db._rev||0,updatedAt:new Date().toISOString()};
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='dastyar-kelas-backup.json'; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },400);
  toast('فایل پشتیبان دانلود شد');
}
document.getElementById('importFile').addEventListener('change',function(ev){
  var f=ev.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var data=JSON.parse(rd.result);
      var nd=data.db||data;
      if(!nd||!Array.isArray(nd.students)) throw new Error('bad');
      nd.exams=nd.exams||[]; nd.scores=nd.scores||{}; nd.plan=nd.plan||[]; nd._rev=data.rev||nd._rev||0;
      if(!confirm('اطلاعات فعلی با فایل پشتیبان جایگزین شود؟')) return;
      db=nd; saveDb(); render(); toast('بازیابی انجام شد ✅');
    }catch(e){ toast('این فایل، پشتیبان معتبری نیست',true); }
    ev.target.value='';
  };
  rd.readAsText(f);
});

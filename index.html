<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دستیار مدیریت کلاس</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5B301">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>/* تم ذخیره‌شده قبل از اولین رنگ‌آمیزی اعمال می‌شود تا صفحه چشمک نزند */
try{ var __t=localStorage.getItem('dk_theme'); if(__t&&__t!=='sunny') document.documentElement.setAttribute('data-theme',__t); }catch(e){}
</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FFFDF5; --card:#FFFFFF; --ink:#3D2C22; --muted:#9A7B68;
  --pri:#F5B301; --pri-d:#9C6603; --acc:#F08A3C; --warn:#C0392B;
  --line:#F7EBC8; --line2:#F0D98C; --chip:#FFF3C4; --chip2:#FFE9A8; --shadow:0 2px 10px rgba(214,164,32,.10);
  --pri-l:#FFC93C; --hdr-a:#FFD94D; --hdr-b:#F5B301; --hdr-c:#F59E0C;
  --hero-a:#FFDF6B; --hero-b:#FFB52E; --hero-c:#F59E0C;
  --deep:#7A5200; --on-pri:#3D2C22; --shc:214,164,32;
  --grad-num:linear-gradient(180deg,#B97A04,#8A5A00);
  --chart-student:#2563EB; --chart-class:#E05A20;
}
/* ===== تم‌ها (فقط صفحهٔ نمایش؛ چاپ رنگ‌های خودش را دارد) ===== */
html[data-theme="pink"]{
  --bg:#FFF8FA; --card:#FFFBFC; --ink:#46222F; --warn:#C2274B; --muted:#A87A8C; --pri:#F06BA0; --pri-d:#B03060; --acc:#F59EBC;
  --line:#F9DEE8; --line2:#F5C6D8; --chip:#FCE4EE; --chip2:#FAD3E3; --shadow:0 2px 10px rgba(230,110,160,.12);
  --pri-l:#F78FB8; --hdr-a:#FFB3D1; --hdr-b:#F06BA0; --hdr-c:#E84E8A;
  --hero-a:#FFC2DA; --hero-b:#F78FB8; --hero-c:#E84E8A;
  --deep:#8F2350; --on-pri:#4A0E28; --shc:230,110,160;
  --grad-num:linear-gradient(180deg,#C2437C,#8F2350);
  --chart-student:#B4238A; --chart-class:#087F8C;
  --shadow-sm:0 1px 2px rgba(var(--shc),.06),0 4px 12px rgba(var(--shc),.13);
}
html[data-theme="sky"]{
  --bg:#F4FAFE; --card:#FCFEFF; --ink:#17384A; --warn:#C0392B; --muted:#6E93A8; --pri:#2B9FD8; --pri-d:#1668A0; --acc:#5BBFEA;
  --line:#D6EDF9; --line2:#B4DFF2; --chip:#DFF2FC; --chip2:#C4E8F9; --shadow:0 2px 10px rgba(60,160,215,.12);
  --pri-l:#5BBFEA; --hdr-a:#8FD4F5; --hdr-b:#2B9FD8; --hdr-c:#1B83B8;
  --hero-a:#A5DFF8; --hero-b:#4FB3E8; --hero-c:#1B83B8;
  --deep:#0F5580; --on-pri:#0B2E47; --shc:60,160,215;
  --grad-num:linear-gradient(180deg,#1B83B8,#0F5580);
  --chart-student:#1565C0; --chart-class:#D9480F;
  --shadow-sm:0 1px 2px rgba(var(--shc),.06),0 4px 12px rgba(var(--shc),.13);
}
html[data-theme="spring"]{
  --bg:#F5FCF5; --card:#FCFEFC; --ink:#22452B; --warn:#C0392B; --muted:#7A9A7E; --pri:#58B368; --pri-d:#2F7D46; --acc:#8CC084;
  --line:#D9F0DC; --line2:#BEE5C4; --chip:#E2F5E5; --chip2:#C9EDCF; --shadow:0 2px 10px rgba(80,170,100,.12);
  --pri-l:#7CC98A; --hdr-a:#A5DFAE; --hdr-b:#58B368; --hdr-c:#3E9B52;
  --hero-a:#BCECC2; --hero-b:#6FC37E; --hero-c:#3E9B52;
  --deep:#1F6136; --on-pri:#0E3520; --shc:80,170,100;
  --grad-num:linear-gradient(180deg,#3E9B52,#1F6136);
  --chart-student:#166534; --chart-class:#B45309;
  --shadow-sm:0 1px 2px rgba(var(--shc),.06),0 4px 12px rgba(var(--shc),.13);
}
html[data-theme="purple"]{
  --bg:#FAF7FF; --card:#FDFBFF; --ink:#322154; --warn:#B03060; --muted:#8E7FB3; --pri:#9B7ED9; --pri-d:#5E3FA8; --acc:#B79CED;
  --line:#E6DFF7; --line2:#CDBDF0; --chip:#EEE7FB; --chip2:#DFD2F7; --shadow:0 2px 10px rgba(150,120,220,.13);
  --pri-l:#B79CED; --hdr-a:#CDBBF5; --hdr-b:#9B7ED9; --hdr-c:#7E5CC4;
  --hero-a:#DCCFFA; --hero-b:#A98AE0; --hero-c:#7E5CC4;
  --deep:#452A85; --on-pri:#241147; --shc:150,120,220;
  --grad-num:linear-gradient(180deg,#7E5CC4,#452A85);
  --chart-student:#6D28D9; --chart-class:#0F766E;
  --shadow-sm:0 1px 2px rgba(var(--shc),.06),0 4px 12px rgba(var(--shc),.13);
}
/* ===== پوستهٔ ضدخطای دستگاه: ستون فلکس تمام‌قد (بدون position:fixed و بدون واحدهای نمایشی) ===== */
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.65}
#appShell{display:flex;flex-direction:column;height:100%;position:relative;overflow:hidden}
header{flex:none;position:relative;z-index:20;background:linear-gradient(135deg,var(--hdr-a),var(--hdr-b));color:var(--on-pri);padding:11px 16px 9px;box-shadow:0 2px 10px rgba(var(--shc),.30);border-bottom:2px solid var(--pri)}
header h1{margin:0;font-size:19px;font-weight:800}
header p{margin:2px 0 0;font-size:12.5px;opacity:.92}
main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;width:100%;max-width:560px;margin:0 auto;padding:10px 12px 8px}
h2.sec{font-size:16px;margin:12px 2px 6px;color:var(--pri-d)}
h2.sec::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--hero-a),var(--pri));margin-left:7px;box-shadow:0 0 0 3px var(--chip);vertical-align:-1px}
.guide{background:var(--chip);border:1px dashed var(--line2);border-radius:12px;padding:7px 11px;font-size:13px;color:#8A6A45;margin:0 0 9px}
.empty{background:linear-gradient(180deg,var(--card),var(--chip));border:1.5px dashed var(--line2);border-radius:18px;padding:16px 14px;text-align:center;color:var(--muted);font-size:14px}
.empty .big{font-size:28px;display:flex;align-items:center;justify-content:center;width:54px;height:54px;margin:0 auto 7px;background:var(--chip);border-radius:50%;box-shadow:0 3px 10px rgba(var(--shc),.25)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow)}
.card .num{font-size:26px;font-weight:800;color:var(--pri-d);line-height:1.3}
.card .lbl{font-size:13px;color:var(--muted)}
.card .sub{font-size:12px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);margin-bottom:9px}
.panel h3{margin:0 0 8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#3D2C22;font-weight:700}
svg.chart{width:100%;height:auto;display:block}
.rowitem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 11px;margin-bottom:6px;box-shadow:var(--shadow);cursor:pointer}
.rowitem .grow{flex:1;min-width:0}
.rowitem .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowitem .meta{font-size:12.5px;color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--chip);color:var(--pri-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--chip);color:var(--pri-d)}
.badge.red{background:#FDECEA;color:var(--warn)}
.badge.green{background:#E6F4EA;color:#3FA34D}
.trend{font-weight:800;font-size:15px}
.trend.up{color:#3FA34D}.trend.dn{color:var(--warn)}.trend.flat{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:10px 16px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--pri);color:#3D2C22;min-height:44px;box-shadow:0 2px 8px rgba(214,164,32,.35)}
.btn:active{background:#E8A90C}
.btn.ghost{background:#fff;color:var(--pri-d);border:1.5px solid var(--pri)}
.btn.soft{background:var(--chip);color:var(--pri-d)}
.btn.danger{background:#fff;color:var(--warn);border:1.5px solid #F0C4BE}
.btn.small{padding:6px 12px;min-height:38px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.iconbtn{border:none;background:var(--chip);color:var(--pri-d);width:38px;height:38px;border-radius:10px;font-size:16px;cursor:pointer;flex:none}
.iconbtn.red{background:#FDECEA;color:var(--warn)}
.fab{display:block;width:100%;margin:2px 0 9px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,select,textarea:focus{outline:2px solid var(--hdr-a);border-color:var(--pri)}
label.f{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
.searchbar{position:sticky;top:0;z-index:15;background:var(--bg);padding:8px 0 6px;margin:0 0 6px}
.searchbar input{border:2px solid var(--pri);border-radius:14px;padding:12px 14px;font-size:16px;box-shadow:0 3px 12px rgba(var(--shc),.22);background:#fff}
.stuAcc{background:var(--card);border:1.5px solid var(--pri);border-radius:16px;padding:12px 14px;margin:-2px 0 10px;box-shadow:var(--shadow);overflow:hidden;animation:accSlide .32s ease}
@keyframes accSlide{from{max-height:0;opacity:.3;padding-top:0;padding-bottom:0}to{max-height:760px;opacity:1}}
.rowitem.accOpen{border-color:var(--pri);background:var(--chip);box-shadow:0 4px 16px rgba(var(--shc),.25)}
.accArrow{flex:none;width:32px;height:32px;border-radius:50%;background:var(--chip);color:var(--pri-d);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;transition:transform .3s ease,background .3s ease;box-shadow:inset 0 0 0 1.5px var(--line2)}
.accArrow.open{transform:rotate(180deg);background:var(--pri);color:var(--on-pri)}
nav#tabbar{flex:none;position:relative;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;box-shadow:0 -2px 10px rgba(var(--shc),.08);padding-bottom:env(safe-area-inset-bottom)}
nav#tabbar button{flex:1;border:none;background:none;padding:9px 2px 8px;font-family:inherit;font-size:13px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:66px}
nav#tabbar button .ic{font-size:26px;line-height:1.15}
nav#tabbar button.on{color:var(--pri-d);font-weight:800}
#modalWrap{position:absolute;inset:0;z-index:50;display:none}
#modalWrap.open{display:block}
#modalWrap .scrim{position:absolute;inset:0;background:rgba(61,44,34,.45)}
.sheet{position:absolute;right:0;left:0;bottom:0;margin:0 auto;width:min(96vw,480px);max-height:92%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -4px 24px rgba(0,0,0,.2)}
.sheet h3{margin:0 0 6px;font-size:17px}
.sheet .x{position:absolute;top:12px;left:12px}
.sheetwrap{position:relative}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}
.scoregrid .srow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #FAF0D2}
.scoregrid .srow:last-child{border-bottom:none}
.scoregrid .sname{flex:1;min-width:0;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scoregrid input{width:78px;flex:none;text-align:center}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #FAF0D2;font-size:14px}
.kv:last-child{border-bottom:none}
.kv b{color:var(--pri-d)}
/* ===== تقویم شمسی (انتخاب تاریخ با لمس) ===== */
#calWrap{position:absolute;inset:0;z-index:70;display:none}
#calWrap.open{display:block}
#calWrap .scrim{position:absolute;inset:0;background:rgba(61,44,34,.45)}
.calSheet{position:absolute;right:0;left:0;bottom:0;margin:0 auto;width:min(96vw,480px);max-height:92%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -4px 24px rgba(0,0,0,.2)}
.calSheet h3{margin:0 0 6px;font-size:17px}
.calSheet .x{position:absolute;top:12px;left:12px}
.calNav{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.calNav .ttl{flex:1;text-align:center;font-weight:800;color:var(--pri-d);font-size:16px}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calGrid .wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0;font-weight:700}
.calDay{border:1.5px solid var(--line);background:#fff;border-radius:10px;min-height:44px;font-family:inherit;font-size:15px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center}
.calDay:active{background:var(--chip)}
.calDay.today{border-color:var(--pri);background:var(--chip);font-weight:800;color:var(--pri-d)}
.calDay.sel{background:var(--pri);border-color:var(--pri);color:#3D2C22;font-weight:800}
.calDay.empty{border:none;background:none;cursor:default;min-height:44px}
input.calField{cursor:pointer;background:#FFFDF5}
#toast{position:absolute;bottom:96px;right:50%;transform:translateX(50%) translateY(20px);background:#3D2C22;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(50%) translateY(0)}
#toast.err{background:var(--warn)}
.msg{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px;display:none}
.msg.ok{display:block;background:#E6F4EA;color:#3FA34D}
.msg.err{display:block;background:#FDECEA;color:var(--warn)}
.monthttl{font-size:14px;font-weight:800;color:var(--pri-d);margin:10px 2px 5px}
.done-topic{text-decoration:line-through;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
a{color:var(--pri-d)}
/* ===== v3: داشبوردها و ظاهر حرفه‌ای ===== */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--on-pri);border-radius:20px;padding:13px 15px;box-shadow:0 4px 16px rgba(var(--shc),.35);margin-bottom:9px}
.hero .deco{position:absolute;left:-16px;top:-16px;width:118px;height:118px;opacity:.5;pointer-events:none}
.hero .sch,.hero .cls,.hero .tch{position:relative}
.hero .sch{font-size:13px;opacity:.92}
.hero .cls{font-size:20px;font-weight:800;margin:2px 0;line-height:1.5}
.hero .tch{font-size:13px;opacity:.92}
.heroStu{position:relative;overflow:hidden;display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#FFF9E3,#FFEDB0);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--shadow);margin:9px 0}
.heroStu::before{content:'';position:absolute;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,217,77,.55),rgba(255,217,77,0) 70%);top:-70px;left:-50px;pointer-events:none}
.bigava{width:84px;height:84px;border-radius:50%;background:var(--chip);color:var(--pri-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:34px;flex:none;overflow:hidden;border:3px solid #fff;box-shadow:0 2px 10px rgba(214,164,32,.3)}
.avaWrap{position:relative;flex:none;cursor:pointer}
.cambadge{position:absolute;bottom:0;left:0;width:27px;height:27px;border-radius:50%;background:var(--pri);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 1px 5px rgba(0,0,0,.25);z-index:2}
.bigava img,.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar{overflow:hidden;padding:0}
.heroStu .nm2{font-size:19px;font-weight:800;line-height:1.5}
.heroStu .meta2{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(102px,1fr));gap:7px;margin-bottom:9px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 6px;text-align:center;box-shadow:var(--shadow)}
.stat .v{font-size:21px;font-weight:800;color:var(--pri-d);line-height:1.4}
.stat .v.good{color:#3FA34D}.stat .v.mid{color:#B8860B}.stat .v.bad{color:var(--warn)}
.stat .v.sm{font-size:13.5px;line-height:2}
.stat .l{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:5px;vertical-align:-1px}
table.grid{width:100%;border-collapse:collapse;font-size:13.5px}
table.grid th,table.grid td{padding:7px 6px;border-bottom:1px solid #FAF0D2;text-align:right}
table.grid th{color:var(--muted);font-weight:700;font-size:12.5px}
table.grid td.num,table.grid th.num{text-align:center}
.attchips{display:flex;gap:5px;flex:none}
.attchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--muted);min-height:34px}
.attchip.on-p{background:#E6F4EA;border-color:#3FA34D;color:#3FA34D;font-weight:800}
.attchip.on-a{background:#FDECEA;border-color:var(--warn);color:var(--warn);font-weight:800}
.attchip.on-l{background:#FFF6E0;border-color:#D9A404;color:#9A7400;font-weight:800}
.ringwrap{display:flex;align-items:center;gap:14px}
.ringwrap .grow2{flex:1;min-width:0}
.photobox{display:flex;align-items:center;gap:12px;margin-top:4px}
.photobox img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:var(--chip)}
/* گزارش والدین (پیش‌نمایش روی صفحه و چاپ) */
.rep{color:var(--ink)}
.rep-hero{background:linear-gradient(135deg,#F5A623,#D98E04);color:#4A3205;border-radius:12px;padding:12px 14px;-webkit-print-color-adjust:exact;print-color-adjust:exact;margin-bottom:10px;text-align:center}
.rep-hero .l1{font-weight:800;font-size:15.5px}
.rep-hero .l2{font-size:13px;margin-top:2px;opacity:.95}
.rep-hero .l3{font-size:11px;margin-top:2px;opacity:.85}
.rep-id{display:flex;align-items:center;gap:12px;margin:10px 0}
.rep-photo{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.rep-name{font-size:19px;font-weight:800}
.rep-meta{font-size:13px;color:var(--muted)}
.rep-stats{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.rep-stat{flex:1;min-width:70px;border:1.5px solid #F0C93F;border-radius:10px;padding:6px 4px;text-align:center;background:#FFFBEB;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rep-stat .v{font-size:18px;font-weight:800;color:#9C6603;line-height:1.4}
.rep-stat .l{font-size:11px;color:#8A6A45}
.rep-h{font-size:14.5px;margin:14px 0 6px;color:var(--pri-d)}
.rep-note{border:1.5px dashed #F5B301;border-radius:10px;padding:9px 12px;margin-top:12px;background:#FFFDF5;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:13.5px}
.rep-foot{margin-top:14px;text-align:center;font-size:12.5px;color:var(--muted)}
/* برگ عملکرد — گرافیک نمونهٔ تأییدشده: کارت‌های آماری رنگی، چیپ فعالیت، جداکنندهٔ کارنامه */
.perf .rep-h{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--pri-d);margin:13px 0 7px}
.perf .rep-h::before{content:'';width:5px;height:18px;border-radius:3px;background:linear-gradient(#F5B301,#F08A3C);flex:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.perf .pcards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.perf .pcards.c3{grid-template-columns:repeat(3,1fr)}
.perf .pcard{background:#fff;border:1.5px solid #F3D27A;border-top:4px solid #F5B301;border-radius:11px;padding:8px 6px;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.perf .pcard.g{border-top-color:#3FA34D}.perf .pcard.o{border-top-color:#F08A3C}.perf .pcard.r{border-top-color:#D9534F}
.perf .pcard .n{font-size:20px;font-weight:800;color:#9C6603;line-height:1.3}
.perf .pcard.g .n{color:#2E7D32}.perf .pcard.o .n{color:#D96F1E}.perf .pcard.r .n{color:#C0392B}
.perf .pcard .l{font-size:11.5px;color:#7A6A45;margin-top:2px}
.perf .pdates{font-size:12px;color:#7A6A45;margin-top:6px}
.perf .psum{font-size:12.5px;color:#7A6A45;margin-top:6px}
.perf .prow{font-size:12.5px;margin:3px 0}
.perf .pacts{background:#fff;border:1.5px solid #F3D27A;border-radius:11px;padding:8px 14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.perf .pact{font-size:13px;margin:4px 0;line-height:1.7}
.perf .ptag{display:inline-block;background:#FFF3D6;border:1px solid #F3D27A;border-radius:20px;padding:0 8px;font-size:11px;color:#9C6603;margin-left:5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.perf .pdivider{display:flex;align-items:center;gap:10px;margin:14px 0 2px}
.perf .pdivider::before,.perf .pdivider::after{content:'';flex:1;border-top:2px dashed #E8C96A}
.perf .pdivider span{font-size:12px;color:#9C6603;font-weight:700;background:#FFF8E1;border:1px solid #F3D27A;border-radius:20px;padding:1px 12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.perf .psig{display:flex;justify-content:space-between;font-size:12.5px;color:#7A6A45;padding:0 10px;margin-top:4px}
.perf .psig>div{width:170px;text-align:center}
.perf .sigline{border-top:1.5px solid #CBB26A;margin:26px 0 5px}
.lvlTag{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.repPrev{border:1px solid var(--line);border-radius:14px;padding:12px;background:#FFFDF9;margin-bottom:6px}
#printArea{display:none}
/* ===== همگام‌سازی خودکار: نقطهٔ وضعیت و بنر تعارض ===== */
.syncst{display:none;align-items:center;gap:5px;font-size:11.5px;background:rgba(255,255,255,.55);border:1px solid #EFD586;border-radius:999px;padding:1px 9px;margin-top:5px;color:#6B5320}
.syncst::before{content:'●';font-size:10px}
.syncst.ok{color:#2E7D32}.syncst.ok::before{color:#3FA34D}
.syncst.wait{color:#8A6A00}.syncst.wait::before{color:#D9A404}
.syncst.bad{color:#C0392B}.syncst.bad::before{color:#C0392B}
#syncBanner{position:absolute;top:0;right:0;left:0;z-index:80;background:#FDECEA;color:#7B1F14;border-bottom:2px solid #C0392B;padding:10px 14px;font-size:13.5px;display:none;box-shadow:0 2px 12px rgba(0,0,0,.18)}
#syncBanner.show{display:block}
#syncBanner button{float:left;border:none;background:#fff;color:#C0392B;width:30px;height:30px;border-radius:8px;font-size:14px;cursor:pointer;margin-right:8px}
.voiceBtn.listening{background:var(--chart-class)!important;color:#fff!important}
/* ===== سطح‌های توصیفی (نمرهٔ ۱ تا ۴) ===== */
.lvlchips{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:100%}
.lvlchip{border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-family:inherit;cursor:pointer;color:var(--muted);min-height:34px;font-weight:700}
.lvlchip.lv4.on{background:#3FA34D;border-color:#3FA34D;color:#fff}
.lvlchip.lv3.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.lvlchip.lv2.on{background:var(--chart-class);border-color:#F08A3C;color:#fff}
.lvlchip.lv1.on{background:var(--warn);border-color:var(--warn);color:#fff}
.scoregrid .srow{flex-wrap:wrap}
.lvlTag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--chip);color:var(--pri-d)}
.lvlTag.lv4{background:#E6F4EA;color:#2E7D32}.lvlTag.lv3{background:var(--chip);color:var(--pri-d)}
.lvlTag.lv2{background:#FFF1E0;color:#B85C12}.lvlTag.lv1{background:#FDECEA;color:var(--warn)}
.perfChecks{display:flex;flex-wrap:wrap;gap:7px 16px;margin:8px 0}
.perfChecks label{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:700;cursor:pointer}
.perfChecks input{width:auto!important;margin:0}
/* ===== هشدارهای داشبورد ===== */
.alertStrip{background:#FFF7E8;border:1.5px solid #F0B429;border-radius:18px;padding:11px 13px;margin-bottom:11px;box-shadow:var(--shadow)}
.alertStrip h3{margin:0 0 8px;font-size:15px;color:var(--pri-d)}
.alertStrip .achip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #F0C4BE;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);margin:0 0 6px 6px}
/* ===== انتخاب تم در تنظیمات ===== */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.themeBtn{display:flex;align-items:center;gap:9px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);min-height:48px}
.themeBtn .dot{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 2px 6px rgba(0,0,0,.18)}
.themeBtn.on{border-color:var(--pri);background:var(--chip)}
@page{size:A4;margin:12mm}
/* ===== نمونهٔ گرافیکی: ارتقای ظاهر (فقط CSS، بدون تغییر رفتار) ===== */
@media screen{
:root{
  --line:#F1DFAC; --shadow:0 1px 2px rgba(var(--shc),.05),0 10px 24px rgba(var(--shc),.13);
  --shadow-sm:0 1px 2px rgba(var(--shc),.05),0 4px 12px rgba(var(--shc),.12);
}
body{
  background:
    radial-gradient(340px 200px at 88% -40px, rgba(var(--shc),.35), rgba(var(--shc),0) 70%),
    radial-gradient(300px 220px at -60px 30%, rgba(var(--shc),.10), rgba(var(--shc),0) 70%),
    linear-gradient(180deg,var(--chip) 0,var(--bg) 260px,var(--bg) 100%);
  background-attachment:fixed;
  font-size:15.5px;
}
/* هدر: گرادیان عمیق‌تر + نقش خورشید + گوشه‌های گرد پایین */
header{
  background:
    radial-gradient(120px 120px at 12% -30px, rgba(255,255,255,.5), rgba(255,255,255,0) 70%),
    radial-gradient(200px 90px at 95% 130%, rgba(var(--shc),.35), rgba(var(--shc),0) 70%),
    linear-gradient(135deg,var(--hdr-a) 0%,var(--hdr-b) 58%,var(--hdr-c) 100%);
  border-bottom:none;border-radius:0 0 24px 24px;
  padding:14px 18px 13px;
  box-shadow:0 10px 28px rgba(var(--shc),.35);
}
header::after{content:'';position:absolute;left:10px;top:6px;width:48px;height:48px;border-radius:50%;border:2px dashed rgba(255,255,255,.32);pointer-events:none}
header{position:sticky;overflow:hidden}
header h1{font-size:20px;letter-spacing:-.2px;text-shadow:0 1px 0 rgba(255,255,255,.35)}
header p{opacity:.95;font-weight:600}
.syncst{background:rgba(255,255,255,.75);border-color:rgba(255,255,255,.8);box-shadow:var(--shadow-sm)}
/* بدنه: تمام‌عرض روی گوشی */
main{max-width:100%;width:100%;margin:0;padding:12px 13px 10px}
@media(min-width:760px){ main{max-width:720px;margin:0 auto} }
/* تیتر بخش‌ها: نوار گرادیانی به‌جای دایره */
h2.sec{font-size:16.5px;margin:14px 2px 8px;color:var(--deep);display:flex;align-items:center;gap:8px}
h2.sec::before{width:6px;height:19px;border-radius:3px;background:linear-gradient(180deg,var(--pri),var(--acc));box-shadow:none;margin:0;flex:none}
/* کارت‌ها و پنل‌ها: عمق واقعی */
.card,.panel,.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.panel{padding:14px 13px;margin-bottom:11px}
.panel h3{padding-bottom:7px;border-bottom:2px solid var(--chip);margin-bottom:10px}
.cards{gap:9px}
.card{position:relative;padding:13px 13px 11px;overflow:hidden}
.card::before{content:'';position:absolute;top:0;right:0;left:0;height:4px;background:linear-gradient(90deg,var(--pri),var(--pri-l))}
.cards .card:nth-child(2)::before{background:linear-gradient(90deg,var(--acc),var(--pri-l))}
.cards .card:nth-child(3)::before{background:linear-gradient(90deg,#3FA34D,#7BC98A)}
.cards .card:nth-child(4)::before{background:linear-gradient(90deg,var(--pri),var(--acc))}
.card .num{font-size:28px;background:var(--grad-num);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--deep)}
.card .lbl{font-weight:700;color:var(--deep)}
.stats{gap:8px}
.stat{position:relative;padding:10px 6px 9px;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--pri),var(--pri-l))}
.stat .v{font-size:22px}
/* هیرو */
.hero{background:linear-gradient(120deg,var(--hero-a) 0%,var(--hero-b) 55%,var(--hero-c) 100%);border-radius:22px;padding:15px 17px;box-shadow:0 12px 30px rgba(var(--shc),.38);margin-bottom:11px}
.hero .cls{font-size:19.5px}
.heroStu{background:linear-gradient(135deg,var(--card),var(--chip2));border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:14px}
/* آواتارها: حلقه و گرادیان */
.avatar{background:linear-gradient(135deg,var(--chip2),var(--pri-l));color:var(--deep);box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(var(--shc),.45),0 3px 8px rgba(var(--shc),.3);width:42px;height:42px}
.bigava{background:linear-gradient(135deg,var(--chip2),var(--pri-l));color:var(--deep);border:3px solid #fff;box-shadow:0 0 0 3px rgba(var(--shc),.5),0 6px 16px rgba(var(--shc),.35)}
/* ردیف‌ها */
.rowitem{border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);padding:10px 12px;margin-bottom:7px;transition:transform .08s,background .08s}
.rowitem:active{background:var(--chip);transform:scale(.99)}
.rowitem .nm{font-size:15.5px}
/* دکمه‌ها: گرادیان و عمق */
.btn{background:linear-gradient(180deg,var(--pri-l),var(--pri));border-radius:14px;box-shadow:0 5px 14px rgba(var(--shc),.38),inset 0 1px 0 rgba(255,255,255,.55);color:var(--on-pri)}
.btn:active{background:linear-gradient(180deg,var(--pri),var(--pri-d));transform:translateY(1px)}
.btn.ghost{background:var(--card);border:1.5px solid var(--pri);box-shadow:var(--shadow-sm);color:var(--pri-d)}
.btn.soft{background:linear-gradient(180deg,var(--chip),var(--chip2));box-shadow:var(--shadow-sm);color:var(--pri-d)}
.btn.danger{background:#fff;box-shadow:var(--shadow-sm)}
.iconbtn{background:linear-gradient(180deg,var(--chip),var(--chip2));box-shadow:var(--shadow-sm);border-radius:12px}
.chip{border-color:var(--line2);box-shadow:var(--shadow-sm)}
.chip.on{background:linear-gradient(180deg,var(--pri-l),var(--pri));border-color:var(--pri-d);box-shadow:0 3px 9px rgba(var(--shc),.3)}
.badge{font-weight:700;border:1px solid rgba(var(--shc),.18)}
/* ورودی‌ها */
input,select,textarea{border:1.5px solid var(--line2);border-radius:12px;background:var(--card)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(var(--shc),.25)}
/* جدول‌ها */
table.grid th{background:var(--chip);color:var(--deep)}
table.grid th:first-child{border-radius:8px 0 0 0}table.grid th:last-child{border-radius:0 8px 0 0}
/* حالت خالی و راهنما: جمع‌وجورتر و شکیل‌تر */
.empty{background:linear-gradient(180deg,var(--card),var(--chip));border:1.5px dashed var(--line2);border-radius:20px;padding:15px 14px;box-shadow:var(--shadow-sm)}
.empty .big{background:linear-gradient(135deg,var(--chip2),var(--pri-l));box-shadow:0 4px 12px rgba(var(--shc),.35)}
.guide{background:var(--chip);border:1px solid var(--line);border-right:4px solid var(--pri);border-radius:14px;box-shadow:var(--shadow-sm);padding:8px 12px}
/* نوار تب پایین: سایهٔ نرم + قرص فعال */
nav#tabbar{background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);box-shadow:0 -8px 26px rgba(var(--shc),.15);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
nav#tabbar button{border-radius:16px;margin:2px;min-height:66px;transition:background .12s}
nav#tabbar button.on{background:linear-gradient(180deg,var(--chip),var(--pri-l));color:var(--deep);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 9px rgba(var(--shc),.22)}
nav#tabbar button.on .ic{transform:scale(1.12)}
nav#tabbar button .ic{transition:transform .12s}
/* برگهٔ پاپ‌آپ: دستگیره + گوشه‌های گردتر */
.sheet{width:100%;max-width:560px;border-radius:26px 26px 0 0;box-shadow:0 -10px 34px rgba(61,44,34,.3);padding-top:10px}
.sheet::before{content:'';display:block;width:46px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.attchip{box-shadow:var(--shadow-sm)}
}



/* پرداخت نهایی تم روشن چندرنگ: کارت‌ها، پنل‌ها و کنترل‌ها */
#app .stats .stat{border-top:3px solid transparent;transition:transform .16s ease,box-shadow .16s ease}
#app .stats .stat:nth-child(4n+1){border-top-color:#E8B33D;background:linear-gradient(180deg,#FFFCF2,#fff 42%)}
#app .stats .stat:nth-child(4n+2){border-top-color:#67A9D8;background:linear-gradient(180deg,#F4FAFF,#fff 42%)}
#app .stats .stat:nth-child(4n+3){border-top-color:#65B88A;background:linear-gradient(180deg,#F3FBF6,#fff 42%)}
#app .stats .stat:nth-child(4n){border-top-color:#B08BD8;background:linear-gradient(180deg,#FAF6FF,#fff 42%)}
#app .stats .stat:nth-child(4n+1) .v{color:#A87512}
#app .stats .stat:nth-child(4n+2) .v{color:#3479AE}
#app .stats .stat:nth-child(4n+3) .v{color:#34865B}
#app .stats .stat:nth-child(4n) .v{color:#7954A8}
#app .cards .card{border-top:3px solid transparent}
#app .cards .card:nth-child(4n+1){border-top-color:#E8B33D}
#app .cards .card:nth-child(4n+2){border-top-color:#67A9D8}
#app .cards .card:nth-child(4n+3){border-top-color:#65B88A}
#app .cards .card:nth-child(4n){border-top-color:#B08BD8}
#app .panel{box-shadow:0 3px 14px rgba(65,75,95,.055);border-color:color-mix(in srgb,var(--line) 78%,#D8E1EE)}
#app .panel h3::before{content:'';display:inline-block;width:4px;height:14px;border-radius:5px;background:linear-gradient(180deg,#F0B84B,#69B7A0);margin-left:7px;vertical-align:-2px}
#app .rowitem{transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease}
#app .rowitem:active{transform:scale(.992)}
#app .avatar{box-shadow:inset 0 0 0 1px rgba(255,255,255,.85)}
#app .btn{transition:transform .14s ease,box-shadow .14s ease,filter .14s ease}
#app .btn:active{transform:translateY(1px);filter:saturate(1.05)}
#app .btn:focus-visible,#app .iconbtn:focus-visible{outline:3px solid rgba(66,130,190,.28);outline-offset:2px}
#app .guide{background:linear-gradient(100deg,#FFF8E6,#F2FAFF);border-color:#EADAAE;color:#80653C}
#app .empty{background:linear-gradient(145deg,#FFFDF4,#F6FAFF);border-color:#E7DDBF}
@media(max-width:420px){#app .stats{gap:6px}#app .stats .stat{border-radius:14px;padding:7px 4px}}

/* آیکون‌های برداری ناوبری و رنگ‌های ملایم هر بخش */
nav#tabbar button .ic{width:38px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:0;transition:transform .18s ease,background .18s ease}
nav#tabbar button .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav#tabbar button:nth-child(1) .ic{background:#FFF2D8;color:#C88713}
nav#tabbar button:nth-child(2) .ic{background:#E8F3FF;color:#3979C6}
nav#tabbar button:nth-child(3) .ic{background:#F2EAFE;color:#8459B8}
nav#tabbar button:nth-child(4) .ic{background:#E6F6EF;color:#278A62}
nav#tabbar button:nth-child(5) .ic{background:#E7F5F7;color:#288B99}
nav#tabbar button:nth-child(6) .ic{background:#FFF0E8;color:#D9783D}
nav#tabbar button:nth-child(7) .ic{background:#E9F2FF;color:#426FC0}
nav#tabbar button:nth-child(8) .ic{background:#FCEAF0;color:#C45E83}
nav#tabbar button:nth-child(9) .ic{background:#F0EFF3;color:#746B82}
nav#tabbar button.on .ic{box-shadow:inset 0 0 0 1.5px currentColor,0 2px 6px rgba(50,60,80,.10);transform:translateY(-2px)}
nav#tabbar button:active .ic{transform:scale(.94)}


/* محیط سنجش پیش از چاپ: همان عرض چاپ A4، بدون نمایش روی صفحه */
body.print-measure #appShell{display:none!important}
body.print-measure #printArea{display:block!important;position:absolute!important;left:-10000px!important;top:0!important;width:194mm!important;visibility:hidden!important}
body.print-measure #printArea .print-page,body.print-measure #printArea .perf-page{width:194mm!important;max-width:194mm!important;box-sizing:border-box!important}
body.print-measure #printArea .print-page.compact{font-size:10.8px;line-height:1.3}
body.print-measure #printArea .print-page.compact .rep-hero{padding:5px 8px;margin-bottom:5px}
body.print-measure #printArea .print-page.compact .rep-hero .l1{font-size:13px}
body.print-measure #printArea .print-page.compact .rep-hero .l2{font-size:10.8px}
body.print-measure #printArea .print-page.compact .rep-hero .l3{font-size:9.8px}
body.print-measure #printArea .print-page.compact .rep-id{margin:4px 0;gap:7px}
body.print-measure #printArea .print-page.compact .rep-photo{width:42px;height:42px}
body.print-measure #printArea .print-page.compact .rep-name{font-size:14.5px}
body.print-measure #printArea .print-page.compact .rep-meta{font-size:10.2px}
body.print-measure #printArea .print-page.compact .rep-stats{gap:4px;margin:5px 0}
body.print-measure #printArea .print-page.compact .rep-stat{padding:3px 2px}
body.print-measure #printArea .print-page.compact .rep-stat .v{font-size:14px;line-height:1.2}
body.print-measure #printArea .print-page.compact .rep-stat .l{font-size:9.5px}
body.print-measure #printArea .print-page.compact .rep-h{font-size:11.5px;margin:5px 0 2px}
body.print-measure #printArea .print-page.compact table.grid th,body.print-measure #printArea .print-page.compact table.grid td{padding:2px 3px;font-size:10.2px;line-height:1.25}
body.print-measure #printArea .print-page.compact .rep-note{margin-top:5px;padding:4px 7px;font-size:10.2px}
body.print-measure #printArea .print-page.compact .rep-foot{margin-top:5px;font-size:10px}
@media print{
  @page{size:A4 portrait;margin:8mm}
  #appShell{display:none!important}
  html,body{height:auto!important;overflow:visible!important}
  body{padding:0;background:#fff;position:static!important;top:auto!important;left:auto!important;right:auto!important;width:auto!important;overflow:visible!important}
  #printArea{display:block!important;color:#000;font-size:13px}
  #printArea .perf-page,#printArea .print-page{page-break-after:always;break-after:page}

function seedAnnualPlans(d){
  if(d._annualSeedV1)return;
  if(!Array.isArray(d.plan))d.plan=[];
  ANNUAL_PLAN_SEED.forEach(function(p){
    var exists=d.plan.some(function(x){return x.sourceKey===p.sourceKey||(x.subject===p.subject&&x.month===p.month&&String(x.week)===String(p.week)&&Number(x.sessionNo||1)===p.sessionNo);});
    if(!exists)d.plan.push(Object.assign({},p));
  });
  d._annualSeedV1=1;
}

function normalizeDb(d){
  d.students=d.students||[]; d.exams=d.exams||[]; d.scores=d.scores||{}; d.plan=d.plan||[]; d.attendance=d.attendance||[]; d.groups=d.groups||[]; d.gacts=d.gacts||[]; d.acts=d.acts||[]; d.wallnews=d.wallnews||[]; d.quizzes=d.quizzes||[]; d.qscores=d.qscores||{};
  d.behavior=d.behavior||[]; d.meetings=d.meetings||[]; d.descrep=d.descrep||{}; d.costs=d.costs||[];
  if(!d.timetable||!Array.isArray(d.timetable.days)) d.timetable=defaultTimetable();
  var td=defaultTimetable(); d.timetable.periodCount=Math.max(1,Math.min(8,Number(d.timetable.periodCount)||5));
  ['startTime','periodMinutes','breakAfter','breakMinutes'].forEach(function(k){if(d.timetable[k]===undefined)d.timetable[k]=td[k];});
  td.days.forEach(function(day){var old=d.timetable.days.filter(function(x){return x.key===day.key;})[0];if(!old){d.timetable.days.push(day);}else{old.name=day.name;old.lessons=Array.isArray(old.lessons)?old.lessons:day.lessons.slice();old.enabled=old.enabled!==false;while(old.lessons.length<8)old.lessons.push('');}});
  seedAnnualPlans(d);

}
/* مهاجرت نمره‌های عددی ۰ تا ۲۰ به سطح‌های توصیفی ۱ تا ۴ — فقط یک بار (پرچم _lv) */
function numToLevel(n){ n=Number(n); if(isNaN(n)) return null; if(n>=17) return 4; if(n>=14) return 3; if(n>=10) return 2; return 1; }
function migrateLevels(d){
  function conv(map){ if(!map) return; Object.keys(map).forEach(function(k){ var v=map[k]; if(typeof v==='number'&&!isNaN(v)) map[k]=numToLevel(v); }); }
  Object.keys(d.scores||{}).forEach(function(id){ conv(d.scores[id]); });
  Object.keys(d.qscores||{}).forEach(function(id){ conv(d.qscores[id]); });
  (d.gacts||[]).forEach(function(a){ if(a.score!==null&&a.score!==undefined&&a.score!=='') a.score=numToLevel(a.score); });
  d._lv=1; return d;
}
function lvNeedsMig(d){
  if(!d) return false;
  if(!d._lv) return true;
  var sc=d.scores||{}, qs=d.qscores||{}, k,s2;
  for(k in sc){ for(s2 in sc[k]){ if(typeof sc[k][s2]==='number'&&sc[k][s2]>4) return true; } }
  for(k in qs){ for(s2 in qs[k]){ if(typeof qs[k][s2]==='number'&&qs[k][s2]>4) return true; } }
  return false;
}
function loadDb(){

    var raw=localStorage.getItem(LS_DB);
    if(!raw){var fresh=emptyDb();normalizeDb(fresh);try{localStorage.setItem(LS_DB,JSON.stringify(fresh));}catch(e){}return fresh;}
    var d=JSON.parse(raw); if(!d||typeof d!=='object'){var reset=emptyDb();normalizeDb(reset);try{localStorage.setItem(LS_DB,JSON.stringify(reset));}catch(e){}return reset;}
    var hadAnnualSeed=!!d._annualSeedV1;
    normalizeDb(d);
    var needsLevelMigration=lvNeedsMig(d);if(needsLevelMigration)migrateLevels(d);
    if(!hadAnnualSeed||needsLevelMigration){try{localStorage.setItem(LS_DB,JSON.stringify(d));}catch(e){}}
    return d;
  }catch(e){var fallback=emptyDb();normalizeDb(fallback);return fallback;}
}

var FA='۰۱۲۳۴۵۶۷۸۹';
function fa(x){ if(x===null||x===undefined||x==='') return '—'; return String(x).replace(/[0-9]/g,function(d){return FA[+d];}).replace(/\./g,'٫'); }
function faNum(x,dec){ if(x===null||x===undefined||isNaN(x)) return '—'; var s=(dec!=null)?Number(x).toFixed(dec):String(Math.round(Number(x)*100)/100); return fa(s); }
function faScore(v){ if(v===null||v===undefined||isNaN(v)) return '—'; return fa(String(Math.round(Number(v)*100)/100)); }
/* ===== سطح‌های توصیفی: ۴=خیلی خوب، ۳=خوب، ۲=قابل قبول، ۱=نیازمند تلاش ===== */
var LEVELS={4:'خیلی خوب',3:'خوب',2:'قابل قبول',1:'نیازمند تلاش'};
var LEVEL_LIST=[4,3,2,1];
function lvlLabel(v){ if(v===null||v===undefined||isNaN(v)) return '—'; var n=Math.max(1,Math.min(4,Math.round(Number(v)))); return LEVELS[n]; }
function faMean(v){ if(v===null||v===undefined||isNaN(v)) return '—'; var r=Math.round(Number(v)*10)/10; return fa(String(r)); }
function faLevel(v){ if(v===null||v===undefined||isNaN(v)) return '—'; return lvlLabel(v)+' ('+faMean(v)+')'; }
function lvlTag(v){ if(v===null||v===undefined||isNaN(v)) return '—'; var n=Math.max(1,Math.min(4,Math.round(Number(v)))); return '<span class="lvlTag lv'+n+'">'+LEVELS[n]+'</span>'; }
function scoreLabel(v){ if(v===null||v===undefined||isNaN(v)) return '—'; return lvlLabel(v); }
function enDigits(s){ return String(s||'').replace(/[۰-۹]/g,function(d){return FA.indexOf(d);}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}); }
function parseScore(s){ s=enDigits(String(s||'').trim()).replace('٫','.').replace(',','.'); if(s==='') return null; var n=parseFloat(s); if(isNaN(n)||n<0||n>20) return undefined; return n; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function needsAttention(){
  var out=[];
  db.students.forEach(function(s){
    var es=studentEntries(s.id), reasons=[];
    var av=studentAvg(s.id);
    if(av!==null&&av<2.5) reasons.push('میانگین سطح پایین ('+faLevel(av)+')');
    var last3=es.slice(-3);
    if(last3.some(function(x){ return x.score===1; })) reasons.push('سطح «نیازمند تلاش» در آزمون‌های اخیر');
    if(es.length>=2&&es[es.length-1].score<es[es.length-2].score) reasons.push('افت سطح در دو آزمون اخیر');
    var att=attStats(s.id);
    if(att.a>=3) reasons.push('غیبت زیاد ('+fa(att.a)+' جلسه)');
    var tn=todayDayNum(), recentNeg=(db.behavior||[]).filter(function(b){ return b.studentId===s.id&&b.kind==='neg'; }).filter(function(b){ var dn=jDayNum(b.date); return dn!==null&&(tn-dn)>=0&&(tn-dn)<=30; }).length;
    if(recentNeg>=2) reasons.push('موارد انضباطی');
    if(reasons.length) out.push({student:s,reasons:reasons,avg:av,trend:studentTrend(s.id)});
  });
  return out;
}

/* ===== حضور و غیاب: درصد حضور = (حاضر + تأخیر) ÷ جلسات ثبت‌شده × ۱۰۰ ===== */
function attSessions(){ return (db.attendance||[]).slice().sort(function(a,b){ var ka=dateKey(a.date),kb=dateKey(b.date); if(ka<kb) return -1; if(ka>kb) return 1; return 0; }); }
function attStats(studentId){
  var ses=attSessions(), p=0,a=0,l=0, absDates=[], lateDates=[];
  ses.forEach(function(sn){ var m=(sn.marks||{})[studentId]; if(m==='a'){ a++; absDates.push(sn.date); } else if(m==='l'){ l++; lateDates.push(sn.date); } else if(m==='p'){ p++; } });
  var marked=p+a+l;
  return { total:ses.length, marked:marked, p:p, a:a, l:l, pct:marked?Math.round((p+l)/marked*100):null, absDates:absDates, lateDates:lateDates };
}
function classAtt(){
  var ses=attSessions(), p=0,a=0,l=0;
  ses.forEach(function(sn){ Object.keys(sn.marks||{}).forEach(function(k){ var m=sn.marks[k]; if(m==='a')a++; else if(m==='l')l++; else if(m==='p')p++; }); });
  var tot=p+a+l, last=ses.length?ses[ses.length-1]:null, lc=null;
  if(last){ var lp=0,la=0,ll=0; Object.keys(last.marks||{}).forEach(function(k){ var m=last.marks[k]; if(m==='a')la++; else if(m==='l')ll++; else lp++; }); lc={p:lp,a:la,l:ll}; }
  return { sessions:ses.length, p:p, a:a, l:l, pct:tot?Math.round((p+l)/tot*100):null, last:last, lastCounts:lc };
}
/* ===== میانگین درس‌ها و توزیع ===== */
function subjectAvgs(studentId){
  var subs=[]; db.exams.forEach(function(e){ if(subs.indexOf(e.subject)<0) subs.push(e.subject); });
  return subs.map(function(sub){
    var sv=[], cv=[];
    db.exams.forEach(function(e){ if(e.subject!==sub) return; cv=cv.concat(examScores(e.id)); if(studentId){ var v=scoreOf(e.id,studentId); if(v!==null) sv.push(v); } });
    return { subject:sub, stu:studentId?avgOf(sv):null, cls:avgOf(cv) };
  }).filter(function(x){ return x.cls!==null||x.stu!==null; });
}
function distBuckets(){
  var b=[0,0,0,0];
  db.students.forEach(function(s){ var av=studentAvg(s.id); if(av===null) return; var r=Math.max(1,Math.min(4,Math.round(av))); b[4-r]++; });
  return b;
}
function statusOf(av){ if(av===null||av===undefined) return ''; if(av>=3.5) return 'good'; if(av>=2.5) return 'mid'; return 'bad'; }
function ringSvg(pct){
  if(pct===null||pct===undefined) return '';
  var r=30, c=2*Math.PI*r, off=c*(1-pct/100);
  var col=pct>=90?'#3FA34D':pct>=75?'#D9A404':'#C0392B';
  return '<svg width="76" height="76" viewBox="0 0 76 76" style="flex:none"><circle cx="38" cy="38" r="'+r+'" fill="none" stroke="#F7EBC8" stroke-width="8"/><circle cx="38" cy="38" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 38 38)"/><text x="38" y="44" font-size="15" font-weight="800" text-anchor="middle" fill="'+col+'">'+fa(pct)+'٪</text></svg>';
}
function subjectBarsSvg(rows,paired){
  var W=330, maxW=W-44;
  function bw(v){ return Math.max(0,Math.min(4,v))/4*maxW; }
  var out='';
  rows.forEach(function(r){
    var lbl='';
    if(paired){ var parts=[]; if(r.stu!==null) parts.push('دانش‌آموز: '+faLevel(r.stu)); if(r.cls!==null) parts.push('کلاس: '+faLevel(r.cls)); lbl=parts.join(' · '); }
    else if(r.cls!==null) lbl='کلاس: '+faLevel(r.cls);
    out+='<div style="font-size:12.5px;font-weight:700;margin:9px 0 3px">'+esc(r.subject)+(lbl?' <span style="font-weight:400;color:var(--muted);font-size:12px">('+lbl+')</span>':'')+'</div>';
    var gh=paired?30:16, s='<svg class="chart" viewBox="0 0 '+W+' '+gh+'" role="img">';
    if(paired){
      if(r.stu!==null) s+='<rect x="'+(W-2-bw(r.stu)).toFixed(1)+'" y="1" width="'+bw(r.stu).toFixed(1)+'" height="11" rx="5.5" fill="var(--chart-student)"/><text x="'+(W-7-bw(r.stu)).toFixed(1)+'" y="10.5" font-size="10.5" font-weight="bold" text-anchor="end" fill="var(--chart-student)">'+faMean(r.stu)+'</text>';
      if(r.cls!==null) s+='<rect x="'+(W-2-bw(r.cls)).toFixed(1)+'" y="16" width="'+bw(r.cls).toFixed(1)+'" height="11" rx="5.5" fill="var(--chart-class)" opacity="0.8"/><text x="'+(W-7-bw(r.cls)).toFixed(1)+'" y="25.5" font-size="10.5" font-weight="bold" text-anchor="end" fill="var(--chart-class)">'+faMean(r.cls)+'</text>';
    }else{
      if(r.cls!==null) s+='<rect x="'+(W-2-bw(r.cls)).toFixed(1)+'" y="2" width="'+bw(r.cls).toFixed(1)+'" height="12" rx="6" fill="var(--chart-class)"/><text x="'+(W-7-bw(r.cls)).toFixed(1)+'" y="12" font-size="10.5" font-weight="bold" text-anchor="end" fill="var(--chart-class)">'+faMean(r.cls)+'</text>';
    }
    out+=s+'</svg>';
  });
  return out;
}
function distSvg(){
  var b=distBuckets(), labels=['خیلی خوب','خوب','قابل قبول','نیازمند تلاش'], names=['سطح ۴','سطح ۳','سطح ۲','سطح ۱'], cols=['#3FA34D','#D9A404','#F08A3C','#C0392B'];
  var W=330,H=170, base=134, maxV=Math.max(1,Math.max.apply(null,b)), plotH=94, out='';
  [0,0.5,1].forEach(function(f){ var y=base-plotH*f; out+='<line x1="26" y1="'+y+'" x2="'+(W-4)+'" y2="'+y+'" stroke="#F7EBC8" stroke-width="1"/><text x="22" y="'+(y+3)+'" font-size="9.5" text-anchor="end" fill="#9A7B68">'+fa(Math.round(maxV*f))+'</text>'; });
  b.forEach(function(n,i){
    var cx=26+(W-30)/4*i+(W-30)/8, bw2=46, bh=plotH*(n/maxV);
    out+='<rect x="'+(cx-bw2/2)+'" y="'+(base-bh)+'" width="'+bw2+'" height="'+bh+'" rx="6" fill="'+cols[i]+'"/>'
      +'<text x="'+cx+'" y="'+(base-bh-6)+'" font-size="13" font-weight="800" text-anchor="middle" fill="'+cols[i]+'">'+fa(n)+' نفر</text>'
      +'<text x="'+cx+'" y="'+(base+16)+'" font-size="10.5" text-anchor="middle" fill="#3D2C22">'+labels[i]+'</text>'
      +'<text x="'+cx+'" y="'+(base+30)+'" font-size="9.5" text-anchor="middle" fill="#9A7B68">'+names[i]+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+out+'</svg>';
}
function sparkSvg(sid){
  var es=studentEntries(sid);
  if(es.length<2) return '<p class="hint">برای نمایش روند، دست‌کم دو نمره لازم است.</p>';
  var W=330,H=92,pl=30,pr=8,pt=14,pb=18, iw=W-pl-pr, ih=H-pt-pb;
  var vals=es.map(function(x){ return x.score; });
  var min=Math.max(0,Math.floor(Math.min.apply(null,vals)-1)), max=Math.min(4,Math.ceil(Math.max.apply(null,vals)+1)); if(max-min<1) max=min+1;
  function X(i){ return pl+iw*i/(es.length-1); }
  function Y(v){ return pt+ih-(v-min)/(max-min)*ih; }
  var line=es.map(function(x,i){ return X(i).toFixed(1)+','+Y(x.score).toFixed(1); }).join(' ');
  var dots=es.map(function(x,i){ return '<circle cx="'+X(i)+'" cy="'+Y(x.score)+'" r="3.5" fill="var(--chart-student)"/><text x="'+X(i)+'" y="'+(Y(x.score)-7)+'" font-size="10" text-anchor="middle" fill="var(--chart-student)" font-weight="bold">'+fa(x.score)+'</text><text x="'+X(i)+'" y="'+(H-4)+'" font-size="9" text-anchor="middle" fill="#9A7B68">'+esc(x.exam.date||'')+'</text>'; }).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img"><polyline points="'+line+'" fill="none" stroke="var(--chart-student)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'</svg>';
}

function chartSvg(){
  var subs=['همه']; db.exams.forEach(function(e){ if(subs.indexOf(e.subject)<0) subs.push(e.subject); });
  var chips=subs.map(function(s){ return '<button class="chip'+(chartSubject===s?' on':'')+'" data-subject-chip="'+esc(s)+'">'+esc(s)+'</button>'; }).join('');
  var ex=examsSorted().filter(function(e){ return chartSubject==='همه'||e.subject===chartSubject; });
  var pts=ex.map(function(e){ return {e:e,avg:examAvg(e.id)}; }).filter(function(p){ return p.avg!==null; });
  var body='';
  if(pts.length<2){ body='<p class="hint">برای نمایش نمودار روند، دست‌کم نمرات دو آزمون لازم است.</p>'; }
  else{
    var W=320,H=150,pl=34,pr=10,pt=14,pb=24, iw=W-pl-pr, ih=H-pt-pb;
    var min=4,max=0; pts.forEach(function(p){ if(p.avg<min)min=p.avg; if(p.avg>max)max=p.avg; });
    min=Math.max(0,Math.floor(min-0.5)); max=Math.min(4,Math.ceil(max+0.5)); if(max-min<1){max=min+1;}
    function X(i){ return pl+iw*(pts.length===1?0.5:i/(pts.length-1)); }
    function Y(v){ return pt+ih-(v-min)/(max-min)*ih; }
    var line=pts.map(function(p,i){ return X(i).toFixed(1)+','+Y(p.avg).toFixed(1); }).join(' ');
    var dots=pts.map(function(p,i){ return '<circle cx="'+X(i)+'" cy="'+Y(p.avg)+'" r="4" fill="var(--chart-student)"/><text x="'+X(i)+'" y="'+(Y(p.avg)-8)+'" font-size="10.5" text-anchor="middle" fill="var(--chart-student)" font-weight="bold">'+faMean(p.avg)+'</text><text x="'+X(i)+'" y="'+(H-6)+'" font-size="9.5" text-anchor="middle" fill="#9A7B68">'+esc(p.e.date||'')+'</text>'; }).join('');
    var grid=''; for(var g=0;g<=2;g++){ var v=min+(max-min)*g/2, y=Y(v); grid+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="#F7EBC8" stroke-width="1"/><text x="'+(pl-4)+'" y="'+(y+3)+'" font-size="9.5" text-anchor="end" fill="#9A7B68">'+faMean(v)+'</text>'; }
    body='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+grid+'<polyline points="'+line+'" fill="none" stroke="var(--chart-student)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'</svg>';
  }
  return '<div class="panel"><h3>📈 روند تحصیلی کلاس (میانگین هر آزمون)</h3><div class="chips">'+chips+'</div>'+body+'</div>';
}

/* ===== گفتگوها (دیالوگ) ===== */
var sheet=document.getElementById('sheet'), modalWrap=document.getElementById('modalWrap');
/* پوستهٔ فلکس: صفحه اسکرول نمی‌شود (main اسکرول داخلی دارد) و پوشش پاپ‌آپ دقیقاً هم‌اندازهٔ پوسته است؛
   پس برگه همیشه کامل داخل نماست — بدون قفل اسکرول بدنه و بدون visualViewport. */
/* ذخیرهٔ خودکار هنگام خروج: هر پنجره‌ای که ورودی مرحله‌ای دارد (شبکهٔ نمره، چیپ‌های کارنامه، فرم‌ها)
   یک dlgCommit ثبت می‌کند؛ بستن پنجره (بستن/✕/لمس بیرون)، بازشدن پنجرهٔ دیگر و رفرش صفحه، اول آن را اجرا می‌کند تا چیزی نپرد.
   ذخیرهٔ صریح با دکمهٔ «ذخیره» هم dlgCommit را از saveDb پاک می‌کند تا دوباره‌کاری (رکورد تکراری) پیش نیاید. */
var dlgCommit=null;
function runDlgCommit(){ var c=dlgCommit; dlgCommit=null; if(c){ try{ c(); }catch(e){} } }
function openDlg(html){
  runDlgCommit();
  sheet.innerHTML='<div class="sheetwrap">'+html+'</div>';
  modalWrap.classList.add('open');
  sheet.scrollTop=0;
}
function closeDlg(){
  runDlgCommit();
  modalWrap.classList.remove('open');
  sheet.innerHTML='';

function silentFormSave(fn){
  return function(){
    var oc=closeDlg, ot=toast;

    try{ fn(); }catch(e){}

}

function studentTrendInner(id){
  var subs=['همه']; db.exams.forEach(function(e){ if(subs.indexOf(e.subject)<0) subs.push(e.subject); });
  var chips=subs.map(function(x){ return '<button class="chip'+(stuSubject===x?' on':'')+'" data-stuchip="'+esc(x)+'">'+esc(x)+'</button>'; }).join('');
  var ex=examsSorted().filter(function(e){ return stuSubject==='همه'||e.subject===stuSubject; });
  var pts=ex.map(function(e){ return {e:e,v:scoreOf(e.id,id),ca:examAvg(e.id)}; }).filter(function(p){ return p.v!==null; });
  var head='<div class="chips">'+chips+'</div>';
  if(pts.length<2) return head+'<p class="hint">برای نمایش نمودار روند، دست‌کم نمرات دو آزمون لازم است.</p>';
  var W=320,H=150,pl=34,pr=10,pt=14,pb=24, iw=W-pl-pr, ih=H-pt-pb;
  var min=4,max=0; pts.forEach(function(p){ if(p.v<min)min=p.v; if(p.v>max)max=p.v; if(p.ca!==null){ if(p.ca<min)min=p.ca; if(p.ca>max)max=p.ca; } });
  min=Math.max(0,Math.floor(min-0.5)); max=Math.min(4,Math.ceil(max+0.5)); if(max-min<1){ max=min+1; }
  function X(i){ return pl+iw*(pts.length===1?0.5:i/(pts.length-1)); }
  function Y(v){ return pt+ih-(v-min)/(max-min)*ih; }
  var grid=''; for(var g=0;g<=2;g++){ var v=min+(max-min)*g/2, y=Y(v); grid+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="#F7EBC8" stroke-width="1"/><text x="'+(pl-4)+'" y="'+(y+3)+'" font-size="9.5" text-anchor="end" fill="#9A7B68">'+faMean(v)+'</text>'; }
  var line=pts.map(function(p,i){ return X(i).toFixed(1)+','+Y(p.v).toFixed(1); }).join(' ');
  var caline=pts.map(function(p,i){ return p.ca===null?null:X(i).toFixed(1)+','+Y(p.ca).toFixed(1); }).filter(Boolean).join(' ');
  var dots=pts.map(function(p,i){ return '<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="4" fill="var(--chart-student)"/><text x="'+X(i)+'" y="'+(Y(p.v)-8)+'" font-size="10.5" text-anchor="middle" fill="var(--chart-student)" font-weight="bold">'+fa(p.v)+'</text><text x="'+X(i)+'" y="'+(H-6)+'" font-size="9.5" text-anchor="middle" fill="#9A7B68">'+esc(p.e.date||'')+'</text>'; }).join('');
  var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+grid
    +(caline?'<polyline points="'+caline+'" fill="none" stroke="var(--chart-class)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>':'')
    +'<polyline points="'+line+'" fill="none" stroke="var(--chart-student)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'</svg>';
  return head+'<div class="legend"><span><i style="background:var(--chart-student)"></i>نمرهٔ دانش‌آموز</span><span><i style="background:var(--chart-class)"></i>میانگین کلاس در همان آزمون</span></div>'+svg;
}

function processPhoto(dataUrl){
  return new Promise(function(res,rej){
    var img=new Image();
    img.onload=function(){
      try{
        var sc=Math.min(1,256/Math.max(img.width,img.height));
        var w=Math.max(1,Math.round(img.width*sc)), h=Math.max(1,Math.round(img.height*sc));
        var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        res(cv.toDataURL('image/jpeg',0.8));
      }catch(e){ rej(e); }
    };
    img.onerror=function(){ rej(new Error('bad image')); };
    img.src=dataUrl;
  });
}

function timetableCounts(tt){var out={};(tt.days||[]).filter(function(d){return d.enabled!==false;}).forEach(function(d){(d.lessons||[]).slice(0,tt.periodCount||5).forEach(function(x){var k=String(x||'').trim();if(k)out[k]=(out[k]||0)+1;});});return out;}
function saveTimetable(){
  var old=db.timetable||defaultTimetable(),count=Math.max(1,Math.min(8,Number(document.getElementById('tt_count').value)||5));

/* ===== تقویم شمسی (تبدیل و انتخاب تاریخ) ===== */
var JMONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function g2j(gy,gm,gd){
  var gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  var jy=(gy<=1600)?0:979;
  gy-=(gy<=1600)?621:1600;
  var gy2=(gm>2)?(gy+1):gy;
  var days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];
  jy+=33*Math.floor(days/12053); days%=12053;
  jy+=4*Math.floor(days/1461); days%=1461;
  jy+=Math.floor((days-1)/365);
  if(days>365) days=(days-1)%365;
  var jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  var jd=1+((days<186)?(days%31):((days-186)%30));
  return {y:jy,m:jm,d:jd};
}
function j2g(jy,jm,jd){
  var gy=(jy<=979)?621:1600;
  jy-=(jy<=979)?0:979;
  var days=(365*jy)+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+78+jd+((jm<7)?((jm-1)*31):(((jm-7)*30)+186));
  gy+=400*Math.floor(days/146097); days%=146097;
  if(days>36524){ gy+=100*Math.floor(--days/36524); days%=36524; if(days>=365) days++; }
  gy+=4*Math.floor(days/1461); days%=1461;
  if(days>365){ gy+=Math.floor((days-1)/365); days=(days-1)%365; }
  var gd=days+1, sal=[0,31,((gy%4===0&&gy%100!==0)||gy%400===0)?29:28,31,30,31,30,31,31,30,31,30,31], gm=0;
  for(gm=0;gm<13&&gd>sal[gm];gm++) gd-=sal[gm];
  return {y:gy,m:gm,d:gd};
}
function jIsLeap(y){ var a=j2g(y,1,1), b=j2g(y+1,1,1); return (Date.UTC(b.y,b.m-1,b.d)-Date.UTC(a.y,a.m-1,a.d))/86400000===366; }
function jMonthLen(y,m){ if(m<=6) return 31; if(m<=11) return 30; return jIsLeap(y)?30:29; }
function jWeekday(y,m,d){ var g=j2g(y,m,d); return new Date(g.y,g.m-1,g.d).getDay(); }
function pad2(n){ return (n<10?'0':'')+n; }
function jFmt(y,m,d){ return fa(y+'/'+pad2(m)+'/'+pad2(d)); }
function jParse(s){ var t=enDigits(s||'').split('/'); if(t.length!==3) return null; var y=+t[0],m=+t[1],d=+t[2]; if(!y||!(m>=1&&m<=12)||!(d>=1&&d<=31)) return null; return {y:y,m:m,d:d}; }
function jToday(){ var n=new Date(); return g2j(n.getFullYear(),n.getMonth()+1,n.getDate()); }
function dateField(id,label,val){ return '<label class="f" for="'+id+'">'+label+'</label><input id="'+id+'" class="calField" readonly value="'+esc(val||'')+'" placeholder="📅 برای انتخاب تاریخ بزنید" onclick="openCal(\''+id+'\')">'; }
var calTarget=null, calCb=null, calY=1405, calM=1, calSel=null;
function openCal(inputId,cb){
  var inp=document.getElementById(inputId); if(!inp) return;
  calTarget=inputId; calCb=(typeof cb==='function')?cb:(cb?window[cb]:null);
  var cur=jParse(inp.value), base=cur||jToday();
  calY=base.y; calM=base.m; calSel=cur;
  renderCal();
  document.getElementById('calWrap').classList.add('open');
}
function closeCal(){ var w=document.getElementById('calWrap'); if(w) w.classList.remove('open'); calTarget=null; calCb=null; }
function calNav(dm){ calM+=dm; if(calM<1){ calM=12; calY--; } if(calM>12){ calM=1; calY++; } renderCal(); }
function renderCal(){
  var t=jToday(), len=jMonthLen(calY,calM), firstCol=(jWeekday(calY,calM,1)+1)%7, cells='';
  ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'].forEach(function(w){ cells+='<div class="wd">'+w+'</div>'; });
  for(var i=0;i<firstCol;i++) cells+='<div class="calDay empty"></div>';
  for(var d=1;d<=len;d++){
    var cls='calDay';
    if(calY===t.y&&calM===t.m&&d===t.d) cls+=' today';
    if(calSel&&calSel.y===calY&&calSel.m===calM&&calSel.d===d) cls+=' sel';
    cells+='<button class="'+cls+'" onclick="pickCal('+d+')">'+fa(d)+'</button>';
  }
  document.getElementById('calSheet').innerHTML='<div class="sheetwrap"><button class="btn soft small x" onclick="closeCal()">✕</button><h3>📅 انتخاب تاریخ</h3>'
    +'<div class="calNav"><button class="btn soft small" onclick="calNav(-1)">ماه قبل</button><div class="ttl">'+JMONTHS[calM-1]+' '+fa(calY)+'</div><button class="btn soft small" onclick="calNav(1)">ماه بعد</button></div>'
    +'<div class="calGrid">'+cells+'</div>'
    +'<div class="btnrow"><button class="btn soft" onclick="closeCal()">انصراف</button></div></div>';
}
function pickCal(d){
  var inp=document.getElementById(calTarget), cb=calCb;
  if(inp) inp.value=jFmt(calY,calM,d);
  closeCal();
  if(cb) cb();
}

function quizById(id){ var qs=db.quizzes||[]; for(var i=0;i<qs.length;i++) if(qs[i].id===id) return qs[i]; return null; }
function quizzesSorted(){ return (db.quizzes||[]).slice().sort(function(a,b){ var ka=dateKey(a.date),kb=dateKey(b.date); if(ka<kb) return -1; if(ka>kb) return 1; return 0; }); }
function qScoreOf(qid,sid){ var m=(db.qscores||{})[qid]; if(!m) return null; var v=m[sid]; return (v===null||v===undefined||v==='')?null:Number(v); }
function quizScores(qid){ var out=[]; db.students.forEach(function(s){ var v=qScoreOf(qid,s.id); if(v!==null) out.push(v); }); return out; }
function quizAvg(qid){ return avgOf(quizScores(qid)); }
function studentQuizEntries(sid){ var out=[]; quizzesSorted().forEach(function(q){ var v=qScoreOf(q.id,sid); if(v!==null) out.push({quiz:q,score:v}); }); return out; }
function studentQuizAvg(sid){ return avgOf(studentQuizEntries(sid).map(function(x){ return x.score; })); }

function quizGrid(qid){
  var q=quizById(qid); if(!q) return;
  if(!db.students.length){ toast('اول دانش‌آموزان را ثبت کنید',true); return; }

  }).join('');

    +'<div class="scoregrid">'+rows+'</div>'
    +'<div class="btnrow"><button class="btn" onclick="saveQuizScores(\''+qid+'\')">💾 ذخیرهٔ نتایج همه</button><button class="btn soft" onclick="closeDlg()">انصراف</button></div>');
  var sel=gridSel;
  dlgCommit=function(){ writeQuizScores(qid,sel); saveDb(); };
}
function writeQuizScores(qid,sel){
  if(!sel) return;
  if(!db.qscores) db.qscores={};
  var m=db.qscores[qid]||(db.qscores[qid]={});
  db.students.forEach(function(s){ if(sel[s.id]) m[s.id]=sel[s.id]; else delete m[s.id]; });

function saveQuizScores(qid){
  writeQuizScores(qid,gridSel);

/* ===== کارنامهٔ توصیفی (نوبت × درس × سطح) ===== */
var descrepSel=null, descrepCtx=null;
var TERM_KEYS=[{key:'mid1',label:'میان‌ترم اول'},{key:'1',label:'نوبت اول'},{key:'mid2',label:'میان‌ترم دوم'},{key:'2',label:'نوبت دوم'}];
function termLabel(term){for(var i=0;i<TERM_KEYS.length;i++)if(String(TERM_KEYS[i].key)===String(term))return TERM_KEYS[i].label;return 'دوره';}
function descrepOf(term,sid){ var key=String(term); if(key==='midterm1')key='mid1';if(key==='midterm2')key='mid2';var t=(db.descrep||{})[key]||{}; return t[sid]||{}; }
function descrepSummaryHtml(sid){
  var out='';
  TERM_KEYS.forEach(function(item){var term=item.key;
    var rec=descrepOf(term,sid), subs=Object.keys(rec);
    if(!subs.length) return;
    out+='<div class="monthttl">'+termLabel(term)+'</div>'+subs.map(function(sub){ return '<div class="kv"><span>'+esc(sub)+'</span>'+lvlTag(rec[sub])+'</div>'; }).join('');
  });
  return out||'<p class="hint">هنوز سطحی در کارنامهٔ این دانش‌آموز ثبت نشده است.</p>';
}
function descrepForm(sid,term){
  var s=studentById(sid); if(!s) return;
  descrepCtx={sid:sid,term:term};
  var rec=descrepOf(term,sid); descrepSel={}; Object.keys(rec).forEach(function(k){ descrepSel[k]=rec[k]; });
  var subs=SUBJECTS.slice();
  db.exams.forEach(function(e){ if(subs.indexOf(e.subject)<0) subs.push(e.subject); });
  var rows=subs.map(function(sub){
    return '<div class="srow"><span class="sname">'+esc(sub)+'</span><span class="lvlchips">'+LEVEL_LIST.map(function(lv){
      return '<button type="button" class="lvlchip lv'+lv+(descrepSel[sub]===lv?' on':'')+'" data-descrep-for="'+esc(sub)+'" data-lvl="'+lv+'" onclick="descrepChip(this)">'+LEVELS[lv]+'</button>';
    }).join('')+'</span></div>';
  }).join('');
  openDlg(dlgHead('📋 کارنامهٔ توصیفی — '+termLabel(term))
    +'<div class="chips" style="margin:8px 0">'+TERM_KEYS.map(function(t){return '<button type="button" class="chip'+(String(term)===String(t.key)?' on':'')+'" onclick="switchDescrepTerm(\''+sid+'\',\''+t.key+'\')">'+t.label+'</button>';}).join('')+'</div>'
    +'<p class="hint">'+esc(s.name)+' '+esc(s.family)+' · برای هر درس یک سطح بزنید؛ لمس دوباره = پاک شدن. با بستن پنجره هم خودکار ذخیره می‌شود.</p>'
    +'<div class="scoregrid">'+rows+'</div>'
    +'<div class="btnrow"><button class="btn" onclick="saveDescrep()">💾 ذخیرهٔ کارنامه</button><button class="btn soft" onclick="printDescrep()">🖨 چاپ کارنامه</button></div>'
    +'<div class="btnrow"><button class="btn soft" onclick="closeDlg()">بستن</button></div>');
  var ctx=descrepCtx, sel=descrepSel;
  dlgCommit=function(){
    if(!db.descrep) db.descrep={};
    var t=String(ctx.term);
    if(!db.descrep[t]) db.descrep[t]={};
    db.descrep[t][ctx.sid]=Object.assign({},sel||{});
    saveDb();
  };
}
function switchDescrepTerm(sid,term){persistDescrep();saveDb();descrepForm(sid,term);}
function descrepChip(btn){
  var sub=btn.getAttribute('data-descrep-for'), lv=parseInt(btn.getAttribute('data-lvl'),10);
  if(!descrepSel) descrepSel={};
  if(descrepSel[sub]===lv) delete descrepSel[sub]; else descrepSel[sub]=lv;
  btn.parentNode.querySelectorAll('.lvlchip').forEach(function(c){ c.classList.toggle('on', descrepSel[sub]!==undefined&&parseInt(c.getAttribute('data-lvl'),10)===descrepSel[sub]); });
}
function persistDescrep(){
  if(!descrepCtx) return;
  if(!db.descrep) db.descrep={};
  var t=String(descrepCtx.term);
  if(!db.descrep[t]) db.descrep[t]={};
  db.descrep[t][descrepCtx.sid]=Object.assign({},descrepSel||{});
}
function saveDescrep(){ persistDescrep(); saveDb(); closeDlg(); render(); toast('کارنامه ذخیره شد ✅'); }
/* فهرست درس‌های کارنامه: درس‌های اصلی + درس‌های آزمون‌ها + هر درسی که جایی در کارنامهٔ این نوبت آمده */
function descrepSubjects(term){
  var subs=SUBJECTS.slice();
  db.exams.forEach(function(e){ if(subs.indexOf(e.subject)<0) subs.push(e.subject); });
  var t=(db.descrep||{})[String(term)]||{};
  Object.keys(t).forEach(function(sid){ Object.keys(t[sid]||{}).forEach(function(sub){ if(subs.indexOf(sub)<0) subs.push(sub); }); });
  return subs;
}
/* بدنهٔ چاپی کارنامهٔ یک دانش‌آموز — منبع واحد برای چاپ تکی و چاپ گروهی.
   allSubs که باشد (چاپ گروهی) همهٔ درس‌ها می‌آیند و درسِ بدون سطح «—» می‌خورد؛ وگرنه فقط درس‌های ثبت‌شده. */
function descrepDocInner(s,term,allSubs){
  var rec=descrepOf(term,s.id);
  var inner='<table><tr><th>دانش‌آموز</th><td>'+esc(s.name)+' '+esc(s.family)+'</td><th>نام پدر</th><td>'+esc(s.father||'—')+'</td></tr>'
    +'<tr><th>کد دانش‌آموزی</th><td>'+esc(s.code||'—')+'</td><th>کلاس</th><td>۶/۴</td></tr></table>'
    +'<h3 style="margin:14px 0 6px;font-size:14px">کارنامهٔ توصیفی — '+termLabel(term)+'</h3>';
  if(allSubs){
    inner+='<table><tr><th>درس</th><th>سطح</th></tr>'+allSubs.map(function(sub){ return '<tr><td>'+esc(sub)+'</td><td>'+lvlLabel(rec[sub])+'</td></tr>'; }).join('')+'</table>';
  }else{
    var subs=Object.keys(rec);
    inner+=(subs.length?'<table><tr><th>درس</th><th>سطح</th></tr>'+subs.map(function(sub){ return '<tr><td>'+esc(sub)+'</td><td>'+lvlLabel(rec[sub])+'</td></tr>'; }).join('')+'</table>':'<p>هنوز سطحی ثبت نشده است.</p>');
  }
  inner+='<div class="pfoot" style="margin-top:20px">آموزگار کلاس: مریم خانمحمدی · دبستان دخترانه حافظ</div>';
  return inner;
}
function printDescrep(){
  if(!descrepCtx) return;
  persistDescrep(); saveDb();
  var s=studentById(descrepCtx.sid); if(!s) return;
  printDoc('کارنامهٔ توصیفی — '+s.name+' '+s.family, descrepDocInner(s, descrepCtx.term, null));
}

/* ===== ورود گروهی کارنامهٔ توصیفی: همهٔ کلاس، درس‌به‌درس =====
   انتخاب‌های هر درس در حافظه (dscGrpStage) می‌ماند؛ عوض‌کردن درس/نوبت چیزی را پاک نمی‌کند،
   «ذخیره» همه را یکجا در db.descrep می‌نویسد و بستن پنجره هم خودکار ذخیره می‌کند (dlgCommit). */
var dscGrpCtx=null, dscGrpStage=null;
function dscGrpStageFor(term,sub){
  var k=term+'|'+sub;
  if(!dscGrpStage[k]){
    var st={};
    db.students.forEach(function(s){ var v=descrepOf(term,s.id)[sub]; if(v!==null&&v!==undefined&&v!=='') st[s.id]=Number(v); });
    dscGrpStage[k]=st;
  }
  return dscGrpStage[k];
}
function writeDescrepGroupStage(){
  if(!dscGrpStage) return;
  if(!db.descrep) db.descrep={};
  Object.keys(dscGrpStage).forEach(function(k){
    var i=k.indexOf('|'), t=k.slice(0,i), sub=k.slice(i+1), st=dscGrpStage[k];
    if(!db.descrep[t]) db.descrep[t]={};
    db.students.forEach(function(s){
      var rec=db.descrep[t][s.id]||(db.descrep[t][s.id]={});
      if(st[s.id]) rec[sub]=st[s.id]; else delete rec[sub];
    });
  });
}
function descrepGroupForm(term){
  if(!db.students.length){ toast('اول دانش‌آموزان را ثبت کنید',true); return; }
  dscGrpStage={};
  var t=TERM_KEYS.some(function(x){return String(x.key)===String(term);})?String(term):'1', subs=descrepSubjects(t);
  dscGrpCtx={term:t, subject:subs[0]};
  descrepGroupShow();
}
function descrepGroupShow(){
  var term=dscGrpCtx.term, subs=descrepSubjects(term);
  if(subs.indexOf(dscGrpCtx.subject)<0) dscGrpCtx.subject=subs[0];
  var sub=dscGrpCtx.subject, st=dscGrpStageFor(term,sub);
  var rows=db.students.map(function(s){
    return '<div class="srow"><span class="avatar" style="width:32px;height:32px;font-size:13px">'+avatarHtml(s)+'</span><span class="sname">'+esc(s.name)+' '+esc(s.family)+'</span><span class="lvlchips">'+LEVEL_LIST.map(function(lv){
      return '<button type="button" class="lvlchip lv'+lv+(st[s.id]===lv?' on':'')+'" data-dscgrp-for="'+s.id+'" data-lvl="'+lv+'" onclick="dscGrpChip(this)">'+LEVELS[lv]+'</button>';
    }).join('')+'</span></div>';
  }).join('');
  openDlg(dlgHead('📋 ورود گروهی کارنامه — '+termLabel(term))
    +'<div class="kv"><span>دوره</span><span class="chips">'+TERM_KEYS.map(function(t){return '<button type="button" class="chip'+(String(term)===String(t.key)?' on':'')+'" onclick="dscGrpTerm(\''+t.key+'\')">'+t.label+'</button>';}).join('')+'</span></div>'
    +'<label class="f" for="dscGrpSubject">درس</label><select id="dscGrpSubject" onchange="dscGrpSubject(this.value)">'+subs.map(function(x){ return '<option value="'+esc(x)+'"'+(x===sub?' selected':'')+'>'+esc(x)+'</option>'; }).join('')+'</select>'
    +'<p class="hint">برای هر دانش‌آموز یک سطح بزنید؛ لمس دوباره = پاک شدن. عوض‌کردن درس یا نوبت، انتخاب‌ها را نگه می‌دارد و با بستن پنجره هم خودکار ذخیره می‌شود.</p>'
    +'<p class="hint" id="dscGrpProg">ثبت‌شده: '+fa(Object.keys(st).length)+' از '+fa(db.students.length)+'</p>'
    +'<div class="scoregrid">'+rows+'</div>'
    +'<div class="btnrow"><button class="btn" onclick="saveDescrepGroup()">💾 ذخیرهٔ کارنامه</button><button class="btn soft" onclick="closeDlg()">بستن</button></div>');
  dlgCommit=function(){ writeDescrepGroupStage(); saveDb(); };
}
function dscGrpTerm(t){
  if(!dscGrpCtx) return;
  dscGrpCtx.term=t;
  var subs=descrepSubjects(t);
  if(subs.indexOf(dscGrpCtx.subject)<0) dscGrpCtx.subject=subs[0];
  descrepGroupShow();
}
function dscGrpSubject(v){ if(!dscGrpCtx) return; dscGrpCtx.subject=v; descrepGroupShow(); }
function dscGrpChip(btn){
  var sid=btn.getAttribute('data-dscgrp-for'), lv=parseInt(btn.getAttribute('data-lvl'),10);
  var st=dscGrpStageFor(dscGrpCtx.term,dscGrpCtx.subject);
  if(st[sid]===lv) delete st[sid]; else st[sid]=lv;
  btn.parentNode.querySelectorAll('.lvlchip').forEach(function(c){ c.classList.toggle('on', st[sid]!==undefined&&parseInt(c.getAttribute('data-lvl'),10)===st[sid]); });
  var p=document.getElementById('dscGrpProg');
  if(p) p.textContent='ثبت‌شده: '+fa(Object.keys(st).length)+' از '+fa(db.students.length);
}
function saveDescrepGroup(){
  writeDescrepGroupStage();
  dscGrpStage=null; dscGrpCtx=null;
  saveDb(); closeDlg(); render(); toast('کارنامهٔ گروهی ذخیره شد ✅');
}

/* ===== 📊 عملکرد (گزارش ماهانهٔ عملکرد دانش‌آموز) =====
   برگ عملکرد هر دانش‌آموز، به این ترتیب: مشخصات ← غیبت و حضور ← پرسش‌ها و میانگین ← فعالیت‌ها ← کارنامه.
   ماه، نوبت، تیک بخش‌ها، نوع فعالیت و چیدمان از بخش «عملکرد» صفحهٔ آزمون‌ها می‌آید و در dk_perf_cfg می‌ماند.
   همان برگ در پنجره، چاپ تکی، چاپ گروهی و کارت PNG فایل ZIP استفاده می‌شود. */
var PERF_MONTHS=[{m:7,n:'مهر'},{m:8,n:'آبان'},{m:9,n:'آذر'},{m:10,n:'دی'},{m:11,n:'بهمن'},{m:12,n:'اسفند'},{m:1,n:'فروردین'},{m:2,n:'اردیبهشت'},{m:3,n:'خرداد'}];
function monthName(m){ for(var i=0;i<PERF_MONTHS.length;i++) if(PERF_MONTHS[i].m===m) return PERF_MONTHS[i].n; return ''; }
function jMonthOf(dateStr){ if(!dateStr) return 0; var p=enDigits(String(dateStr)).split('/'); return p.length>=2?(parseInt(p[1],10)||0):0; }
/* بازهٔ عملکرد = اجتماع ماه‌های تیک‌خورده؛ ماهِ ورودی باید در فهرست تیک‌ها باشد */
function inMonths(dateStr,months){ return (months||[]).indexOf(jMonthOf(dateStr))>=0; }
function curJMonth(){ try{ var p=enDigits(new Date().toLocaleDateString('fa-IR')).split('/'); var m=parseInt(p[1],10); if(m>=1&&m<=12) return m; }catch(e){} return 7; }
function perfPeriodLabel(cfg){
  var ms=PERF_MONTHS.filter(function(x){ return (cfg.months||[]).indexOf(x.m)>=0; });
  if(!ms.length) return 'عملکرد: (ماهی انتخاب نشده)';
  if(ms.length===PERF_MONTHS.length) return 'عملکرد کل سال تحصیلی ۱۴۰۵';
  if(ms.length===1) return 'عملکرد ماه '+ms[0].n+' ۱۴۰۵';
  var names=ms.map(function(x){ return x.n; });
  return 'عملکرد: '+names.slice(0,-1).join('، ')+' و '+names[names.length-1]+' ۱۴۰۵';
}
function perfTag(cfg){
  var ms=PERF_MONTHS.filter(function(x){ return (cfg.months||[]).indexOf(x.m)>=0; });
  if(!ms.length) return ' (بدون ماه)';
  if(ms.length===PERF_MONTHS.length) return '';
  return ' ('+ms.map(function(x){ return x.n; }).join('، ')+')';
}
/* کارنامه فقط نوبت‌ها صادر می‌شود، نه ماهانه — پس تیکش پیش‌فرض خاموش است و معلم موقع نوبت روشنش می‌کند. */
function defaultPerfCfg(){ return {term:'1', months:[curJMonth()], layout:'full', actKind:'all', blocks:{id:1,att:1,quiz:1,act:1,beh:1,kar:0}}; }
/* چیدمان فشردهٔ «نصف گزارش + نصف کارنامه در یک صفحه» فقط وقتی معنا دارد که کارنامه روشن باشد؛
   کارنامه که خاموش است، برگ عملکرد همهٔ صفحه را برای بخش‌های گزارش می‌گیرد. */
function perfCompact(cfg){ return cfg.layout==='compact'&&!!cfg.blocks.kar; }
function perfCfg(){
  var d=defaultPerfCfg();
  try{
    var c=JSON.parse(localStorage.getItem('dk_perf_cfg')||'null');

    var rec=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(c.crc),u32(c.size),u32(c.size),u16(c.nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.offset));

async function downloadPerfZip(){
  var list=perfBatchStudents();
  if(!list.length){ toast(perfPickOn?'دانش‌آموزی انتخاب نشده است':'هنوز دانش‌آموزی ثبت نشده است',true); return; }
  var cfg=perfCfg();
  toast('در حال ساخت عکس عملکردها…');
  try{
    var files=[], used={};
    for(var i=0;i<list.length;i++){
      var s=list[i];
      var b=await perfPngBlob(s,cfg);
      if(!b) throw new Error('png');
      var buf=new Uint8Array(await b.arrayBuffer());
      var nm=perfFileName(s);
      if(used[nm]){ var k=2; while(used[nm.replace('.png','-'+k+'.png')]) k++; nm=nm.replace('.png','-'+k+'.png'); }
      used[nm]=1;
      files.push({name:nm, data:buf});
    }
    var blob=zipStore(files);
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='amalkard-nobat'+cfg.term+'.zip'; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },400);
    toast('فایل ZIP عملکردها دانلود شد 🗂');
  }catch(e){ toast('ساخت فایل ZIP انجام نشد',true); }
}

function wrapCanvasLines(g,text,maxW,maxLines){
  var words=String(text||'').split(/\s+/).filter(Boolean), lines=[], cur='', wi=0;
  while(wi<words.length&&lines.length<maxLines){
    var t=cur?cur+' '+words[wi]:words[wi];
    if(g.measureText(t).width>maxW&&cur){ lines.push(cur); cur=''; }
    else{ cur=t; wi++; }
  }
  if(cur&&lines.length<maxLines) lines.push(cur);
  if(wi<words.length&&lines.length) lines[lines.length-1]+='…';
  return lines;
}

function b64enc(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64dec(b64){ return decodeURIComponent(escape(atob(String(b64).replace(/\s/g,'')))); }
function ghHeaders(cfg){ return { 'Authorization':'Bearer '+cfg.token, 'Accept':'application/vnd.github+json' }; }
async function ghGetFile(cfg){

}
function parseState(j){

  return data;
}

/* نقطهٔ وضعیت همگام‌سازی در سربرگ + بنر غیرمسدودکنندهٔ تعارض */

function showSyncBanner(txt){ var b=document.getElementById('syncBanner'), t=document.getElementById('syncBannerTxt'); if(!b||!t) return; t.textContent=txt; b.classList.add('show'); }

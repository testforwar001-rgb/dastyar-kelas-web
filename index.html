async function syncPull(silent){ if(syncBusy) return false; syncBusy=true; try{ return await syncPullCore(silent); } finally{ syncBusy=false; } }
async function syncPullCore(silent){
  var cfg=(curTab==='settings')?readCfgFromForm():syncCfg();
  if(!cfg.token){ if(!silent){ syncMsg('اول توکن گیت‌هاب را وارد و ذخیره کنید.',false); toast('توکن وارد نشده است',true);} return false; }
  if(syncDirty){var warn='این دستگاه تغییرات ذخیره‌نشده دارد. برای جلوگیری از پاک‌شدن اطلاعات، دریافت از گیت‌هاب متوقف شد؛ ابتدا ذخیره خودکار را بررسی کنید یا از بخش پشتیبان‌گیری خروجی JSON بگیرید.';if(!silent){syncMsg(warn,false);toast('تغییرات محلی حفظ شدند؛ دریافت متوقف شد.',true);}else showSyncBanner(warn);updateSyncDot();return false;}
  try{
    var j=await ghGetFile(cfg);
    if(!j){ if(!silent) syncMsg('هنوز فایلی روی گیت‌هاب نیست؛ ابتدا «ذخیره در گیت‌هاب» را بزنید.',false); return false; }
    var data=parseState(j);
    var nd=data.db; normalizeDb(nd); if(lvNeedsMig(nd)) migrateLevels(nd); nd._rev=data.rev||0;
    db=nd; saveDb(); markSynced();
    if(curTab==='settings'){ render(); syncMsg('اطلاعات از گیت‌هاب دریافت و جایگزین شد ✅ (نسخهٔ '+fa(db._rev)+')',true); }
    else { render(); toast('همگام‌سازی انجام شد ✅'); }
    return true;
  }catch(e){
    if(!silent){ syncMsg('دریافت از گیت‌هاب انجام نشد: '+e.message+' — اطلاعات این دستگاه دست نخورده ماند.',false); toast('خطا در همگام‌سازی',true); }
    return false;
  }
}
async function syncPush(){ if(syncBusy) return false; syncBusy=true; try{ return await syncPushCore(); } finally{ syncBusy=false; } }
async function syncPushCore(){
  var cfg=readCfgFromForm();
  if(!cfg.token){ syncMsg('اول توکن گیت‌هاب را وارد و ذخیره کنید.',false); toast('توکن وارد نشده است',true); return false; }
  try{
    var j=await ghGetFile(cfg);
    var sha=null;
    if(j){
      var server=parseState(j);
      if((server.rev||0)!==(db._rev||0)){
        syncMsg('⚠️ نسخهٔ روی گیت‌هاب جدیدتر است (نسخهٔ '+fa(server.rev||0)+' در برابر نسخهٔ این دستگاه '+fa(db._rev||0)+'). برای جلوگیری از پاک شدن اطلاعات، اول «دریافت از گیت‌هاب» را بزنید؛ هیچ چیزی بازنویسی نشد.',false);
        toast('تعارض نسخه — اول دریافت کنید',true); return false;
      }
      sha=j.sha;
    }
    var newRev=(db._rev||0)+1;
    var payload={db:dbPayload(),rev:newRev,updatedAt:new Date().toISOString()};
    var body={message:'dastyar-kelas sync rev '+newRev,content:b64enc(JSON.stringify(payload))};
    if(sha) body.sha=sha;
    var r=await fetch(cfg.url,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders(cfg)),body:JSON.stringify(body)});
    if(r.status===409||r.status===422){ syncMsg('⚠️ گیت‌هاب از ذخیره جلوگیری کرد (تعارض نسخه). اول «دریافت از گیت‌هاب» را بزنید؛ هیچ چیزی بازنویسی نشد.',false); toast('تعارض نسخه',true); return false; }
    if(!r.ok) throw new Error('پاسخ گیت‌هاب: '+r.status);
    db._rev=newRev; saveDb(); markSynced(); render();
    syncMsg('اطلاعات در گیت‌هاب ذخیره شد ✅ (نسخهٔ '+fa(newRev)+')',true); toast('در گیت‌هاب ذخیره شد ✅');
    return true;
  }catch(e){
    syncMsg('ذخیره در گیت‌هاب انجام نشد: '+e.message+' — اطلاعات این دستگاه سر جایش است.',false); toast('خطا در همگام‌سازی',true);
    return false;
  }
}
/* ===== همگام‌سازی خودکار (همان منطق fail-closed دستی؛ بدون بازنویسی در تعارض) ===== */
async function autoPush(){
  if(syncBusy) return;
  var cfg=syncCfg();
  if(!cfg.token||!cfg.url||!syncDirty){ updateSyncDot(); return; }
  if(navigator.onLine===false){ updateSyncDot(); return; }
  syncBusy=true;
  try{
    var j=await ghGetFile(cfg);
    var sha=null;
    if(j){
      var server=parseState(j);
      if((server.rev||0)!==(db._rev||0)){
        syncConflict=true; updateSyncDot();
        showSyncBanner('⚠️ نسخهٔ روی گیت‌هاب جدیدتر است (نسخهٔ '+fa(server.rev||0)+' در برابر نسخهٔ این دستگاه '+fa(db._rev||0)+'). برای جلوگیری از پاک شدن اطلاعات، اول از بخش تنظیمات «دریافت از گیت‌هاب» را بزنید؛ هیچ چیزی بازنویسی نشد.');
        return;
      }
      sha=j.sha;
    }
    var newRev=(db._rev||0)+1;
    var payload={db:dbPayload(),rev:newRev,updatedAt:new Date().toISOString()};
    var body={message:'dastyar-kelas sync rev '+newRev,content:b64enc(JSON.stringify(payload))};
    if(sha) body.sha=sha;
    var r=await fetch(cfg.url,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders(cfg)),body:JSON.stringify(body)});
    if(r.status===409||r.status===422){
      syncConflict=true; updateSyncDot();
      showSyncBanner('⚠️ گیت‌هاب از ذخیرهٔ خودکار جلوگیری کرد (تعارض نسخه). اول از بخش تنظیمات «دریافت از گیت‌هاب» را بزنید؛ هیچ چیزی بازنویسی نشد.');
      return;
    }
    if(!r.ok) throw new Error('پاسخ گیت‌هاب: '+r.status);
    db._rev=newRev; saveDb(); markSynced(); hideSyncBanner();
  }catch(e){
    /* آفلاین یا خطای شبکه: پرچم کثیف می‌ماند و در فرصت بعدی دوباره تلاش می‌شود */
    updateSyncDot();
  }finally{ syncBusy=false; }
}
function maybeAutoSync(){
  var cfg=syncCfg();
  if(!cfg.token||!cfg.url||!syncDirty){ updateSyncDot(); return; }
  autoPush();
}

function printAfterPreflight(){
  var pa=document.getElementById('printArea'), pages=pa?pa.querySelectorAll('.print-page,.perf-page'):[];
  if(!pages.length){window.print();return;}
  var body=document.body,maxH=272*96/25.4,cleaned=false;
  function cleanup(){if(cleaned)return;cleaned=true;body.classList.remove('print-measure');}
  body.classList.add('print-measure');
  function waitImages(){
    var imgs=Array.prototype.slice.call(pa.querySelectorAll('img'));
    return Promise.all(imgs.map(function(im){if(im.complete)return Promise.resolve();return new Promise(function(resolve){var done=function(){resolve();};im.addEventListener('load',done,{once:true});im.addEventListener('error',done,{once:true});setTimeout(done,2500);});}));
  }
  Promise.resolve(document.fonts&&document.fonts.ready?document.fonts.ready:null).then(waitImages).then(function(){
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      var tooTall=[];
      Array.prototype.forEach.call(pages,function(p,i){var h=Math.max(p.getBoundingClientRect().height,p.scrollHeight);if(h>maxH+3)tooTall.push(i+1);});
      cleanup();
      if(tooTall.length){alert('چاپ متوقف شد تا هیچ بخشی حذف یا بریده نشود. صفحه(های) '+tooTall.join('، ')+' با اطلاعات فعلی در یک برگ A4 و اندازهٔ خوانا جا نمی‌شوند. لطفاً محتوای طولانی یا بخش‌های غیرضروری را کوتاه/محدود کنید و دوباره چاپ بگیرید.');return;}
      window.print();
    });});
  }).catch(function(){cleanup();alert('آماده‌سازی چاپ کامل نشد. لطفاً دوباره تلاش کنید.');});
}

/* ===== فرمان صوتی (Web Speech API — fa-IR) =====
   ایمنی: هیچ فرمانی مستقیم نوشته نمی‌شود؛ اول کارت تأیید نشان داده می‌شود و فقط با «تأیید» ذخیره می‌شود. */
var NUMWORDS={'صفر':0,'یک':1,'دو':2,'سه':3,'چهار':4,'پنج':5,'شش':6,'هفت':7,'هشت':8,'نه':9,'ده':10,'یازده':11,'دوازده':12,'سیزده':13,'چهارده':14,'پانزده':15,'شانزده':16,'هفده':17,'هجده':18,'نوزده':19,'بیست':20};
function normFa(s){ return enDigits(String(s||'')).replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/ة/g,'ه').replace(/أ/g,'ا').replace(/إ/g,'ا').replace(/‌/g,' ').replace(/ـ/g,'').replace(/٫/g,'.').replace(/\s+/g,' ').trim(); }
function findVoiceNumber(t){
  var toks=t.split(' ');
  for(var i=0;i<toks.length;i++){
    var tk=toks[i].replace(/[«»"“”'،؛:؟?!.,]/g,'').replace(/[ٰٔ]/g,'');
    if(!tk) continue;
    if(/^[0-9]+(\.[0-9]+)?$/.test(tk)){ var v=parseFloat(tk); if(v>=0&&v<=20) return {value:v}; }
    if(tk==='نیم'||tk==='نیمه') return {value:0.5};
    if(Object.prototype.hasOwnProperty.call(NUMWORDS,tk)){
      var val=NUMWORDS[tk];
      var nx=(toks[i+1]||'').replace(/[«»"“”'،؛:؟?!.,]/g,''), nx2=(toks[i+2]||'').replace(/[«»"“”'،؛:؟?!.,]/g,'');
      if(nx==='و'&&(nx2==='نیم'||nx2==='نیمه')) val+=0.5;
      if(val>=0&&val<=20) return {value:val};
    }
  }
  return null;
}
function matchStudents(t){
  var scored=[];
  db.students.forEach(function(s){
    var full=normFa(s.name+' '+s.family), nm=normFa(s.name), fm=normFa(s.family), m=0;
    if(full&&t.indexOf(full)>=0) m=full.length+100;
    else if(fm&&fm.length>1&&t.indexOf(fm)>=0) m=fm.length+50;
    else if(nm&&nm.length>1&&t.indexOf(nm)>=0) m=nm.length;
    if(m>0) scored.push({s:s,m:m});
  });
  if(!scored.length) return [];
  scored.sort(function(a,b){ return b.m-a.m; });
  var top=scored[0].m;
  return scored.filter(function(x){ return x.m===top; }).map(function(x){ return x.s; });
}
function matchExam(t){
  var best=null, bm=0;
  db.exams.forEach(function(e){ var tt=normFa(e.title); if(tt&&t.indexOf(tt)>=0&&tt.length>bm){ best=e; bm=tt.length; } });
  if(best) return best;
  var byId={};
  db.exams.forEach(function(e){ var sb=normFa(e.subject); if(sb&&t.indexOf(sb)>=0) byId[e.id]=e; });
  var arr=Object.keys(byId).map(function(k){ return byId[k]; });
  if(arr.length===1) return arr[0];
  if(arr.length>1){ var sorted=examsSorted().filter(function(e){ return byId[e.id]; }); return sorted[sorted.length-1]; }
  return null;
}
function todayJalali(){
  try{
    var parts=new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()), y='',m='',d='';
    parts.forEach(function(p){ if(p.type==='year') y=p.value; else if(p.type==='month') m=p.value; else if(p.type==='day') d=p.value; });
    function pad(x){ x=enDigits(x); return x.length<2?('0'+x):x; }
    return fa(enDigits(y)+'/'+pad(m)+'/'+pad(d));
  }catch(e){ try{ return new Date().toLocaleDateString('fa-IR'); }catch(e2){ return ''; } }
}
function faFold(s){ return String(s||'').replace(/آ/g,'ا'); }
function matchSubject(t){
  var found=[];
  SUBJECTS.forEach(function(s){ var ns=normFa(s); if(ns&&t.indexOf(ns)>=0) found.push(s); });
  if(found.length===1) return found[0];
  if(found.length>1){
    found.sort(function(a,b){ return normFa(b).length-normFa(a).length; });
    if(normFa(found[0]).length>normFa(found[1]).length) return found[0];
  }
  return null;
}
function matchQuiz(t){
  var tf=faFold(t), best=null, bm=0;
  (db.quizzes||[]).forEach(function(q){ var tt=faFold(normFa(q.title)); if(tt&&tf.indexOf(tt)>=0&&tt.length>bm){ best=q; bm=tt.length; } });
  if(best) return best;
  var byId={};
  (db.quizzes||[]).forEach(function(q){ var sb=faFold(normFa(q.subject)); if(sb&&tf.indexOf(sb)>=0) byId[q.id]=q; });
  var arr=Object.keys(byId).map(function(k){ return byId[k]; });
  if(arr.length===1) return arr[0];
  if(arr.length>1){ var sorted=quizzesSorted().filter(function(q){ return byId[q.id]; }); return sorted[sorted.length-1]; }
  return null;
}
function findVoiceLevel(t){
  if(t.indexOf('خیلی خوب')>=0) return 4;
  if(t.indexOf('نیاز به تلاش')>=0||t.indexOf('نیازمند تلاش')>=0||t.indexOf('نیازبه تلاش')>=0) return 1;
  if(t.indexOf('قابل قبول')>=0) return 2;
  if(t.indexOf('خوب')>=0) return 3;
  return null;
}
function voiceNumToLevel(v){
  if(v===null||v===undefined||isNaN(v)) return null;
  if(v>=1&&v<=4&&Math.floor(v)===v) return v;
  return numToLevel(v);
}
function parseVoice(raw){
  var heard=String(raw||'').trim();
  var t=normFa(heard);
  if(!t) return {ok:false,reason:'empty',heard:heard};
  var hasScoreWord=t.indexOf('نمره')>=0;
  function hasAny(list){ for(var i=0;i<list.length;i++) if(t.indexOf(list[i])>=0) return true; return false; }
  var isAbsent=hasAny(['غایب','غیبت','نیومده','نیامده','امروز نیست','نیست امروز']);
  var isLate=!isAbsent&&hasAny(['تاخیر','دیر اومده','دیراومده','دیر آمده','دیر کرده']);
  var isPresent=!isAbsent&&!isLate&&t.indexOf('حاضر')>=0;
  var isQuiz=t.indexOf('ازمونک')>=0||t.indexOf('آزمونک')>=0;
  var isDash=t.indexOf('داشبورد')>=0||t.indexOf('نشون')>=0||t.indexOf('نشان')>=0||t.indexOf('کارتابل')>=0||t.indexOf('وضعیت')>=0;
  /* همهٔ کلاس حاضرند */
  if(!hasScoreWord&&(t.indexOf('همه حاضر')>=0||t.indexOf('همه اومدن')>=0||t.indexOf('همه آمدن')>=0||t.indexOf('همه هستند')>=0)){
    return {ok:true,heard:heard,action:{type:'attall'}};
  }
  if((isAbsent||isLate||isPresent)&&!hasScoreWord){
    var ms=matchStudents(t), mark=isAbsent?'a':(isLate?'l':'p');
    if(!ms.length) return {ok:false,reason:'nostudent',heard:heard};
    if(ms.length>1) return {ok:false,reason:'ambstudent',heard:heard,candidates:ms,pending:{type:'att',mark:mark}};
    return {ok:true,heard:heard,action:{type:'att',studentId:ms[0].id,mark:mark}};
  }
  if(isDash&&!hasScoreWord){
    var md=matchStudents(t);
    if(!md.length) return {ok:false,reason:'nostudent',heard:heard};
    if(md.length>1) return {ok:false,reason:'ambstudent',heard:heard,candidates:md,pending:{type:'dash'}};
    return {ok:true,heard:heard,action:{type:'dash',studentId:md[0].id}};
  }
  if(isQuiz&&!matchStudents(t).length&&!findVoiceNumber(t)){
    /* «آزمونک ریاضی» — ساخت آزمونک تازه برای امروز */
    var subjV=matchSubject(t);
    if(!subjV) return {ok:false,reason:'nosubject',heard:heard};
    return {ok:true,heard:heard,action:{type:'newquiz',subject:subjV}};
  }
  if(isQuiz&&(hasScoreWord||findVoiceNumber(t)||findVoiceLevel(t)!==null)){
    if(!(db.quizzes||[]).length) return {ok:false,reason:'noquiz',heard:heard};
    var mq=matchStudents(t);
    if(!mq.length) return {ok:false,reason:'nostudent',heard:heard};
    var qz=matchQuiz(t);
    if(!qz){ var qsl=quizzesSorted(); qz=qsl.length?qsl[qsl.length-1]:null; }
    if(!qz) return {ok:false,reason:'noquiz',heard:heard};
    var tq=t.split('ازمونک').join(' ').split('آزمونک').join(' ')
      .split(normFa(qz.title)).join(' ').split(faFold(normFa(qz.title))).join(' ')
      .split(normFa(mq[0].name+' '+mq[0].family)).join(' ').split(normFa(mq[0].family)).join(' ').split(normFa(mq[0].name)).join(' ');
    var lvq=findVoiceLevel(tq);
    if(lvq===null){ var nq=findVoiceNumber(tq); if(!nq) return {ok:false,reason:'nonum',heard:heard}; lvq=voiceNumToLevel(nq.value); }
    if(mq.length>1) return {ok:false,reason:'ambstudent',heard:heard,candidates:mq,pending:{type:'qscore',quizId:qz.id,value:lvq}};
    return {ok:true,heard:heard,action:{type:'qscore',studentId:mq[0].id,quizId:qz.id,value:lvq}};
  }
  if(hasScoreWord||findVoiceNumber(t)||findVoiceLevel(t)!==null){
    var mn=matchStudents(t);
    if(!mn.length) return {ok:false,reason:'nostudent',heard:heard};
    var ex=matchExam(t);
    if(!ex){ var es=examsSorted(); ex=es.length?es[es.length-1]:null; }
    if(!ex) return {ok:false,reason:'noexam',heard:heard};
    /* عددِ داخل عنوان آزمون یا نام دانش‌آموز، نمره نیست؛ اول آن‌ها را از متن حذف کن، بعد عدد را بجوی */
    var t2=t.split(normFa(ex.title)).join(' ');
    t2=t2.split(normFa(mn[0].name+' '+mn[0].family)).join(' ').split(normFa(mn[0].family)).join(' ').split(normFa(mn[0].name)).join(' ');
    var lv=findVoiceLevel(t2);
    if(lv===null){ var num=findVoiceNumber(t2); if(!num) return {ok:false,reason:'nonum',heard:heard}; lv=voiceNumToLevel(num.value); }
    if(mn.length>1) return {ok:false,reason:'ambstudent',heard:heard,candidates:mn,pending:{type:'score',examId:ex.id,value:lv}};
    return {ok:true,heard:heard,action:{type:'score',studentId:mn[0].id,examId:ex.id,value:lv}};
  }
  return {ok:false,reason:'unknown',heard:heard};
}
var voicePending=null, voiceAmbPending=null, voiceExList=[], voiceSubjList=[];
function voicePickSubjectIdx(i){
  var s=voiceSubjList[i]; if(!s) return;
  var a={type:'newquiz',subject:s};
  voicePending=a;
  showVoiceConfirm({heard:'',action:a});
}
function voiceGuideHtml(){
  return '<div class="guide" style="margin-top:10px"><b>🎤 چی می‌تونم بگم؟</b><br>'
    +'• «نمرهٔ سارا محمدی ریاضی خیلی خوب»<br>'
    +'• «نمرهٔ آزمونک سارا محمدی خوب»<br>'
    +'• «آزمونک ریاضی» (ساخت آزمونک تازه)<br>'
    +'• «فاطمه رضایی غایبه» یا «سارا دیر اومده»<br>'
    +'• «همه حاضرن»<br>'
    +'• «کارتابل سارا محمدی» یا «وضعیت سارا»</div>';
}
function voiceExamples(){
  var s=db.students[0];
  if(!s) return ['نمرهٔ سارا محمدی ریاضی خیلی خوب','فاطمه رضایی غایبه','کارتابل سارا محمدی'];

function voiceExampleIdx(i){ var t=voiceExList[i]; if(t) handleVoiceText(t); }
function handleVoiceText(text){
  var r=parseVoice(text);
  if(r.ok){ voicePending=r.action; voiceAmbPending=null; showVoiceConfirm(r); return r; }
  voicePending=null;
  if(r.reason==='ambstudent'&&r.candidates&&r.candidates.length){
    voiceAmbPending=r.pending;
    openDlg(dlgHead('🎤 فرمان صوتی')
      +'<p class="hint">گفتید: «'+esc(r.heard)+'»</p><p>کدام دانش‌آموز منظورتان بود؟</p>'
      +r.candidates.map(function(s){ return '<button class="btn soft block" style="margin:0 0 8px" onclick="voicePickStudent(\''+s.id+'\')">'+esc(s.name)+' '+esc(s.family)+'</button>'; }).join('')
      +voiceGuideHtml()
      +readyCmdsHtml()
      +'<div class="btnrow"><button class="btn soft" onclick="cancelVoice()">لغو</button></div>');
    return r;
  }
  if(r.reason==='nosubject'){
    voiceSubjList=SUBJECTS.slice();
    openDlg(dlgHead('🎤 آزمونک جدید')
      +'<p class="hint">گفتید: «'+esc(r.heard||'')+'»</p><p>درس آزمونک را پیدا نکردم — کدام درس؟</p>'
      +'<div class="chips">'+voiceSubjList.map(function(x,i){ return '<button class="chip" onclick="voicePickSubjectIdx('+i+')">'+esc(x)+'</button>'; }).join('')+'</div>'
      +voiceGuideHtml()
      +'<div class="btnrow"><button class="btn soft" onclick="cancelVoice()">لغو</button></div>');
    return r;
  }
  voiceExList=voiceExamples();
  openDlg(dlgHead('🎤 فرمان صوتی')
    +'<p>گفتید: «'+esc(r.heard||'')+'»</p>'
    +'<p class="hint">متوجه نشدم 🤔 — یکی از این نمونه‌ها را بزنید تا همان اجرا شود، یا دوباره بگویید:</p>'
    +'<div class="chips">'+voiceExList.map(function(x,i){ return '<button class="chip" onclick="voiceExampleIdx('+i+')">'+esc(x)+'</button>'; }).join('')+'</div>'
    +voiceGuideHtml()
    +readyCmdsHtml()
    +'<div class="btnrow"><button class="btn" onclick="closeDlg();startVoice()">🎤 دوباره تلاش کن</button><button class="btn soft" onclick="closeDlg()">بستن</button></div>');
  return r;
}
function voicePickStudent(id){
  if(!voiceAmbPending) return;
  var a={}; Object.keys(voiceAmbPending).forEach(function(k){ a[k]=voiceAmbPending[k]; }); a.studentId=id;
  voiceAmbPending=null; voicePending=a;
  showVoiceConfirm({heard:'',action:a});
}
function showVoiceConfirm(r){
  var a=r.action, s=a.studentId?studentById(a.studentId):null;
  if(a.type!=='attall'&&a.type!=='newquiz'&&!s){ toast('دانش‌آموز پیدا نشد',true); return; }

  if(a.type==='newquiz'){
    lines='<div class="kv"><span>کار</span><b>ساخت آزمونک جدید</b></div>'
      +'<div class="kv"><span>درس</span><b>'+esc(a.subject)+'</b></div>'
      +'<div class="kv"><span>عنوان</span><b>'+esc('آزمونک '+a.subject)+'</b></div>'
      +'<div class="kv"><span>تاریخ</span><b>'+esc(todayJalali())+' (امروز)</b></div>'
      +'<p class="hint">بعد از تأیید، جدول ثبت نتایج کل کلاس باز می‌شود.</p>';
  }else if(a.type==='attall'){
    lines='<div class="kv"><span>کار</span><b>حضور و غیاب امروز</b></div>'
      +'<div class="kv"><span>وضعیت</span><b>همهٔ '+fa(db.students.length)+' دانش‌آموز حاضر</b></div>'
      +'<div class="kv"><span>تاریخ جلسه</span><b>'+esc(todayJalali())+'</b></div>';
  }else if(a.type==='qscore'){
    var q=quizById(a.quizId);
    lines='<div class="kv"><span>کار</span><b>ثبت نمرهٔ آزمونک</b></div>'
      +'<div class="kv"><span>دانش‌آموز</span><b>'+esc(s.name)+' '+esc(s.family)+'</b></div>'
      +'<div class="kv"><span>آزمونک</span><b>'+esc(q?q.title:'')+' ('+esc(q?q.subject:'')+')</b></div>'
      +'<div class="kv"><span>سطح</span><b>'+scoreLabel(a.value)+'</b></div>';
  }else if(a.type==='score'){
    var e=examById(a.examId);
    lines='<div class="kv"><span>کار</span><b>ثبت نمره</b></div>'
      +'<div class="kv"><span>دانش‌آموز</span><b>'+esc(s.name)+' '+esc(s.family)+'</b></div>'
      +'<div class="kv"><span>آزمون</span><b>'+esc(e?e.title:'')+' ('+esc(e?e.subject:'')+')</b></div>'
      +'<div class="kv"><span>سطح</span><b>'+scoreLabel(a.value)+'</b></div>';
  }else if(a.type==='att'){
    lines='<div class="kv"><span>کار</span><b>حضور و غیاب امروز</b></div>'
      +'<div class="kv"><span>دانش‌آموز</span><b>'+esc(s.name)+' '+esc(s.family)+'</b></div>'
      +'<div class="kv"><span>وضعیت</span><b>'+(a.mark==='a'?'غایب':a.mark==='l'?'تأخیر':'حاضر')+'</b></div>'
      +'<div class="kv"><span>تاریخ جلسه</span><b>'+esc(todayJalali())+'</b></div>';
  }else{
    lines='<div class="kv"><span>کار</span><b>باز کردن داشبورد</b></div>'
      +'<div class="kv"><span>دانش‌آموز</span><b>'+esc(s.name)+' '+esc(s.family)+'</b></div>';
  }
  openDlg(dlgHead('🎤 این را فهمیدم — درست است؟')
    +(r.heard?'<p class="hint">گفتید: «'+esc(r.heard)+'»</p>':'')
    +lines
    +'<div class="btnrow"><button class="btn" onclick="confirmVoice()">✔ تأیید</button><button class="btn soft" onclick="cancelVoice()">لغو</button></div>');
}
function cancelVoice(){ voicePending=null; voiceAmbPending=null; closeDlg(); }
function confirmVoice(){
  var a=voicePending; voicePending=null;
  if(!a){ closeDlg(); return; }
  if(a.type==='score'){
    if(!db.scores[a.examId]) db.scores[a.examId]={};
    db.scores[a.examId][a.studentId]=a.value;
    saveDb(); closeDlg(); render(); toast('نمره ثبت شد ✅');
  }else if(a.type==='newquiz'){
    if(!Array.isArray(db.quizzes)) db.quizzes=[];
    var nq2={id:uid(),title:'آزمونک '+a.subject,subject:a.subject,date:todayJalali()};
    db.quizzes.push(nq2);
    saveDb(); closeDlg(); go('exams'); quizGrid(nq2.id); toast('آزمونک ساخته شد ✅');
  }else if(a.type==='qscore'){
    if(!db.qscores) db.qscores={};
    if(!db.qscores[a.quizId]) db.qscores[a.quizId]={};
    db.qscores[a.quizId][a.studentId]=a.value;
    saveDb(); closeDlg(); render(); toast('نمرهٔ آزمونک ثبت شد ✅');
  }else if(a.type==='attall'){
    var da=todayJalali();
    if(!Array.isArray(db.attendance)) db.attendance=[];
    var sna=null;
    db.attendance.forEach(function(x){ if(x.date===da) sna=x; });
    if(!sna){ sna={id:uid(),date:da,marks:{}}; db.attendance.push(sna); }
    if(!sna.marks) sna.marks={};
    db.students.forEach(function(st){ sna.marks[st.id]='p'; });
    saveDb(); closeDlg(); render(); toast('همه حاضر ثبت شدند ✅');
  }else if(a.type==='att'){
    var d=todayJalali();
    if(!Array.isArray(db.attendance)) db.attendance=[];
    var sn=null;
    db.attendance.forEach(function(x){ if(x.date===d) sn=x; });
    if(!sn){ sn={id:uid(),date:d,marks:{}}; db.students.forEach(function(st){ sn.marks[st.id]='p'; }); db.attendance.push(sn); }
    if(!sn.marks) sn.marks={};
    sn.marks[a.studentId]=a.mark;
    saveDb(); closeDlg(); render(); toast('حضور و غیاب ثبت شد ✅');
  }else if(a.type==='dash'){
    closeDlg(); openStudent(a.studentId);
  }
}

var recogObj=null, voiceListening=false;
function voiceSupported(){ return !!(window.SpeechRecognition||window.webkitSpeechRecognition); }
function voiceNote(msg){
  var h=document.getElementById('voiceHint');
  if(h){ h.style.display='block'; h.textContent=msg; }
  toast(msg);
}
function voiceBtnHtml(){
  return '<button class="btn soft block voiceBtn" style="margin:0 0 12px" onclick="startVoice()">🎤 فرمان صوتی</button><p class="hint" id="voiceHint" style="display:none;margin:-6px 2px 10px"></p>';
}
function voiceBtnState(){
  document.querySelectorAll('.voiceBtn').forEach(function(b){
    b.textContent=voiceListening?'⏹ در حال گوش دادن… (برای توقف بزنید)':'🎤 فرمان صوتی';
    b.classList.toggle('listening',voiceListening);
  });
}
function startVoice(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ voiceNote('مرورگر شما فرمان صوتی ندارد'); return; }
  if(voiceListening&&recogObj){ try{ recogObj.stop(); }catch(e){} return; }
  try{ recogObj=new SR(); }catch(e){ voiceNote('مرورگر شما فرمان صوتی ندارد'); return; }
  recogObj.lang='fa-IR'; recogObj.continuous=false; recogObj.interimResults=false; recogObj.maxAlternatives=1;
  recogObj.onresult=function(ev){
    var txt='';
    for(var i=0;i<ev.results.length;i++){ txt+=ev.results[i][0].transcript; }
    if(txt.trim()) handleVoiceText(txt);
  };
  recogObj.onerror=function(ev){
    voiceListening=false; voiceBtnState();
    if(ev.error==='not-allowed'||ev.error==='service-not-allowed') voiceNote('دسترسی به میکروفون داده نشد');
    else if(ev.error==='no-speech') voiceNote('صدایی شنیده نشد؛ دوباره تلاش کنید');
    else if(ev.error!=='aborted') voiceNote('خطا در تشخیص صدا');
  };
  recogObj.onend=function(){ voiceListening=false; voiceBtnState(); };
  try{ recogObj.start(); voiceListening=true; voiceBtnState(); voiceNote('🎙 در حال گوش دادن… صحبت کنید'); }
  catch(e){ voiceListening=false; voiceBtnState(); }
}

  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

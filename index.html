<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دستیار مدیریت کلاس</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5B301">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FFFDF5; --card:#FFFFFF; --ink:#3D2C22; --muted:#9A7B68;
  --pri:#F5B301; --pri-d:#9C6603; --acc:#F08A3C; --warn:#C0392B;
  --line:#F7EBC8; --chip:#FFF3C4; --shadow:0 2px 10px rgba(214,164,32,.10);
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.65;padding-bottom:98px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#FFF6D8,#FFE066);color:#4A3205;padding:11px 16px 9px;box-shadow:0 2px 10px rgba(214,164,32,.30);border-bottom:2px solid #F5B301}
header h1{margin:0;font-size:19px;font-weight:800}
header p{margin:2px 0 0;font-size:12.5px;opacity:.92}
main{max-width:560px;margin:0 auto;padding:10px 12px 8px}
h2.sec{font-size:16px;margin:12px 2px 6px;color:var(--pri-d)}
h2.sec::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFDF6B,#F5B301);margin-left:7px;box-shadow:0 0 0 3px #FFF3C4;vertical-align:-1px}
.guide{background:#FFF8DC;border:1px dashed #EFD586;border-radius:12px;padding:7px 11px;font-size:13px;color:#8A6A45;margin:0 0 9px}
.empty{background:linear-gradient(180deg,#FFFFFF,#FFFBEB);border:1.5px dashed #F0D98C;border-radius:18px;padding:16px 14px;text-align:center;color:var(--muted);font-size:14px}
.empty .big{font-size:28px;display:flex;align-items:center;justify-content:center;width:54px;height:54px;margin:0 auto 7px;background:#FFF3C4;border-radius:50%;box-shadow:0 3px 10px rgba(214,164,32,.25)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow)}
.card .num{font-size:26px;font-weight:800;color:var(--pri-d);line-height:1.3}
.card .lbl{font-size:13px;color:var(--muted)}
.card .sub{font-size:12px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);margin-bottom:9px}
.panel h3{margin:0 0 8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#3D2C22;font-weight:700}
svg.chart{width:100%;height:auto;display:block}
.rowitem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 11px;margin-bottom:6px;box-shadow:var(--shadow);cursor:pointer}
.rowitem .grow{flex:1;min-width:0}
.rowitem .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowitem .meta{font-size:12.5px;color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--chip);color:var(--pri-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--chip);color:var(--pri-d)}
.badge.red{background:#FDECEA;color:var(--warn)}
.badge.green{background:#E6F4EA;color:#3FA34D}
.trend{font-weight:800;font-size:15px}
.trend.up{color:#3FA34D}.trend.dn{color:var(--warn)}.trend.flat{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:10px 16px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--pri);color:#3D2C22;min-height:44px;box-shadow:0 2px 8px rgba(214,164,32,.35)}
.btn:active{background:#E8A90C}
.btn.ghost{background:#fff;color:var(--pri-d);border:1.5px solid var(--pri)}
.btn.soft{background:var(--chip);color:var(--pri-d)}
.btn.danger{background:#fff;color:var(--warn);border:1.5px solid #F0C4BE}
.btn.small{padding:6px 12px;min-height:38px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.iconbtn{border:none;background:var(--chip);color:var(--pri-d);width:38px;height:38px;border-radius:10px;font-size:16px;cursor:pointer;flex:none}
.iconbtn.red{background:#FDECEA;color:var(--warn)}
.fab{display:block;width:100%;margin:2px 0 9px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,select,textarea:focus{outline:2px solid #FFD94D;border-color:var(--pri)}
label.f{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
.searchbar{position:sticky;top:94px;z-index:15;background:var(--bg);padding:8px 0 6px;margin:0 0 6px}
.searchbar input{border:2px solid var(--pri);border-radius:14px;padding:12px 14px;font-size:16px;box-shadow:0 3px 12px rgba(214,164,32,.22);background:#fff}
.stuAcc{background:var(--card);border:1.5px solid var(--pri);border-radius:16px;padding:12px 14px;margin:-2px 0 10px;box-shadow:var(--shadow)}
.accArrow{color:var(--pri-d);font-size:13px;flex:none;padding:0 2px}
nav#tabbar{position:fixed;bottom:0;right:0;left:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;box-shadow:0 -2px 10px rgba(214,164,32,.08);padding-bottom:env(safe-area-inset-bottom)}
nav#tabbar button{flex:1;border:none;background:none;padding:9px 2px 8px;font-family:inherit;font-size:13px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:66px}
nav#tabbar button .ic{font-size:26px;line-height:1.15}
nav#tabbar button.on{color:var(--pri-d);font-weight:800}
#modalWrap{position:fixed;inset:0;height:100vh;height:100dvh;z-index:50;display:none}
#modalWrap.open{display:block}
#modalWrap .scrim{position:absolute;inset:0;background:rgba(61,44,34,.45)}
.sheet{position:absolute;right:0;left:0;bottom:0;margin:0 auto;width:min(96vw,480px);max-height:92vh;max-height:92dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -4px 24px rgba(0,0,0,.2)}
.sheet h3{margin:0 0 6px;font-size:17px}
.sheet .x{position:absolute;top:12px;left:12px}
.sheetwrap{position:relative}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}
.scoregrid .srow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #FAF0D2}
.scoregrid .srow:last-child{border-bottom:none}
.scoregrid .sname{flex:1;min-width:0;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scoregrid input{width:78px;flex:none;text-align:center}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #FAF0D2;font-size:14px}
.kv:last-child{border-bottom:none}
.kv b{color:var(--pri-d)}
/* ===== تقویم شمسی (انتخاب تاریخ با لمس) ===== */
#calWrap{position:fixed;inset:0;height:100vh;height:100dvh;z-index:70;display:none}
#calWrap.open{display:block}
#calWrap .scrim{position:absolute;inset:0;background:rgba(61,44,34,.45)}
.calSheet{position:absolute;right:0;left:0;bottom:0;margin:0 auto;width:min(96vw,480px);max-height:92vh;max-height:92dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -4px 24px rgba(0,0,0,.2)}
.calSheet h3{margin:0 0 6px;font-size:17px}
.calSheet .x{position:absolute;top:12px;left:12px}
.calNav{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.calNav .ttl{flex:1;text-align:center;font-weight:800;color:var(--pri-d);font-size:16px}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calGrid .wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0;font-weight:700}
.calDay{border:1.5px solid var(--line);background:#fff;border-radius:10px;min-height:44px;font-family:inherit;font-size:15px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center}
.calDay:active{background:var(--chip)}
.calDay.today{border-color:var(--pri);background:var(--chip);font-weight:800;color:var(--pri-d)}
.calDay.sel{background:var(--pri);border-color:var(--pri);color:#3D2C22;font-weight:800}
.calDay.empty{border:none;background:none;cursor:default;min-height:44px}
input.calField{cursor:pointer;background:#FFFDF5}
#toast{position:fixed;bottom:106px;right:50%;transform:translateX(50%) translateY(20px);background:#3D2C22;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(50%) translateY(0)}
#toast.err{background:var(--warn)}
.msg{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px;display:none}
.msg.ok{display:block;background:#E6F4EA;color:#3FA34D}
.msg.err{display:block;background:#FDECEA;color:var(--warn)}
.monthttl{font-size:14px;font-weight:800;color:var(--pri-d);margin:10px 2px 5px}
.done-topic{text-decoration:line-through;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
a{color:var(--pri-d)}
/* ===== v3: داشبوردها و ظاهر حرفه‌ای ===== */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#FFE066,#FFC93C);color:#4A3205;border-radius:20px;padding:13px 15px;box-shadow:0 4px 16px rgba(214,164,32,.35);margin-bottom:9px}
.hero .deco{position:absolute;left:-16px;top:-16px;width:118px;height:118px;opacity:.5;pointer-events:none}
.hero .sch,.hero .cls,.hero .tch{position:relative}
.hero .sch{font-size:13px;opacity:.92}
.hero .cls{font-size:20px;font-weight:800;margin:2px 0;line-height:1.5}
.hero .tch{font-size:13px;opacity:.92}
.heroStu{position:relative;overflow:hidden;display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#FFF9E3,#FFEDB0);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--shadow);margin:9px 0}
.heroStu::before{content:'';position:absolute;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,217,77,.55),rgba(255,217,77,0) 70%);top:-70px;left:-50px;pointer-events:none}
.bigava{width:84px;height:84px;border-radius:50%;background:var(--chip);color:var(--pri-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:34px;flex:none;overflow:hidden;border:3px solid #fff;box-shadow:0 2px 10px rgba(214,164,32,.3)}
.avaWrap{position:relative;flex:none;cursor:pointer}
.cambadge{position:absolute;bottom:0;left:0;width:27px;height:27px;border-radius:50%;background:var(--pri);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 1px 5px rgba(0,0,0,.25);z-index:2}
.bigava img,.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar{overflow:hidden;padding:0}
.heroStu .nm2{font-size:19px;font-weight:800;line-height:1.5}
.heroStu .meta2{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(102px,1fr));gap:7px;margin-bottom:9px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 6px;text-align:center;box-shadow:var(--shadow)}
.stat .v{font-size:21px;font-weight:800;color:var(--pri-d);line-height:1.4}
.stat .v.good{color:#3FA34D}.stat .v.mid{color:#B8860B}.stat .v.bad{color:var(--warn)}
.stat .v.sm{font-size:13.5px;line-height:2}
.stat .l{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:5px;vertical-align:-1px}
table.grid{width:100%;border-collapse:collapse;font-size:13.5px}
table.grid th,table.grid td{padding:7px 6px;border-bottom:1px solid #FAF0D2;text-align:right}
table.grid th{color:var(--muted);font-weight:700;font-size:12.5px}
table.grid td.num,table.grid th.num{text-align:center}
.attchips{display:flex;gap:5px;flex:none}
.attchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--muted);min-height:34px}
.attchip.on-p{background:#E6F4EA;border-color:#3FA34D;color:#3FA34D;font-weight:800}
.attchip.on-a{background:#FDECEA;border-color:var(--warn);color:var(--warn);font-weight:800}
.attchip.on-l{background:#FFF6E0;border-color:#D9A404;color:#9A7400;font-weight:800}
.ringwrap{display:flex;align-items:center;gap:14px}
.ringwrap .grow2{flex:1;min-width:0}
.photobox{display:flex;align-items:center;gap:12px;margin-top:4px}
.photobox img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:var(--chip)}
/* گزارش والدین (پیش‌نمایش روی صفحه و چاپ) */
.rep{color:var(--ink)}
.rep-hero{background:linear-gradient(135deg,#F5A623,#D98E04);color:#4A3205;border-radius:12px;padding:12px 14px;-webkit-print-color-adjust:exact;print-color-adjust:exact;margin-bottom:10px;text-align:center}
.rep-hero .l1{font-weight:800;font-size:15.5px}
.rep-hero .l2{font-size:13px;margin-top:2px;opacity:.95}
.rep-id{display:flex;align-items:center;gap:12px;margin:10px 0}
.rep-photo{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.rep-name{font-size:19px;font-weight:800}
.rep-meta{font-size:13px;color:var(--muted)}
.rep-stats{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.rep-stat{flex:1;min-width:70px;border:1.5px solid #F0C93F;border-radius:10px;padding:6px 4px;text-align:center;background:#FFFBEB;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rep-stat .v{font-size:18px;font-weight:800;color:#9C6603;line-height:1.4}
.rep-stat .l{font-size:11px;color:#8A6A45}
.rep-h{font-size:14.5px;margin:14px 0 6px;color:var(--pri-d)}
.rep-note{border:1.5px dashed #F5B301;border-radius:10px;padding:9px 12px;margin-top:12px;background:#FFFDF5;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:13.5px}
.rep-foot{margin-top:14px;text-align:center;font-size:12.5px;color:var(--muted)}
.repPrev{border:1px solid var(--line);border-radius:14px;padding:12px;background:#FFFDF9;margin-bottom:6px}
#printArea{display:none}
/* ===== همگام‌سازی خودکار: نقطهٔ وضعیت و بنر تعارض ===== */
.syncst{display:none;align-items:center;gap:5px;font-size:11.5px;background:rgba(255,255,255,.55);border:1px solid #EFD586;border-radius:999px;padding:1px 9px;margin-top:5px;color:#6B5320}
.syncst::before{content:'●';font-size:10px}
.syncst.ok{color:#2E7D32}.syncst.ok::before{color:#3FA34D}
.syncst.wait{color:#8A6A00}.syncst.wait::before{color:#D9A404}
.syncst.bad{color:#C0392B}.syncst.bad::before{color:#C0392B}
#syncBanner{position:fixed;top:0;right:0;left:0;z-index:80;background:#FDECEA;color:#7B1F14;border-bottom:2px solid #C0392B;padding:10px 14px;font-size:13.5px;display:none;box-shadow:0 2px 12px rgba(0,0,0,.18)}
#syncBanner.show{display:block}
#syncBanner button{float:left;border:none;background:#fff;color:#C0392B;width:30px;height:30px;border-radius:8px;font-size:14px;cursor:pointer;margin-right:8px}
.voiceBtn.listening{background:#F08A3C!important;color:#fff!important}
@page{margin:12mm}
@media print{
  header,main,nav#tabbar,#modalWrap,#calWrap,#toast,#syncBanner{display:none!important}
  body{padding:0;background:#fff;position:static!important;top:auto!important;left:auto!important;right:auto!important;width:auto!important;overflow:visible!important}
  #printArea{display:block!important;color:#000;font-size:13px}
  #printArea .phead{text-align:center;border:1.5px solid #444;border-radius:8px;padding:8px 10px;margin-bottom:10px}
  #printArea .phead .l1{font-weight:800;font-size:14.5px}
  #printArea .phead .l2{font-size:13px;margin-top:2px}
  #printArea .phead .l3{font-size:11.5px;color:#333;margin-top:2px}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #777;padding:5px 7px;text-align:right;font-size:12.5px}
  #printArea th{background:#FFF6D8;font-weight:800}
  #printArea .pfoot{margin-top:10px;font-size:12.5px}
}
</style>
</head>
<body>
<header>
  <h1>🌻 دستیار مدیریت کلاس</h1>
  <p>پایهٔ ششم دبستان دخترانه — دانش‌آموزان، آزمون‌ها، حضور و غیاب و برنامهٔ درسی</p>
  <span class="syncst" id="syncStatus"></span>
</header>
<div id="syncBanner"><button onclick="hideSyncBanner()" aria-label="بستن">✕</button><span id="syncBannerTxt"></span></div>
<main id="app"></main>
<nav id="tabbar">
  <button data-tab="dash"><span class="ic">🏠</span>داشبورد</button>
  <button data-tab="students"><span class="ic">👧</span>دانش‌آموزان</button>
  <button data-tab="exams"><span class="ic">📝</span>آزمون‌ها</button>
  <button data-tab="attendance"><span class="ic">🗓</span>حضور و غیاب</button>
  <button data-tab="groups"><span class="ic">👥</span>گروه‌ها</button>
  <button data-tab="plan"><span class="ic">📚</span>برنامهٔ درسی</button>
  <button data-tab="settings"><span class="ic">⚙️</span>تنظیمات</button>
</nav>
<div id="modalWrap"><div class="scrim" onclick="closeDlg()"></div><div class="sheet" id="sheet"></div></div>
<div id="calWrap"><div class="scrim" onclick="closeCal()"></div><div class="calSheet" id="calSheet"></div></div>
<div id="toast"></div>
<div id="printArea"></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">
<input type="file" id="heroPhotoFile" accept="image/*" style="display:none" onchange="onHeroPhoto(this)">
<script>
'use strict';
/* ===== داده و ذخیره‌سازی ===== */
var LS_DB='dk_db_v1', LS_CFG='dk_sync_cfg';
var SUBJECTS=['ریاضی','فارسی','علوم','مطالعات اجتماعی','هدیه‌های آسمان','قرآن','هنر','ورزش','تفکر و پژوهش'];
var MONTHS=['مهر','آبان','آذر','دی','بهمن','اسفند','فروردین','اردیبهشت','خرداد'];
function emptyDb(){return {students:[],exams:[],scores:{},plan:[],attendance:[],groups:[],gacts:[],quizzes:[],qscores:{},acts:[],wallnews:[],_rev:0};}
function loadDb(){
  try{var raw=localStorage.getItem(LS_DB); if(!raw) return emptyDb();
    var d=JSON.parse(raw); if(!d||typeof d!=='object') return emptyDb();
    d.students=d.students||[]; d.exams=d.exams||[]; d.scores=d.scores||{}; d.plan=d.plan||[]; d.attendance=d.attendance||[]; d.groups=d.groups||[]; d.gacts=d.gacts||[]; d.acts=d.acts||[]; d.wallnews=d.wallnews||[]; d.quizzes=d.quizzes||[]; d.qscores=d.qscores||{}; d._rev=d._rev||0; return d;
  }catch(e){return emptyDb();}
}
var db=loadDb();
/* وضعیت همگام‌سازی خودکار: کثیف = از آخرین همگام‌سازی موفق، تغییری ذخیره شده است */
var syncDirty=false, syncConflict=false, syncBusy=false;
try{ syncDirty=localStorage.getItem('dk_dirty')==='1'; }catch(e){}
function markDirty(){ syncDirty=true; try{localStorage.setItem('dk_dirty','1');}catch(e){} updateSyncDot(); }

/* ===== ابزارها ===== */
var FA='۰۱۲۳۴۵۶۷۸۹';
function fa(x){ if(x===null||x===undefined||x==='') return '—'; return String(x).replace(/[0-9]/g,function(d){return FA[+d];}).replace(/\./g,'٫'); }
function faNum(x,dec){ if(x===null||x===undefined||isNaN(x)) return '—'; var s=(dec!=null)?Number(x).toFixed(dec):String(Math.round(Number(x)*100)/100); return fa(s); }
function faScore(v){ if(v===null||v===undefined||isNaN(v)) return '—'; return fa(String(Math.round(Number(v)*100)/100)); }
function enDigits(s){ return String(s||'').replace(/[۰-۹]/g,function(d){return FA.indexOf(d);}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}); }
function parseScore(s){ s=enDigits(String(s||'').trim()).replace('٫','.').replace(',','.'); if(s==='') return null; var n=parseFloat(s); if(isNaN(n)||n<0||n>20) return undefined; return n; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(t,err){ var el=document.getElementById('toast'); el.textContent=t; el.className='show'+(err?' err':''); setTimeout(function(){el.className='';},2600); }
function dateKey(d){ return enDigits(d||'').replace(/[^0-9]/g,''); }
function examsSorted(){ return db.exams.slice().sort(function(a,b){ var ka=dateKey(a.date),kb=dateKey(b.date); if(ka<kb) return -1; if(ka>kb) return 1; return 0; }); }
function studentById(id){ for(var i=0;i<db.students.length;i++) if(db.students[i].id===id) return db.students[i]; return null; }
function examById(id){ for(var i=0;i<db.exams.length;i++) if(db.exams[i].id===id) return db.exams[i]; return null; }
function scoreOf(examId,studentId){ var m=db.scores[examId]; if(!m) return null; var v=m[studentId]; return (v===null||v===undefined||v==='')?null:Number(v); }
function examScores(examId){ var out=[]; db.students.forEach(function(s){ var v=scoreOf(examId,s.id); if(v!==null) out.push(v); }); return out; }
function avgOf(arr){ if(!arr.length) return null; var t=0; arr.forEach(function(v){t+=v;}); return t/arr.length; }
function examAvg(examId){ return avgOf(examScores(examId)); }
function studentEntries(studentId){ var out=[]; examsSorted().forEach(function(e){ var v=scoreOf(e.id,studentId); if(v!==null) out.push({exam:e,score:v}); }); return out; }
function studentAvg(studentId){ var es=studentEntries(studentId); return avgOf(es.map(function(x){return x.score;})); }
function allScoresAvg(){ var all=[]; db.exams.forEach(function(e){ all=all.concat(examScores(e.id)); }); return avgOf(all); }
function studentTrend(studentId){ var es=studentEntries(studentId); if(es.length<2) return null; var d=es[es.length-1].score-es[es.length-2].score; return Math.round(d*100)/100; }
function needsAttention(){
  var ca=allScoresAvg(), out=[];
  db.students.forEach(function(s){
    var es=studentEntries(s.id); if(!es.length) return;
    var reasons=[];
    var tr=studentTrend(s.id); if(tr!==null&&tr<0) reasons.push('افت نمره در آخرین آزمون‌ها');
    var av=studentAvg(s.id); if(ca!==null&&av!==null&&av<ca-2) reasons.push('میانگین پایین‌تر از کلاس');
    if(reasons.length) out.push({student:s,reasons:reasons,avg:av,trend:tr});
  });
  return out;
}
function planProgress(){ if(!db.plan.length) return null; var d=db.plan.filter(function(p){return p.status==='done';}).length; return Math.round(d/db.plan.length*100); }
function avatarHtml(s){ return s.photo?'<img src="'+s.photo+'" alt="">':esc((s.name||'؟').charAt(0)); }
/* ===== حضور و غیاب: درصد حضور = (حاضر + تأخیر) ÷ جلسات ثبت‌شده × ۱۰۰ ===== */
function attSessions(){ return (db.attendance||[]).slice().sort(function(a,b){ var ka=dateKey(a.date),kb=dateKey(b.date); if(ka<kb) return -1; if(ka>kb) return 1; return 0; }); }
function attStats(studentId){
  var ses=attSessions(), p=0,a=0,l=0, absDates=[], lateDates=[];
  ses.forEach(function(sn){ var m=(sn.marks||{})[studentId]; if(m==='a'){ a++; absDates.push(sn.date); } else if(m==='l'){ l++; lateDates.push(sn.date); } else if(m==='p'){ p++; } });
  var marked=p+a+l;
  return { total:ses.length, marked:marked, p:p, a:a, l:l, pct:marked?Math.round((p+l)/marked*100):null, absDates:absDates, lateDates:lateDates };
}
function classAtt(){
  var ses=attSessions(), p=0,a=0,l=0;
  ses.forEach(function(sn){ Object.keys(sn.marks||{}).forEach(function(k){ var m=sn.marks[k]; if(m==='a')a++; else if(m==='l')l++; else if(m==='p')p++; }); });
  var tot=p+a+l, last=ses.length?ses[ses.length-1]:null, lc=null;
  if(last){ var lp=0,la=0,ll=0; Object.keys(last.marks||{}).forEach(function(k){ var m=last.marks[k]; if(m==='a')la++; else if(m==='l')ll++; else lp++; }); lc={p:lp,a:la,l:ll}; }
  return { sessions:ses.length, p:p, a:a, l:l, pct:tot?Math.round((p+l)/tot*100):null, last:last, lastCounts:lc };
}
/* ===== میانگین درس‌ها و توزیع ===== */
function subjectAvgs(studentId){
  var subs=[]; db.exams.forEach(function(e){ if(subs.indexOf(e.subject)<0) subs.push(e.subject); });
  return subs.map(function(sub){
    var sv=[], cv=[];
    db.exams.forEach(function(e){ if(e.subject!==sub) return; cv=cv.concat(examScores(e.id)); if(studentId){ var v=scoreOf(e.id,studentId); if(v!==null) sv.push(v); } });
    return { subject:sub, stu:studentId?avgOf(sv):null, cls:avgOf(cv) };
  }).filter(function(x){ return x.cls!==null||x.stu!==null; });
}
function distBuckets(){
  var b=[0,0,0,0];
  db.students.forEach(function(s){ var av=studentAvg(s.id); if(av===null) return; if(av>=18)b[0]++; else if(av>=15)b[1]++; else if(av>=12)b[2]++; else b[3]++; });
  return b;
}
function statusOf(av){ if(av===null||av===undefined) return ''; if(av>=15) return 'good'; if(av>=12) return 'mid'; return 'bad'; }
function ringSvg(pct){
  if(pct===null||pct===undefined) return '';
  var r=30, c=2*Math.PI*r, off=c*(1-pct/100);
  var col=pct>=90?'#3FA34D':pct>=75?'#D9A404':'#C0392B';
  return '<svg width="76" height="76" viewBox="0 0 76 76" style="flex:none"><circle cx="38" cy="38" r="'+r+'" fill="none" stroke="#F7EBC8" stroke-width="8"/><circle cx="38" cy="38" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 38 38)"/><text x="38" y="44" font-size="15" font-weight="800" text-anchor="middle" fill="'+col+'">'+fa(pct)+'٪</text></svg>';
}
function subjectBarsSvg(rows,paired){
  var W=330, maxW=W-44;
  function bw(v){ return Math.max(0,Math.min(20,v))/20*maxW; }
  var out='';
  rows.forEach(function(r){
    out+='<div style="font-size:12.5px;font-weight:700;margin:9px 0 3px">'+esc(r.subject)+'</div>';
    var gh=paired?30:16, s='<svg class="chart" viewBox="0 0 '+W+' '+gh+'" role="img">';
    if(paired){
      if(r.stu!==null) s+='<rect x="'+(W-2-bw(r.stu)).toFixed(1)+'" y="1" width="'+bw(r.stu).toFixed(1)+'" height="11" rx="5.5" fill="#F5B301"/><text x="'+(W-7-bw(r.stu)).toFixed(1)+'" y="10.5" font-size="10.5" font-weight="bold" text-anchor="end" fill="#9C6603">'+faNum(r.stu,1)+'</text>';
      if(r.cls!==null) s+='<rect x="'+(W-2-bw(r.cls)).toFixed(1)+'" y="16" width="'+bw(r.cls).toFixed(1)+'" height="11" rx="5.5" fill="#F08A3C" opacity="0.8"/><text x="'+(W-7-bw(r.cls)).toFixed(1)+'" y="25.5" font-size="10.5" font-weight="bold" text-anchor="end" fill="#B85C12">'+faNum(r.cls,1)+'</text>';
    }else{
      if(r.cls!==null) s+='<rect x="'+(W-2-bw(r.cls)).toFixed(1)+'" y="2" width="'+bw(r.cls).toFixed(1)+'" height="12" rx="6" fill="#F5B301"/><text x="'+(W-7-bw(r.cls)).toFixed(1)+'" y="12" font-size="10.5" font-weight="bold" text-anchor="end" fill="#9C6603">'+faNum(r.cls,1)+'</text>';
    }
    out+=s+'</svg>';
  });
  return out;
}
function distSvg(){
  var b=distBuckets(), labels=['۱۸ تا ۲۰','۱۵ تا ۱۸','۱۲ تا ۱۵','کمتر از ۱۲'], names=['عالی','خوب','متوسط','نیازمند توجه'], cols=['#3FA34D','#D9A404','#F08A3C','#C0392B'];
  var W=330,H=170, base=134, maxV=Math.max(1,Math.max.apply(null,b)), plotH=94, out='';
  [0,0.5,1].forEach(function(f){ var y=base-plotH*f; out+='<line x1="26" y1="'+y+'" x2="'+(W-4)+'" y2="'+y+'" stroke="#F7EBC8" stroke-width="1"/><text x="22" y="'+(y+3)+'" font-size="9.5" text-anchor="end" fill="#9A7B68">'+fa(Math.round(maxV*f))+'</text>'; });
  b.forEach(function(n,i){
    var cx=26+(W-30)/4*i+(W-30)/8, bw2=46, bh=plotH*(n/maxV);
    out+='<rect x="'+(cx-bw2/2)+'" y="'+(base-bh)+'" width="'+bw2+'" height="'+bh+'" rx="6" fill="'+cols[i]+'"/>'
      +'<text x="'+cx+'" y="'+(base-bh-6)+'" font-size="13" font-weight="800" text-anchor="middle" fill="'+cols[i]+'">'+fa(n)+' نفر</text>'
      +'<text x="'+cx+'" y="'+(base+16)+'" font-size="10.5" text-anchor="middle" fill="#3D2C22">'+labels[i]+'</text>'
      +'<text x="'+cx+'" y="'+(base+30)+'" font-size="9.5" text-anchor="middle" fill="#9A7B68">'+names[i]+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+out+'</svg>';
}
function sparkSvg(sid){
  var es=studentEntries(sid);
  if(es.length<2) return '<p class="hint">برای نمایش روند، دست‌کم دو نمره لازم است.</p>';
  var W=330,H=92,pl=30,pr=8,pt=14,pb=18, iw=W-pl-pr, ih=H-pt-pb;
  var vals=es.map(function(x){ return x.score; });
  var min=Math.max(0,Math.floor(Math.min.apply(null,vals)-1)), max=Math.min(20,Math.ceil(Math.max.apply(null,vals)+1)); if(max-min<2) max=min+2;
  function X(i){ return pl+iw*i/(es.length-1); }
  function Y(v){ return pt+ih-(v-min)/(max-min)*ih; }
  var line=es.map(function(x,i){ return X(i).toFixed(1)+','+Y(x.score).toFixed(1); }).join(' ');
  var dots=es.map(function(x,i){ return '<circle cx="'+X(i)+'" cy="'+Y(x.score)+'" r="3.5" fill="#F5B301"/><text x="'+X(i)+'" y="'+(Y(x.score)-7)+'" font-size="10" text-anchor="middle" fill="#9C6603" font-weight="bold">'+faScore(x.score)+'</text><text x="'+X(i)+'" y="'+(H-4)+'" font-size="9" text-anchor="middle" fill="#9A7B68">'+esc(x.exam.date||'')+'</text>'; }).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img"><polyline points="'+line+'" fill="none" stroke="#F5B301" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'</svg>';
}

function chartSvg(){
  var subs=['همه']; db.exams.forEach(function(e){ if(subs.indexOf(e.subject)<0) subs.push(e.subject); });
  var chips=subs.map(function(s){ return '<button class="chip'+(chartSubject===s?' on':'')+'" data-subject-chip="'+esc(s)+'">'+esc(s)+'</button>'; }).join('');
  var ex=examsSorted().filter(function(e){ return chartSubject==='همه'||e.subject===chartSubject; });
  var pts=ex.map(function(e){ return {e:e,avg:examAvg(e.id)}; }).filter(function(p){ return p.avg!==null; });
  var body='';
  if(pts.length<2){ body='<p class="hint">برای نمایش نمودار روند، دست‌کم نمرات دو آزمون لازم است.</p>'; }
  else{
    var W=320,H=150,pl=34,pr=10,pt=14,pb=24, iw=W-pl-pr, ih=H-pt-pb;
    var min=20,max=0; pts.forEach(function(p){ if(p.avg<min)min=p.avg; if(p.avg>max)max=p.avg; });
    min=Math.max(0,Math.floor(min-1)); max=Math.min(20,Math.ceil(max+1)); if(max-min<2){max=min+2;}
    function X(i){ return pl+iw*(pts.length===1?0.5:i/(pts.length-1)); }
    function Y(v){ return pt+ih-(v-min)/(max-min)*ih; }
    var line=pts.map(function(p,i){ return X(i).toFixed(1)+','+Y(p.avg).toFixed(1); }).join(' ');
    var dots=pts.map(function(p,i){ return '<circle cx="'+X(i)+'" cy="'+Y(p.avg)+'" r="4" fill="#F5B301"/><text x="'+X(i)+'" y="'+(Y(p.avg)-8)+'" font-size="10.5" text-anchor="middle" fill="#9C6603" font-weight="bold">'+faNum(p.avg,1)+'</text><text x="'+X(i)+'" y="'+(H-6)+'" font-size="9.5" text-anchor="middle" fill="#9A7B68">'+esc(p.e.date||'')+'</text>'; }).join('');
    var grid=''; for(var g=0;g<=2;g++){ var v=min+(max-min)*g/2, y=Y(v); grid+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="#F7EBC8" stroke-width="1"/><text x="'+(pl-4)+'" y="'+(y+3)+'" font-size="9.5" text-anchor="end" fill="#9A7B68">'+faNum(v,0)+'</text>'; }
    body='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+grid+'<polyline points="'+line+'" fill="none" stroke="#F5B301" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'</svg>';
  }
  return '<div class="panel"><h3>📈 روند تحصیلی کلاس (میانگین هر آزمون)</h3><div class="chips">'+chips+'</div>'+body+'</div>';
}

function studentTrendInner(id){
  var subs=['همه']; db.exams.forEach(function(e){ if(subs.indexOf(e.subject)<0) subs.push(e.subject); });
  var chips=subs.map(function(x){ return '<button class="chip'+(stuSubject===x?' on':'')+'" data-stuchip="'+esc(x)+'">'+esc(x)+'</button>'; }).join('');
  var ex=examsSorted().filter(function(e){ return stuSubject==='همه'||e.subject===stuSubject; });
  var pts=ex.map(function(e){ return {e:e,v:scoreOf(e.id,id),ca:examAvg(e.id)}; }).filter(function(p){ return p.v!==null; });
  var head='<div class="chips">'+chips+'</div>';
  if(pts.length<2) return head+'<p class="hint">برای نمایش نمودار روند، دست‌کم نمرات دو آزمون لازم است.</p>';
  var W=320,H=150,pl=34,pr=10,pt=14,pb=24, iw=W-pl-pr, ih=H-pt-pb;
  var min=20,max=0; pts.forEach(function(p){ if(p.v<min)min=p.v; if(p.v>max)max=p.v; if(p.ca!==null){ if(p.ca<min)min=p.ca; if(p.ca>max)max=p.ca; } });
  min=Math.max(0,Math.floor(min-1)); max=Math.min(20,Math.ceil(max+1)); if(max-min<2){ max=min+2; }
  function X(i){ return pl+iw*(pts.length===1?0.5:i/(pts.length-1)); }
  function Y(v){ return pt+ih-(v-min)/(max-min)*ih; }
  var grid=''; for(var g=0;g<=2;g++){ var v=min+(max-min)*g/2, y=Y(v); grid+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="#F7EBC8" stroke-width="1"/><text x="'+(pl-4)+'" y="'+(y+3)+'" font-size="9.5" text-anchor="end" fill="#9A7B68">'+faNum(v,0)+'</text>'; }
  var line=pts.map(function(p,i){ return X(i).toFixed(1)+','+Y(p.v).toFixed(1); }).join(' ');
  var caline=pts.map(function(p,i){ return p.ca===null?null:X(i).toFixed(1)+','+Y(p.ca).toFixed(1); }).filter(Boolean).join(' ');
  var dots=pts.map(function(p,i){ return '<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="4" fill="#F5B301"/><text x="'+X(i)+'" y="'+(Y(p.v)-8)+'" font-size="10.5" text-anchor="middle" fill="#9C6603" font-weight="bold">'+faScore(p.v)+'</text><text x="'+X(i)+'" y="'+(H-6)+'" font-size="9.5" text-anchor="middle" fill="#9A7B68">'+esc(p.e.date||'')+'</text>'; }).join('');
  var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+grid
    +(caline?'<polyline points="'+caline+'" fill="none" stroke="#F08A3C" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>':'')
    +'<polyline points="'+line+'" fill="none" stroke="#F5B301" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'</svg>';
  return head+'<div class="legend"><span><i style="background:#F5B301"></i>نمرهٔ دانش‌آموز</span><span><i style="background:#F08A3C"></i>میانگین کلاس در همان آزمون</span></div>'+svg;
}

function processPhoto(dataUrl){
  return new Promise(function(res,rej){
    var img=new Image();
    img.onload=function(){
      try{
        var sc=Math.min(1,256/Math.max(img.width,img.height));
        var w=Math.max(1,Math.round(img.width*sc)), h=Math.max(1,Math.round(img.height*sc));
        var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        res(cv.toDataURL('image/jpeg',0.8));
      }catch(e){ rej(e); }
    };
    img.onerror=function(){ rej(new Error('bad image')); };
    img.src=dataUrl;
  });
}

/* ===== تقویم شمسی (تبدیل و انتخاب تاریخ) ===== */
var JMONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function g2j(gy,gm,gd){
  var gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  var jy=(gy<=1600)?0:979;
  gy-=(gy<=1600)?621:1600;
  var gy2=(gm>2)?(gy+1):gy;
  var days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];
  jy+=33*Math.floor(days/12053); days%=12053;
  jy+=4*Math.floor(days/1461); days%=1461;
  jy+=Math.floor((days-1)/365);
  if(days>365) days=(days-1)%365;
  var jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  var jd=1+((days<186)?(days%31):((days-186)%30));
  return {y:jy,m:jm,d:jd};
}
function j2g(jy,jm,jd){
  var gy=(jy<=979)?621:1600;
  jy-=(jy<=979)?0:979;
  var days=(365*jy)+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+78+jd+((jm<7)?((jm-1)*31):(((jm-7)*30)+186));
  gy+=400*Math.floor(days/146097); days%=146097;
  if(days>36524){ gy+=100*Math.floor(--days/36524); days%=36524; if(days>=365) days++; }
  gy+=4*Math.floor(days/1461); days%=1461;
  if(days>365){ gy+=Math.floor((days-1)/365); days=(days-1)%365; }
  var gd=days+1, sal=[0,31,((gy%4===0&&gy%100!==0)||gy%400===0)?29:28,31,30,31,30,31,31,30,31,30,31], gm=0;
  for(gm=0;gm<13&&gd>sal[gm];gm++) gd-=sal[gm];
  return {y:gy,m:gm,d:gd};
}
function jIsLeap(y){ var a=j2g(y,1,1), b=j2g(y+1,1,1); return (Date.UTC(b.y,b.m-1,b.d)-Date.UTC(a.y,a.m-1,a.d))/86400000===366; }
function jMonthLen(y,m){ if(m<=6) return 31; if(m<=11) return 30; return jIsLeap(y)?30:29; }
function jWeekday(y,m,d){ var g=j2g(y,m,d); return new Date(g.y,g.m-1,g.d).getDay(); }
function pad2(n){ return (n<10?'0':'')+n; }
function jFmt(y,m,d){ return fa(y+'/'+pad2(m)+'/'+pad2(d)); }
function jParse(s){ var t=enDigits(s||'').split('/'); if(t.length!==3) return null; var y=+t[0],m=+t[1],d=+t[2]; if(!y||!(m>=1&&m<=12)||!(d>=1&&d<=31)) return null; return {y:y,m:m,d:d}; }
function jToday(){ var n=new Date(); return g2j(n.getFullYear(),n.getMonth()+1,n.getDate()); }
function dateField(id,label,val){ return '<label class="f" for="'+id+'">'+label+'</label><input id="'+id+'" class="calField" readonly value="'+esc(val||'')+'" placeholder="📅 برای انتخاب تاریخ بزنید" onclick="openCal(\''+id+'\')">'; }
var calTarget=null, calCb=null, calY=1405, calM=1, calSel=null;
function openCal(inputId,cb){
  var inp=document.getElementById(inputId); if(!inp) return;
  calTarget=inputId; calCb=(typeof cb==='function')?cb:(cb?window[cb]:null);
  var cur=jParse(inp.value), base=cur||jToday();
  calY=base.y; calM=base.m; calSel=cur;
  renderCal();
  document.getElementById('calWrap').classList.add('open');
}
function closeCal(){ var w=document.getElementById('calWrap'); if(w) w.classList.remove('open'); calTarget=null; calCb=null; }
function calNav(dm){ calM+=dm; if(calM<1){ calM=12; calY--; } if(calM>12){ calM=1; calY++; } renderCal(); }
function renderCal(){
  var t=jToday(), len=jMonthLen(calY,calM), firstCol=(jWeekday(calY,calM,1)+1)%7, cells='';
  ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'].forEach(function(w){ cells+='<div class="wd">'+w+'</div>'; });
  for(var i=0;i<firstCol;i++) cells+='<div class="calDay empty"></div>';
  for(var d=1;d<=len;d++){
    var cls='calDay';
    if(calY===t.y&&calM===t.m&&d===t.d) cls+=' today';
    if(calSel&&calSel.y===calY&&calSel.m===calM&&calSel.d===d) cls+=' sel';
    cells+='<button class="'+cls+'" onclick="pickCal('+d+')">'+fa(d)+'</button>';
  }
  document.getElementById('calSheet').innerHTML='<div class="sheetwrap"><button class="btn soft small x" onclick="closeCal()">✕</button><h3>📅 انتخاب تاریخ</h3>'
    +'<div class="calNav"><button class="btn soft small" onclick="calNav(-1)">ماه قبل</button><div class="ttl">'+JMONTHS[calM-1]+' '+fa(calY)+'</div><button class="btn soft small" onclick="calNav(1)">ماه بعد</button></div>'
    +'<div class="calGrid">'+cells+'</div>'
    +'<div class="btnrow"><button class="btn soft" onclick="closeCal()">انصراف</button></div></div>';
}
function pickCal(d){
  var inp=document.getElementById(calTarget), cb=calCb;
  if(inp) inp.value=jFmt(calY,calM,d);
  closeCal();
  if(cb) cb();
}

function groupById(id){ var gs=db.groups||[]; for(var i=0;i<gs.length;i++) if(gs[i].id===id) return gs[i]; return null; }
function groupActs(gid){ return (db.gacts||[]).filter(function(a){ return a.groupId===gid; }).slice().sort(function(a,b){ var ka=dateKey(a.date),kb=dateKey(b.date); if(ka<kb) return -1; if(ka>kb) return 1; return 0; }); }
function groupAvg(gid){ var sc=groupActs(gid).filter(function(a){ return a.score!==null&&a.score!==undefined&&a.score!==''; }); if(!sc.length) return null; var t=0; sc.forEach(function(a){ t+=Number(a.score); }); return Math.round(t/sc.length*100)/100; }

/* ===== آزمونک و سؤال کلاسی ===== */
function quizById(id){ var qs=db.quizzes||[]; for(var i=0;i<qs.length;i++) if(qs[i].id===id) return qs[i]; return null; }
function quizzesSorted(){ return (db.quizzes||[]).slice().sort(function(a,b){ var ka=dateKey(a.date),kb=dateKey(b.date); if(ka<kb) return -1; if(ka>kb) return 1; return 0; }); }
function qScoreOf(qid,sid){ var m=(db.qscores||{})[qid]; if(!m) return null; var v=m[sid]; return (v===null||v===undefined||v==='')?null:Number(v); }
function quizScores(qid){ var out=[]; db.students.forEach(function(s){ var v=qScoreOf(qid,s.id); if(v!==null) out.push(v); }); return out; }
function quizAvg(qid){ return avgOf(quizScores(qid)); }
function studentQuizEntries(sid){ var out=[]; quizzesSorted().forEach(function(q){ var v=qScoreOf(q.id,sid); if(v!==null) out.push({quiz:q,score:v}); }); return out; }
function studentQuizAvg(sid){ return avgOf(studentQuizEntries(sid).map(function(x){ return x.score; })); }
function quizzesSectionHtml(){
  var h='<h2 class="sec">آزمونک و سؤال کلاسی</h2>';

  h+='<button class="btn block fab" onclick="quizForm()">➕ آزمونک جدید</button>';
  var qs=quizzesSorted();
  if(!qs.length) h+='<div class="empty"><span class="big">❓</span>هنوز آزمونکی ثبت نشده است.</div>';
  else h+=qs.map(function(q){
    var n=quizScores(q.id).length, av=quizAvg(q.id);
    return '<div class="rowitem"><div class="grow"><div class="nm">'+esc(q.title)+'</div><div class="meta"><span class="badge">'+esc(q.subject)+'</span> '+esc(q.date||'')+' · '+fa(n)+' نفر شرکت کرده · میانگین: '+faNum(av,1)+'</div></div>'
      +'<button class="btn small" onclick="quizGrid(\''+q.id+'\')">ثبت نتایج</button>'
      +'<button class="iconbtn" title="ویرایش" onclick="quizForm(\''+q.id+'\')">✏️</button>'
      +'<button class="iconbtn red" title="حذف" onclick="delQuiz(\''+q.id+'\')">🗑</button></div>';
  }).join('');
  return h;
}

function saveQuiz(id){
  var title=document.getElementById('q_title').value.trim();
  if(!title){ toast('عنوان آزمونک لازم است',true); return; }
  var free=document.getElementById('q_subfree').value.trim();
  var data={title:title,subject:free||document.getElementById('q_subject').value,date:document.getElementById('q_date').value.trim()};
  if(!Array.isArray(db.quizzes)) db.quizzes=[];

function wrapCanvasLines(g,text,maxW,maxLines){
  var words=String(text||'').split(/\s+/).filter(Boolean), lines=[], cur='', wi=0;
  while(wi<words.length&&lines.length<maxLines){
    var t=cur?cur+' '+words[wi]:words[wi];
    if(g.measureText(t).width>maxW&&cur){ lines.push(cur); cur=''; }
    else{ cur=t; wi++; }
  }
  if(cur&&lines.length<maxLines) lines.push(cur);
  if(wi<words.length&&lines.length) lines[lines.length-1]+='…';
  return lines;
}

function syncMsg(txt,ok){ var m=document.getElementById('syncMsg'); if(!m) return; m.textContent=txt; m.className='msg '+(ok?'ok':'err'); }
function readCfgFromForm(){
  var url=(document.getElementById('s_url')||{}).value||PRESET_URL;

  var cfg=syncCfg(); cfg.url=url.trim();
  if(tokEl&&tokEl.value.trim()) cfg.token=tokEl.value.trim();
  saveSyncCfg(cfg); updateSyncDot(); return cfg;
}
function saveCfgOnly(){ readCfgFromForm(); render(); toast('تنظیمات ذخیره شد ✅'); }
function b64enc(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64dec(b64){ return decodeURIComponent(escape(atob(String(b64).replace(/\s/g,'')))); }
function ghHeaders(cfg){ return { 'Authorization':'Bearer '+cfg.token, 'Accept':'application/vnd.github+json' }; }
async function ghGetFile(cfg){
  var r=await fetch(cfg.url,{headers:ghHeaders(cfg)});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('پاسخ گیت‌هاب: '+r.status);
  return await r.json();
}
function parseState(j){
  var data=JSON.parse(b64dec(j.content));
  if(!data||!data.db) throw new Error('ساختار فایل همگام‌سازی درست نیست');
  return data;
}
function markSynced(){ lastSyncAt=new Date().toISOString(); try{localStorage.setItem('dk_last_sync',lastSyncAt);}catch(e){} syncDirty=false; syncConflict=false; try{localStorage.removeItem('dk_dirty');}catch(e){} updateSyncDot(); }
/* نقطهٔ وضعیت همگام‌سازی در سربرگ + بنر غیرمسدودکنندهٔ تعارض */
function updateSyncDot(){
  var el=document.getElementById('syncStatus'); if(!el) return;
  var cfg=syncCfg();
  if(!cfg.token){ el.style.display='none'; el.textContent=''; return; }
  el.style.display='inline-flex';
  if(syncConflict){ el.className='syncst bad'; el.textContent='نیازمند بررسی'; }
  else if(syncDirty){ el.className='syncst wait'; el.textContent='در انتظار اتصال'; }
  else { el.className='syncst ok'; el.textContent='همگام ✓'; }
}
function showSyncBanner(txt){ var b=document.getElementById('syncBanner'), t=document.getElementById('syncBannerTxt'); if(!b||!t) return; t.textContent=txt; b.classList.add('show'); }
function hideSyncBanner(){ var b=document.getElementById('syncBanner'); if(b) b.classList.remove('show'); }
async function syncPull(silent){ if(syncBusy) return false; syncBusy=true; try{ return await syncPullCore(silent); } finally{ syncBusy=false; } }
async function syncPullCore(silent){
  var cfg=(curTab==='settings')?readCfgFromForm():syncCfg();
  if(!cfg.token){ if(!silent){ syncMsg('اول توکن گیت‌هاب را وارد و ذخیره کنید.',false); toast('توکن وارد نشده است',true);} return false; }
  try{
    var j=await ghGetFile(cfg);
    if(!j){ if(!silent) syncMsg('هنوز فایلی روی گیت‌هاب نیست؛ ابتدا «ذخیره در گیت‌هاب» را بزنید.',false); return false; }
    var data=parseState(j);
    var nd=data.db; nd.students=nd.students||[]; nd.exams=nd.exams||[]; nd.scores=nd.scores||{}; nd.plan=nd.plan||[]; nd.attendance=nd.attendance||[]; nd.groups=nd.groups||[]; nd.gacts=nd.gacts||[]; nd.acts=nd.acts||[]; nd.wallnews=nd.wallnews||[]; nd.quizzes=nd.quizzes||[]; nd.qscores=nd.qscores||{}; nd._rev=data.rev||0;
    db=nd; saveDb(); markSynced();
    if(curTab==='settings'){ render(); syncMsg('اطلاعات از گیت‌هاب دریافت و جایگزین شد ✅ (نسخهٔ '+fa(db._rev)+')',true); }
    else { render(); toast('همگام‌سازی انجام شد ✅'); }
    return true;
  }catch(e){
    if(!silent){ syncMsg('دریافت از گیت‌هاب انجام نشد: '+e.message+' — اطلاعات این دستگاه دست نخورده ماند.',false); toast('خطا در همگام‌سازی',true); }
    return false;
  }
}
async function syncPush(){ if(syncBusy) return false; syncBusy=true; try{ return await syncPushCore(); } finally{ syncBusy=false; } }
async function syncPushCore(){
  var cfg=readCfgFromForm();
  if(!cfg.token){ syncMsg('اول توکن گیت‌هاب را وارد و ذخیره کنید.',false); toast('توکن وارد نشده است',true); return false; }
  try{
    var j=await ghGetFile(cfg);
    var sha=null;
    if(j){
      var server=parseState(j);
      if((server.rev||0)!==(db._rev||0)){
        syncMsg('⚠️ نسخهٔ روی گیت‌هاب جدیدتر است (نسخهٔ '+fa(server.rev||0)+' در برابر نسخهٔ این دستگاه '+fa(db._rev||0)+'). برای جلوگیری از پاک شدن اطلاعات، اول «دریافت از گیت‌هاب» را بزنید؛ هیچ چیزی بازنویسی نشد.',false);
        toast('تعارض نسخه — اول دریافت کنید',true); return false;
      }
      sha=j.sha;
    }
    var newRev=(db._rev||0)+1;
    var payload={db:{students:db.students,exams:db.exams,scores:db.scores,plan:db.plan,attendance:db.attendance||[],groups:db.groups||[],gacts:db.gacts||[],acts:db.acts||[],wallnews:db.wallnews||[],quizzes:db.quizzes||[],qscores:db.qscores||{}},rev:newRev,updatedAt:new Date().toISOString()};
    var body={message:'dastyar-kelas sync rev '+newRev,content:b64enc(JSON.stringify(payload))};
    if(sha) body.sha=sha;
    var r=await fetch(cfg.url,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders(cfg)),body:JSON.stringify(body)});
    if(r.status===409||r.status===422){ syncMsg('⚠️ گیت‌هاب از ذخیره جلوگیری کرد (تعارض نسخه). اول «دریافت از گیت‌هاب» را بزنید؛ هیچ چیزی بازنویسی نشد.',false); toast('تعارض نسخه',true); return false; }
    if(!r.ok) throw new Error('پاسخ گیت‌هاب: '+r.status);
    db._rev=newRev; saveDb(); markSynced(); render();
    syncMsg('اطلاعات در گیت‌هاب ذخیره شد ✅ (نسخهٔ '+fa(newRev)+')',true); toast('در گیت‌هاب ذخیره شد ✅');
    return true;
  }catch(e){
    syncMsg('ذخیره در گیت‌هاب انجام نشد: '+e.message+' — اطلاعات این دستگاه سر جایش است.',false); toast('خطا در همگام‌سازی',true);
    return false;
  }
}
/* ===== همگام‌سازی خودکار (همان منطق fail-closed دستی؛ بدون بازنویسی در تعارض) ===== */
async function autoPush(){
  if(syncBusy) return;
  var cfg=syncCfg();
  if(!cfg.token||!cfg.url||!syncDirty){ updateSyncDot(); return; }
  if(navigator.onLine===false){ updateSyncDot(); return; }
  syncBusy=true;
  try{
    var j=await ghGetFile(cfg);
    var sha=null;
    if(j){
      var server=parseState(j);
      if((server.rev||0)!==(db._rev||0)){
        syncConflict=true; updateSyncDot();
        showSyncBanner('⚠️ نسخهٔ روی گیت‌هاب جدیدتر است (نسخهٔ '+fa(server.rev||0)+' در برابر نسخهٔ این دستگاه '+fa(db._rev||0)+'). برای جلوگیری از پاک شدن اطلاعات، اول از بخش تنظیمات «دریافت از گیت‌هاب» را بزنید؛ هیچ چیزی بازنویسی نشد.');
        return;
      }
      sha=j.sha;
    }
    var newRev=(db._rev||0)+1;
    var payload={db:{students:db.students,exams:db.exams,scores:db.scores,plan:db.plan,attendance:db.attendance||[],groups:db.groups||[],gacts:db.gacts||[],acts:db.acts||[],wallnews:db.wallnews||[],quizzes:db.quizzes||[],qscores:db.qscores||{}},rev:newRev,updatedAt:new Date().toISOString()};
    var body={message:'dastyar-kelas sync rev '+newRev,content:b64enc(JSON.stringify(payload))};
    if(sha) body.sha=sha;
    var r=await fetch(cfg.url,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders(cfg)),body:JSON.stringify(body)});
    if(r.status===409||r.status===422){
      syncConflict=true; updateSyncDot();
      showSyncBanner('⚠️ گیت‌هاب از ذخیرهٔ خودکار جلوگیری کرد (تعارض نسخه). اول از بخش تنظیمات «دریافت از گیت‌هاب» را بزنید؛ هیچ چیزی بازنویسی نشد.');
      return;
    }
    if(!r.ok) throw new Error('پاسخ گیت‌هاب: '+r.status);
    db._rev=newRev; saveDb(); markSynced(); hideSyncBanner();
  }catch(e){
    /* آفلاین یا خطای شبکه: پرچم کثیف می‌ماند و در فرصت بعدی دوباره تلاش می‌شود */
    updateSyncDot();
  }finally{ syncBusy=false; }
}
function maybeAutoSync(){
  var cfg=syncCfg();
  if(!cfg.token||!cfg.url||!syncDirty){ updateSyncDot(); return; }
  autoPush();
}
window.addEventListener('online',function(){ maybeAutoSync(); });
document.addEventListener('visibilitychange',function(){ if(!document.hidden) maybeAutoSync(); });

/* ===== فرمان صوتی (Web Speech API — fa-IR) =====
   ایمنی: هیچ فرمانی مستقیم نوشته نمی‌شود؛ اول کارت تأیید نشان داده می‌شود و فقط با «تأیید» ذخیره می‌شود. */
var NUMWORDS={'صفر':0,'یک':1,'دو':2,'سه':3,'چهار':4,'پنج':5,'شش':6,'هفت':7,'هشت':8,'نه':9,'ده':10,'یازده':11,'دوازده':12,'سیزده':13,'چهارده':14,'پانزده':15,'شانزده':16,'هفده':17,'هجده':18,'نوزده':19,'بیست':20};
function normFa(s){ return enDigits(String(s||'')).replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/ة/g,'ه').replace(/أ/g,'ا').replace(/إ/g,'ا').replace(/‌/g,' ').replace(/ـ/g,'').replace(/٫/g,'.').replace(/\s+/g,' ').trim(); }
function findVoiceNumber(t){
  var toks=t.split(' ');
  for(var i=0;i<toks.length;i++){
    var tk=toks[i].replace(/[«»"“”'،؛:؟?!.,]/g,'').replace(/[ٰٔ]/g,'');
    if(!tk) continue;
    if(/^[0-9]+(\.[0-9]+)?$/.test(tk)){ var v=parseFloat(tk); if(v>=0&&v<=20) return {value:v}; }
    if(tk==='نیم'||tk==='نیمه') return {value:0.5};
    if(Object.prototype.hasOwnProperty.call(NUMWORDS,tk)){
      var val=NUMWORDS[tk];
      var nx=(toks[i+1]||'').replace(/[«»"“”'،؛:؟?!.,]/g,''), nx2=(toks[i+2]||'').replace(/[«»"“”'،؛:؟?!.,]/g,'');
      if(nx==='و'&&(nx2==='نیم'||nx2==='نیمه')) val+=0.5;
      if(val>=0&&val<=20) return {value:val};
    }
  }
  return null;
}
function matchStudents(t){
  var scored=[];
  db.students.forEach(function(s){
    var full=normFa(s.name+' '+s.family), nm=normFa(s.name), fm=normFa(s.family), m=0;
    if(full&&t.indexOf(full)>=0) m=full.length+100;
    else if(fm&&fm.length>1&&t.indexOf(fm)>=0) m=fm.length+50;
    else if(nm&&nm.length>1&&t.indexOf(nm)>=0) m=nm.length;
    if(m>0) scored.push({s:s,m:m});
  });
  if(!scored.length) return [];
  scored.sort(function(a,b){ return b.m-a.m; });
  var top=scored[0].m;
  return scored.filter(function(x){ return x.m===top; }).map(function(x){ return x.s; });
}
function matchExam(t){
  var best=null, bm=0;
  db.exams.forEach(function(e){ var tt=normFa(e.title); if(tt&&t.indexOf(tt)>=0&&tt.length>bm){ best=e; bm=tt.length; } });
  if(best) return best;
  var byId={};
  db.exams.forEach(function(e){ var sb=normFa(e.subject); if(sb&&t.indexOf(sb)>=0) byId[e.id]=e; });
  var arr=Object.keys(byId).map(function(k){ return byId[k]; });
  if(arr.length===1) return arr[0];
  if(arr.length>1){ var sorted=examsSorted().filter(function(e){ return byId[e.id]; }); return sorted[sorted.length-1]; }
  return null;
}
function todayJalali(){
  try{
    var parts=new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()), y='',m='',d='';
    parts.forEach(function(p){ if(p.type==='year') y=p.value; else if(p.type==='month') m=p.value; else if(p.type==='day') d=p.value; });
    function pad(x){ x=enDigits(x); return x.length<2?('0'+x):x; }
    return fa(enDigits(y)+'/'+pad(m)+'/'+pad(d));
  }catch(e){ try{ return new Date().toLocaleDateString('fa-IR'); }catch(e2){ return ''; } }
}
function faFold(s){ return String(s||'').replace(/آ/g,'ا'); }
function matchSubject(t){
  var found=[];
  SUBJECTS.forEach(function(s){ var ns=normFa(s); if(ns&&t.indexOf(ns)>=0) found.push(s); });
  if(found.length===1) return found[0];
  if(found.length>1){
    found.sort(function(a,b){ return normFa(b).length-normFa(a).length; });
    if(normFa(found[0]).length>normFa(found[1]).length) return found[0];
  }
  return null;
}
function matchQuiz(t){
  var tf=faFold(t), best=null, bm=0;
  (db.quizzes||[]).forEach(function(q){ var tt=faFold(normFa(q.title)); if(tt&&tf.indexOf(tt)>=0&&tt.length>bm){ best=q; bm=tt.length; } });
  if(best) return best;
  var byId={};
  (db.quizzes||[]).forEach(function(q){ var sb=faFold(normFa(q.subject)); if(sb&&tf.indexOf(sb)>=0) byId[q.id]=q; });
  var arr=Object.keys(byId).map(function(k){ return byId[k]; });
  if(arr.length===1) return arr[0];
  if(arr.length>1){ var sorted=quizzesSorted().filter(function(q){ return byId[q.id]; }); return sorted[sorted.length-1]; }
  return null;
}
function parseVoice(raw){
  var heard=String(raw||'').trim();
  var t=normFa(heard);
  if(!t) return {ok:false,reason:'empty',heard:heard};
  var hasScoreWord=t.indexOf('نمره')>=0;
  function hasAny(list){ for(var i=0;i<list.length;i++) if(t.indexOf(list[i])>=0) return true; return false; }
  var isAbsent=hasAny(['غایب','غیبت','نیومده','نیامده','امروز نیست','نیست امروز']);
  var isLate=!isAbsent&&hasAny(['تاخیر','دیر اومده','دیراومده','دیر آمده','دیر کرده']);
  var isPresent=!isAbsent&&!isLate&&t.indexOf('حاضر')>=0;
  var isQuiz=t.indexOf('ازمونک')>=0||t.indexOf('آزمونک')>=0;
  var isDash=t.indexOf('داشبورد')>=0||t.indexOf('نشون')>=0||t.indexOf('نشان')>=0||t.indexOf('کارتابل')>=0||t.indexOf('وضعیت')>=0;
  /* همهٔ کلاس حاضرند */
  if(!hasScoreWord&&(t.indexOf('همه حاضر')>=0||t.indexOf('همه اومدن')>=0||t.indexOf('همه آمدن')>=0||t.indexOf('همه هستند')>=0)){
    return {ok:true,heard:heard,action:{type:'attall'}};
  }
  if((isAbsent||isLate||isPresent)&&!hasScoreWord){
    var ms=matchStudents(t), mark=isAbsent?'a':(isLate?'l':'p');
    if(!ms.length) return {ok:false,reason:'nostudent',heard:heard};
    if(ms.length>1) return {ok:false,reason:'ambstudent',heard:heard,candidates:ms,pending:{type:'att',mark:mark}};
    return {ok:true,heard:heard,action:{type:'att',studentId:ms[0].id,mark:mark}};
  }
  if(isDash&&!hasScoreWord){
    var md=matchStudents(t);
    if(!md.length) return {ok:false,reason:'nostudent',heard:heard};
    if(md.length>1) return {ok:false,reason:'ambstudent',heard:heard,candidates:md,pending:{type:'dash'}};
    return {ok:true,heard:heard,action:{type:'dash',studentId:md[0].id}};
  }
  if(isQuiz&&!matchStudents(t).length&&!findVoiceNumber(t)){
    /* «آزمونک ریاضی» — ساخت آزمونک تازه برای امروز */
    var subjV=matchSubject(t);
    if(!subjV) return {ok:false,reason:'nosubject',heard:heard};
    return {ok:true,heard:heard,action:{type:'newquiz',subject:subjV}};
  }
  if(isQuiz&&(hasScoreWord||findVoiceNumber(t))){
    if(!(db.quizzes||[]).length) return {ok:false,reason:'noquiz',heard:heard};
    var mq=matchStudents(t);
    if(!mq.length) return {ok:false,reason:'nostudent',heard:heard};
    var qz=matchQuiz(t);
    if(!qz){ var qsl=quizzesSorted(); qz=qsl.length?qsl[qsl.length-1]:null; }
    if(!qz) return {ok:false,reason:'noquiz',heard:heard};
    var tq=t.split('ازمونک').join(' ').split('آزمونک').join(' ')
      .split(normFa(qz.title)).join(' ').split(faFold(normFa(qz.title))).join(' ')
      .split(normFa(mq[0].name+' '+mq[0].family)).join(' ').split(normFa(mq[0].family)).join(' ').split(normFa(mq[0].name)).join(' ');
    var nq=findVoiceNumber(tq);
    if(!nq) return {ok:false,reason:'nonum',heard:heard};
    if(mq.length>1) return {ok:false,reason:'ambstudent',heard:heard,candidates:mq,pending:{type:'qscore',quizId:qz.id,value:nq.value}};
    return {ok:true,heard:heard,action:{type:'qscore',studentId:mq[0].id,quizId:qz.id,value:nq.value}};
  }
  if(hasScoreWord||findVoiceNumber(t)){
    var mn=matchStudents(t);
    if(!mn.length) return {ok:false,reason:'nostudent',heard:heard};
    var ex=matchExam(t);
    if(!ex){ var es=examsSorted(); ex=es.length?es[es.length-1]:null; }
    if(!ex) return {ok:false,reason:'noexam',heard:heard};
    /* عددِ داخل عنوان آزمون یا نام دانش‌آموز، نمره نیست؛ اول آن‌ها را از متن حذف کن، بعد عدد را بجوی */
    var t2=t.split(normFa(ex.title)).join(' ');
    t2=t2.split(normFa(mn[0].name+' '+mn[0].family)).join(' ').split(normFa(mn[0].family)).join(' ').split(normFa(mn[0].name)).join(' ');
    var num=findVoiceNumber(t2);
    if(!num) return {ok:false,reason:'nonum',heard:heard};
    if(mn.length>1) return {ok:false,reason:'ambstudent',heard:heard,candidates:mn,pending:{type:'score',examId:ex.id,value:num.value}};
    return {ok:true,heard:heard,action:{type:'score',studentId:mn[0].id,examId:ex.id,value:num.value}};
  }
  return {ok:false,reason:'unknown',heard:heard};
}

function cancelVoice(){ voicePending=null; voiceAmbPending=null; closeDlg(); }
function confirmVoice(){
  var a=voicePending; voicePending=null;
  if(!a){ closeDlg(); return; }
  if(a.type==='score'){
    if(!db.scores[a.examId]) db.scores[a.examId]={};
    db.scores[a.examId][a.studentId]=a.value;
    saveDb(); closeDlg(); render(); toast('نمره ثبت شد ✅');
  }else if(a.type==='newquiz'){
    if(!Array.isArray(db.quizzes)) db.quizzes=[];
    var nq2={id:uid(),title:'آزمونک '+a.subject,subject:a.subject,date:todayJalali()};
    db.quizzes.push(nq2);
    saveDb(); closeDlg(); go('exams'); quizGrid(nq2.id); toast('آزمونک ساخته شد ✅');
  }else if(a.type==='qscore'){
    if(!db.qscores) db.qscores={};
    if(!db.qscores[a.quizId]) db.qscores[a.quizId]={};
    db.qscores[a.quizId][a.studentId]=a.value;
    saveDb(); closeDlg(); render(); toast('نمرهٔ آزمونک ثبت شد ✅');
  }else if(a.type==='attall'){
    var da=todayJalali();
    if(!Array.isArray(db.attendance)) db.attendance=[];
    var sna=null;
    db.attendance.forEach(function(x){ if(x.date===da) sna=x; });
    if(!sna){ sna={id:uid(),date:da,marks:{}}; db.attendance.push(sna); }
    if(!sna.marks) sna.marks={};
    db.students.forEach(function(st){ sna.marks[st.id]='p'; });
    saveDb(); closeDlg(); render(); toast('همه حاضر ثبت شدند ✅');
  }else if(a.type==='att'){
    var d=todayJalali();
    if(!Array.isArray(db.attendance)) db.attendance=[];
    var sn=null;
    db.attendance.forEach(function(x){ if(x.date===d) sn=x; });
    if(!sn){ sn={id:uid(),date:d,marks:{}}; db.students.forEach(function(st){ sn.marks[st.id]='p'; }); db.attendance.push(sn); }
    if(!sn.marks) sn.marks={};
    sn.marks[a.studentId]=a.mark;
    saveDb(); closeDlg(); render(); toast('حضور و غیاب ثبت شد ✅');
  }else if(a.type==='dash'){
    closeDlg(); openStudent(a.studentId);
  }
}

var recogObj=null, voiceListening=false;
function voiceSupported(){ return !!(window.SpeechRecognition||window.webkitSpeechRecognition); }
function voiceNote(msg){
  var h=document.getElementById('voiceHint');
  if(h){ h.style.display='block'; h.textContent=msg; }
  toast(msg);
}
function voiceBtnHtml(){
  return '<button class="btn soft block voiceBtn" style="margin:0 0 12px" onclick="startVoice()">🎤 فرمان صوتی</button><p class="hint" id="voiceHint" style="display:none;margin:-6px 2px 10px"></p>';
}
function voiceBtnState(){
  document.querySelectorAll('.voiceBtn').forEach(function(b){
    b.textContent=voiceListening?'⏹ در حال گوش دادن… (برای توقف بزنید)':'🎤 فرمان صوتی';
    b.classList.toggle('listening',voiceListening);
  });
}
function startVoice(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ voiceNote('مرورگر شما فرمان صوتی ندارد'); return; }
  if(voiceListening&&recogObj){ try{ recogObj.stop(); }catch(e){} return; }
  try{ recogObj=new SR(); }catch(e){ voiceNote('مرورگر شما فرمان صوتی ندارد'); return; }
  recogObj.lang='fa-IR'; recogObj.continuous=false; recogObj.interimResults=false; recogObj.maxAlternatives=1;
  recogObj.onresult=function(ev){
    var txt='';
    for(var i=0;i<ev.results.length;i++){ txt+=ev.results[i][0].transcript; }
    if(txt.trim()) handleVoiceText(txt);
  };
  recogObj.onerror=function(ev){
    voiceListening=false; voiceBtnState();
    if(ev.error==='not-allowed'||ev.error==='service-not-allowed') voiceNote('دسترسی به میکروفون داده نشد');
    else if(ev.error==='no-speech') voiceNote('صدایی شنیده نشد؛ دوباره تلاش کنید');
    else if(ev.error!=='aborted') voiceNote('خطا در تشخیص صدا');
  };
  recogObj.onend=function(){ voiceListening=false; voiceBtnState(); };
  try{ recogObj.start(); voiceListening=true; voiceBtnState(); voiceNote('🎙 در حال گوش دادن… صحبت کنید'); }
  catch(e){ voiceListening=false; voiceBtnState(); }
}
